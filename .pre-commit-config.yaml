repos:
  # Standard Git operations and YAML formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: detect-private-key

  # Terraform formatting and validation
  - repo: local
    hooks:
      - id: terraform_fmt
        name: Terraform fmt
        entry: terraform fmt
        language: system
        files: '\.(tf|tfvars)$'
        exclude: '\.sops\.tfvars$'
        pass_filenames: true

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_validate
        args:
          - --args=-no-color

  # Secret scanning (Catches plaintext passwords before they hit GitHub)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
