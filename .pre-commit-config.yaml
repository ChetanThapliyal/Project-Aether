repos:
  # Standard Git operations and YAML formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Compose-specific !override tag; validated by `docker compose config`
        exclude: ^legacy-docker/oci-services/anytype\.override\.yml$
      - id: check-merge-conflict
      - id: detect-private-key

  # Terraform formatting and validation
  - repo: local
    hooks:
      - id: terraform_fmt
        name: Terraform fmt
        entry: terraform fmt
        language: system
        files: '\.(tf|tfvars)$'
        exclude: '\.sops\.tfvars$'
        pass_filenames: true

  - repo: local
    hooks:
      - id: check-sops-encryption
        name: Check SOPS Encryption State
        entry: scripts/check-sops-encryption.sh
        language: script
        files: '\.sops\.ya?ml$'
        exclude: '^\.sops\.ya?ml$'
        pass_filenames: true

  - repo: local
    hooks:
      - id: kubeconform
        name: Kubeconform Manifest Validation
        entry: kubeconform
        language: system
        files: '^kubernetes/.*\.ya?ml$'
        exclude: 'values\.yaml|kustomization\.yaml|\.sops\.ya?ml$|\.patch\.ya?ml$'   # patches are partial manifests by design
        args:
          - -summary
          - -ignore-missing-schemas
          - -schema-location
          - default
          - -schema-location
          - "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_validate
        args:
          - --args=-no-color

  # Secret scanning (Catches plaintext passwords before they hit GitHub)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: tracked-refs
        name: Ansible-referenced files are tracked by Git
        entry: scripts/check-tracked-refs.sh
        language: script
        pass_filenames: false
        files: ^infrastructure/ansible/
      - id: docs-index
        name: docs/README.md lists every document (5.56)
        entry: scripts/check-docs-index.py
        language: script
        pass_filenames: false
        files: ^docs/

  # 5.52: shell and YAML linting. Both hooks bring their own pinned binaries, so
  # the workstation and CI (validate.yml runs pre-commit) use the same versions.
  # Shell: the scripts/ files. Jinja templates (*.sh.j2) and shell embedded in
  # Ansible or ConfigMap YAML are not checked: they aren't valid shell until rendered.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # YAML: mistakes only (duplicate keys, broken indentation, bad syntax); style
  # rules are off in .yamllint.yaml.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
