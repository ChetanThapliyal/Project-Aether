version: 2
updates:
  # =============================================================================
  # Project Aether — Dependabot Configuration (FND-08)
  # =============================================================================
  # Compose images are pinned as tag@digest; Dependabot proposes the bump as a PR.
  # The old "docker" ecosystem read Dockerfiles, of which there are none, so it
  # never opened a PR.
  # =============================================================================
  - package-ecosystem: "docker-compose"
    directories:
      - "/infrastructure/docker/gcp-dmz"
      - "/legacy-docker/oci-services"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
