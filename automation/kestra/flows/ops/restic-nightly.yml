id: restic-nightly
namespace: aether.ops
description: Nightly Restic backup with PostgreSQL dumps, retention, and Uptime Kuma heartbeat.
labels:
  managed-by: git-sync

tasks:
  - id: backup
    type: io.kestra.plugin.scripts.shell.Commands
    description: Run the host backup script inside a container with Docker socket and host paths.
    timeout: PT2H
    retry:
      type: constant
      maxAttempts: 3
      interval: PT10M
      maxDuration: PT4H
      warningOnRetry: true
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      # Host networking lets the backup reach Tailnet hosts (Uptime Kuma)
      # and keeps S3/Restic traffic on the host network stack.
      networkMode: host
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /opt/backup:/opt/backup:ro
        - /home/ubuntu:/home/ubuntu
        # The offsite step (offsite-b2.sh, 5.61) needs rclone at the version the host pins (Alpine's is older and
        # B2's v1 API refuses bucket-scoped keys), plus zstd and age from apk below (INC-2026-020).
        - /usr/local/bin/rclone:/usr/local/bin/rclone:ro
    containerImage: docker:27-cli
    commands:
      - apk add --no-cache --quiet bash restic curl util-linux zstd age
      - bash /opt/backup/run-backup.sh

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    # Sole scheduler since FND-02 (root cron removed). 03:00 UTC = 08:30 IST.
    cron: "0 3 * * *"
    timezone: UTC

errors:
  - id: notify_failure
    type: io.kestra.plugin.telegram.TelegramSend
    token: "{{ secret('TELEGRAM_TOKEN') }}"
    channel: "{{ secret('TELEGRAM_CHAT_ID') }}"
    parseMode: HTML
    payload: |
      <b>Restic backup failed</b>
      Flow: <code>{{ flow.namespace }}/{{ flow.id }}</code>
      Execution: <code>{{ execution.id }}</code>
      Time: {{ now() }}
      {% for entry in errorLogs() %}{% if loop.index < 3 %}
      <code>{{ entry['message'] | abbreviate(200) | replace({'&': '&amp;'}) | replace({'<': '&lt;'}) | replace({'>': '&gt;'}) }}</code>{% endif %}{% endfor %}
