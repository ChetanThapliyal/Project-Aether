services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Your/Timezone
    volumes:
      - /your/media/path
      - /your/media/path
      - /your/media/path
    ports:
      - "8989:8989"
    labels:
      - "tsdproxy.enable=true"
      - "tsdproxy.name=sonarr"
      - "tsdproxy.container_port=8989"
    networks:
      - proxied-net
    restart: unless-stopped

networks:
  proxied-net:
    external: true
