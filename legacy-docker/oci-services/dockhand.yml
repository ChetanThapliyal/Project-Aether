services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    environment:
      - EXPORT_METRICS=true
      - PUID=1001
      - PGID=1001
    group_add:
      - "988" # Host Docker group ID for socket access
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    networks:
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "dockhand"
      tsdproxy.container_port: "3000"

networks:
  proxied-net:
    external: true
