services:
  dockhand:
    image: fnsys/dockhand:v1.0.57@sha256:4fd64d32728c99e5caf39b952a17d85448ee0b8ae76e0961f719ba2e19013988
    container_name: dockhand
    restart: unless-stopped
    environment:
      - EXPORT_METRICS=true
      - PUID=1001
      - PGID=1001
    group_add:
      - "988" # Host Docker group ID for socket access
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    networks:
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "dockhand"
      tsdproxy.container_port: "3000"
      tsdproxy.proxyprovider: "admin"   # FND-03: tags from the admin provider

networks:
  proxied-net:
    external: true
