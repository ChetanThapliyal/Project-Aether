services:
  node-exporter:
    image: prom/node-exporter:v1.12.1   # HARD-16: pinned to what ran on 11 Nov
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - default

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus-config:/etc/prometheus
      - ./prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      # No --web.enable-lifecycle (HARD-16): it gave anyone on the tailnet an
      # unauthenticated /-/quit and /-/reload. The handler uses docker restart.
    depends_on:
      - node-exporter
    networks:
      - default
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "prometheus"
      tsdproxy.container_port: "9090"
      tsdproxy.proxyprovider: "admin"   # FND-03: tags from the admin provider

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    env_file: [./grafana.env]   # admin password, rendered from SOPS by oci-monitoring.yml
    environment:
      - GF_SERVER_ROOT_URL=http://grafana.tail7067ab.ts.net
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Anonymous Viewer is scoped to the "Kiosk" org, for the Glance embed
      # (HARD-16). Put only public-safe dashboards there, with no datasources
      # beyond what they need. Until that org exists, anonymous requests get
      # 401; the main org is never visible without a login.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Kiosk
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    networks:
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "grafana"
      tsdproxy.container_port: "3000"
      tsdproxy.proxyprovider: "admin"   # FND-03: tags from the admin provider

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config:/etc/loki
      - ./loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - default
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "loki"
      tsdproxy.container_port: "3100"
      tsdproxy.proxyprovider: "admin"   # FND-03: tags from the admin provider

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager-config:/etc/alertmanager
      - ./alertmanager-data:/alertmanager
    networks:
      - default
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "alertmanager"
      tsdproxy.container_port: "9093"
      tsdproxy.proxyprovider: "admin"   # FND-03: tags from the admin provider

networks:
  proxied-net:
    external: true
