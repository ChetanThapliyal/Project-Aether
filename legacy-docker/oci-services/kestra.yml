services:
  kestra:
    image: kestra/kestra:latest
    container_name: kestra
    restart: unless-stopped
    command: server standalone
    # root required for Docker socket access (Process + Docker runner)
    user: "root"
    environment:
      KESTRA_CONFIGURATION: |
        datasource:
          url: jdbc:postgresql://kestra-postgres:5432/kestra
          driverClassName: org.postgresql.Driver
          username: kestra
          password: ${KESTRA_DB_PASSWORD}
        kestra:
          queue:
            type: postgres
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          webserver:
            basic-auth:
              enabled: true
              username: admin
              password: ${KESTRA_AUTH_PASSWORD}
          tasks:
            # Allows flows to use docker runner (e.g. terraform, ansible images)
            docker:
              volume-enabled: true
    volumes:
      - ./storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-workdir:/tmp/kestra-workdir:rw
    depends_on:
      kestra-postgres:
        condition: service_healthy
    networks:
      - default
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "kestra"
      tsdproxy.container_port: "8080"

  kestra-postgres:
    image: postgres:16
    container_name: kestra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  proxied-net:
    external: true
