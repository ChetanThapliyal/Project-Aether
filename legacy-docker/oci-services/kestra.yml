services:
  kestra:
    image: kestra/kestra:latest
    container_name: kestra
    restart: unless-stopped
    pull_policy: always
    command: server standalone
    # Kestra has a 5m default termination grace period; wait a little longer
    # to ensure no active tasks are killed mid-run on restart/deploy.
    stop_grace_period: 6m
    # root required for Docker socket access (Process + Docker runner)
    user: "root"
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD}
        kestra:
          queue:
            type: postgres
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          webserver:
            basic-auth:
              enabled: true
              username: ${KESTRA_AUTH_USER}
              password: ${KESTRA_AUTH_PASSWORD}
          url: https://kestra.tail7067ab.ts.net/
    volumes:
      - ./storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    depends_on:
      kestra-postgres:
        condition: service_healthy

    networks:
      - default
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "kestra"
      tsdproxy.container_port: "8080"

  kestra-postgres:
    image: postgres:16
    container_name: kestra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  proxied-net:
    external: true
