services:
  vikunja:
    image: vikunja/vikunja:2.6.0
    env_file:
      - .env
    ports:
      - 3456:3456
    volumes:
      - ./files:/app/vikunja/files
      - ./db:/db
    restart: unless-stopped
    networks:
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "vikunja"
      tsdproxy.container_port: "3456"

networks:
  proxied-net:
    external: true
