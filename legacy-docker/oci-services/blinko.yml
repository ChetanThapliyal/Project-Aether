services:
  blinko-website:
    image: blinkospace/blinko:latest
    container_name: blinko
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/.blinko
    networks:
      - default
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "blinko"
      tsdproxy.container_port: "1111"

  postgres:
    image: postgres:14
    container_name: blinko-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 5

networks:
  proxied-net:
    external: true
