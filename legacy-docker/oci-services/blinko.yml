services:
  blinko-website:
    image: blinkospace/blinko:1.8.9@sha256:ebbdcc375451570fad37319dea443c062d2a451a45d4f2ee0d98189d4b7615a5
    container_name: blinko
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/.blinko
    networks:
      - default
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "blinko"
      tsdproxy.container_port: "1111"

  postgres:
    image: postgres:14.24@sha256:834a046089d76edd1d2e81c4741f3ad5d1853646ededc86c2708936aad31c1ed
    container_name: blinko-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 5

networks:
  proxied-net:
    external: true
