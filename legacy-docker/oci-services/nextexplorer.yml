services:
  nextexplorer:
    image: nxzai/explorer:v4.0.1@sha256:3b3f441d3ea3c0b2ee3094c292dbc59a1fbf54b70a492f6d96513f99caf4facc
    container_name: nextexplorer
    restart: unless-stopped
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /home/ubuntu:/mnt/Files
    environment:
      - NODE_ENV=production
      - PUID=1001
      - PGID=1001
      - PUBLIC_URL=https://nextexplorer.tail7067ab.ts.net
    networks:
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "nextexplorer"
      tsdproxy.container_port: "3000"

networks:
  proxied-net:
    external: true
