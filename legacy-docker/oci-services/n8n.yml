services:
  n8n:
    image: n8nio/n8n:2.46.6@sha256:8602f5dfacbe2c931eeafd010de0e68182310e9f309921e780ab69182e92b3ae
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.tail7067ab.ts.net
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://n8n.tail7067ab.ts.net/
    volumes:
      - ./data:/home/node/.n8n
    networks:
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "n8n"
      tsdproxy.container_port: "5678"

networks:
  proxied-net:
    external: true
