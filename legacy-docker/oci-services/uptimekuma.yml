services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "uptimekuma"
      tsdproxy.container_port: "3001"
      tsdproxy.proxyprovider: "probe"   # FND-03: tags from the probe provider

networks:
  proxied-net:
    external: true
