services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.12@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "uptimekuma"
      tsdproxy.container_port: "3001"
      tsdproxy.proxyprovider: "probe"   # FND-03: tags from the probe provider

networks:
  proxied-net:
    external: true
