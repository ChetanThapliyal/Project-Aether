groups:
  - name: homelab-cluster-alerts
    rules:
      # ─── P0: Dead-Man's Switch (Total Homelab / Node Loss) ───
      - alert: HomelabNodeDown
        expr: up{job="k3s-node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          tier: homelab
        annotations:
          summary: "K3s node {{ $labels.instance }} is unreachable"
          description: "Node {{ $labels.instance }} has been unreachable via Tailscale for >2 minutes. Possible hardware or power failure."

      # ─── P0: Proxmox Physical Host Down ──────────────────────
      - alert: ProxmoxHostDown
        expr: up{job="proxmox-host"} == 0
        for: 2m
        labels:
          severity: critical
          tier: homelab
        annotations:
          summary: "Proxmox physical host {{ $labels.instance }} is unreachable"
          description: "Physical hypervisor host has been unreachable via Tailscale for >2 minutes. Possible total power or network outage."

      # ─── P1: Kube-State-Metrics Down ─────────────────────────
      - alert: KubeStateMetricsDown
        expr: up{job="k3s-kube-state-metrics"} == 0
        for: 1m
        labels:
          severity: warning
          tier: kubernetes
        annotations:
          summary: "Kube State Metrics target is unreachable"
          description: "Kube-state-metrics on K3s cluster is down for >1m."

      # ─── P2: Tailnet path to a scraped peer is relayed (INC-2026-011, INC-2026-017) ───
      # A relayed path stalls for minutes at a time and the scrape alerts above
      # flap. Moving the peer's tailscaled to a new UDP port has fixed it twice.
      - alert: TailnetPeerRelayed
        expr: aether_tailscale_peer_direct == 0
        for: 30m
        labels:
          severity: warning
          tier: homelab
        annotations:
          summary: "The monitoring host reaches {{ $labels.peer }} only through a Tailscale relay"
          description: "No direct path for 30 minutes, so scrapes of {{ $labels.peer }} will time out whenever the relay stalls. Check `tailscale ping` from the peer; if it stays on DERP, give that node a new tailscale_port in the inventory (INC-2026-011)."

      - alert: TailnetPathCheckStale
        expr: (time() - aether_tailscale_paths_timestamp_seconds > 600) or absent(aether_tailscale_paths_timestamp_seconds)
        for: 10m
        labels:
          severity: warning
          tier: homelab
        annotations:
          summary: "The tailnet path check on the monitoring host has stopped"
          description: "TailnetPeerRelayed can't fire. Check tailscale-path-metrics.timer on the cloud host and node exporter's textfile collector."

      # ─── P1: Kubernetes Node NotReady ────────────────────────
      - alert: K8sNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 3m
        labels:
          severity: critical
          tier: kubernetes
        annotations:
          summary: "Node {{ $labels.node }} is NotReady"
          description: "Kubelet reports node {{ $labels.node }} condition is not Ready for >3m."

      # ─── P1: Pod CrashLooping ────────────────────────────────
      - alert: K8sPodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[10m]) * 600 > 3
        for: 5m
        labels:
          severity: warning
          tier: kubernetes
        annotations:
          summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is crash-looping"
          description: "Container {{ $labels.container }} restarted more than 3 times in 10 minutes."

      # ─── P2: High Memory Pressure ────────────────────────────
      - alert: K8sWorkerMemoryHigh
        expr: (node_memory_MemTotal_bytes{job="k3s-node-exporter"} - node_memory_MemAvailable_bytes{job="k3s-node-exporter"}) / node_memory_MemTotal_bytes{job="k3s-node-exporter"} > 0.85
        for: 5m
        labels:
          severity: warning
          tier: kubernetes
        annotations:
          summary: "High memory utilization on {{ $labels.instance }}"
          description: "K3s node {{ $labels.instance }} memory usage is above 85% for >5m (~3.5 GB ceiling)."

      - alert: ProxmoxMemoryCritical
        expr: (node_memory_MemTotal_bytes{job="proxmox-host"} - node_memory_MemAvailable_bytes{job="proxmox-host"}) / node_memory_MemTotal_bytes{job="proxmox-host"} > 0.95
        for: 5m
        labels:
          severity: warning
          tier: homelab
        annotations:
          summary: "Proxmox hypervisor memory critically high on {{ $labels.instance }}"
          description: "Physical host {{ $labels.instance }} memory usage is above 95% for >5m."

      # ─── P1: SSD Storage Space Low ───────────────────────────
      - alert: K8sSSDDiskPressure
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: critical
          tier: homelab
        annotations:
          summary: "Root filesystem on {{ $labels.instance }} has <15% space"
          description: "Disk exhaustion risk on homelab SSD Tier 1."

  - name: platform-reconcilers
    rules:
      # ─── Meta: proves rule evaluation → Alertmanager → dispatch is alive ───
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
          tier: meta
        annotations:
          summary: "Always firing. If Uptime Kuma stops receiving it, the alert path is broken."

      # ─── GitOps: catches Bug V (Unknown) and drift (OutOfSync) ───
      - alert: ArgoAppNotSynced
        expr: argocd_app_info{sync_status!="Synced"} == 1
        for: 30m
        labels:
          severity: warning
          tier: gitops
        annotations:
          summary: "ArgoCD app {{ $labels.name }} is {{ $labels.sync_status }}"
          description: "Unknown = ArgoCD cannot diff the app: no auto-sync, no self-heal. Check .status.conditions."

      - alert: ArgoAppUnhealthy
        expr: argocd_app_info{health_status!~"Healthy|Progressing"} == 1
        for: 15m
        labels:
          severity: warning
          tier: gitops
        annotations:
          summary: "ArgoCD app {{ $labels.name }} health is {{ $labels.health_status }}"

      # ─── Crash loops that straddle an API outage (rate[10m] misses them) ───
      - alert: K8sPodRestartBurst
        expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
        for: 5m
        labels:
          severity: warning
          tier: kubernetes
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted >5 times in 1h"

  # FND-14
  - name: edge-alerts
    rules:
      - alert: DMZNodeDown
        expr: up{job="gcp-dmz-node"} == 0
        for: 5m
        labels:
          severity: warning
          tier: edge
        annotations:
          summary: "GCP DMZ node exporter is unreachable"
          description: "OCI Prometheus can't scrape aether-gcp-dmz:9100 for 5m. Check the node-exporter container on the DMZ and the tailnet grant tag:oci -> tag:gcp-dmz:9100."

  # Phase 04 task 4.20: the app platform (shared databases, app pods, app files)
  - name: app-platform-alerts
    rules:
      - alert: AppPodNotReady
        # Completed and failed Job pods are never "ready"; only running pods count.
        expr: |
          (kube_pod_status_ready{namespace=~"apps|databases", condition="true"} == 0)
          unless on (namespace, pod) (kube_pod_status_phase{phase=~"Succeeded|Failed"} == 1)
        for: 10m
        labels:
          severity: warning
          tier: apps
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} not ready for 10 minutes"

      - alert: AppDatabaseExporterDown
        expr: up{job=~"k3s-postgres|k3s-redis"} == 0
        for: 10m
        labels:
          severity: warning
          tier: apps
        annotations:
          summary: "{{ $labels.job }} metrics unreachable for 10 minutes"
          description: "OCI Prometheus can't scrape {{ $labels.instance }}. Check the db-exporters pod in the databases namespace and the tailnet grant tag:oci -> tag:k3s:30085,30086."

      - alert: AppPostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
          tier: apps
        annotations:
          summary: "Shared PostgreSQL is down: every app that uses it is down"

      - alert: AppRedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
          tier: apps
        annotations:
          summary: "Shared Redis is down: app queues and caches are unavailable"

      - alert: AppPostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 10m
        labels:
          severity: warning
          tier: apps
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections ({{ $value | humanizePercentage }})"
          description: "One app is probably leaking connections or its pool is too large; the next app to connect will be refused."

      - alert: AppRedisMemoryHigh
        # noeviction: a full Redis refuses writes (queued jobs fail) instead of dropping keys
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8 and redis_memory_max_bytes > 0
        for: 10m
        labels:
          severity: warning
          tier: apps
        annotations:
          summary: "Redis at {{ $value | humanizePercentage }} of its 96 MB cap; writes fail when full"

      - alert: AppFilesDatasetFilling
        expr: |
          aether_zfs_dataset_used_bytes{dataset="aether-pool/k8s-apps"}
            / aether_zfs_dataset_quota_bytes{dataset="aether-pool/k8s-apps"} > 0.85
        for: 15m
        labels:
          severity: warning
          tier: apps
        annotations:
          summary: "App files dataset at {{ $value | humanizePercentage }} of its quota"
          description: "Every nfs-zfs volume shares this dataset's quota. Raise it in proxmox-nfs.yml (check the pool first) or clean up. Above 20 GB the nightly offsite copy also stops (ADR-022)."

      - alert: AppSnapshotsStale
        expr: time() - aether_zfs_newest_snapshot_timestamp_seconds{dataset="aether-pool/k8s-apps"} > 3 * 3600
        for: 15m
        labels:
          severity: warning
          tier: apps
        annotations:
          summary: "No ZFS snapshot of the app files for {{ $value | humanizeDuration }}"
          description: "sanoid takes one every hour. Check sanoid.timer on the Proxmox host."

      - alert: ZFSMetricsStale
        expr: time() - node_textfile_mtime_seconds{file=~".*aether_zfs.prom"} > 900
        for: 10m
        labels:
          severity: warning
          tier: homelab
        annotations:
          summary: "ZFS dataset metrics on the Proxmox host have not refreshed for 15 minutes"
          description: "The app dataset alerts above are blind. Check zfs-textfile-metrics.timer on the Proxmox host."

  # INC-2026-014 follow-up: the hypervisor's disks and temperatures. The data disk
  # (a 2014 laptop HDD, sdb) holds every backup and app file; on 18 Nov it showed
  # 144 reallocated sectors and 526 historic uncorrectable errors, none recent.
  # These alert on change, not on the old baseline.
  - name: hypervisor-hardware-alerts
    rules:
      - alert: ZFSPoolNotOnline
        expr: node_zfs_zpool_state{state="online"} == 0
        for: 5m
        labels:
          severity: critical
          tier: homelab
        annotations:
          summary: "ZFS pool {{ $labels.zpool }} on the Proxmox host is not ONLINE"
          description: "Backups, app files and database dumps live on this pool. Run zpool status on the Proxmox host."

      - alert: ZFSPoolErrors
        expr: aether_zfs_pool_device_errors > 0 or aether_zfs_pool_scrub_errors > 0
        for: 5m
        labels:
          severity: critical
          tier: homelab
        annotations:
          summary: "ZFS pool {{ $labels.pool }} reports read, write or checksum errors"
          description: "The pool has no redundancy: an error may mean damaged data. Run zpool status -v on the Proxmox host and check the latest offsite copy."

      - alert: ZFSScrubOverdue
        expr: time() - aether_zfs_pool_last_scrub_timestamp_seconds > 45 * 86400
        for: 1h
        labels:
          severity: warning
          tier: homelab
        annotations:
          summary: "ZFS pool {{ $labels.pool }} has not completed a scrub for {{ $value | humanizeDuration }}"
          description: "Debian's zfsutils cron scrubs on the second Sunday of each month (gaps up to 35 days). A missed scrub means silent corruption could go unnoticed."

      - alert: DiskSmartFailing
        expr: smartmon_device_smart_healthy == 0
        for: 15m
        labels:
          severity: critical
          tier: homelab
        annotations:
          summary: "SMART says {{ $labels.disk }} on {{ $labels.instance }} is failing"
          description: "Replace the disk. If it is sdb, the ZFS pool with every backup is on it: check the offsite copies first."

      - alert: DiskSectorsDegrading
        # The raw counters are lifetime totals; alert when they grow, not on the old baseline.
        expr: |
          (smartmon_reallocated_sector_ct_raw_value - smartmon_reallocated_sector_ct_raw_value offset 1d > 0)
          or (smartmon_reported_uncorrect_raw_value - smartmon_reported_uncorrect_raw_value offset 1d > 0)
          or (smartmon_current_pending_sector_raw_value > 0)
          or (smartmon_offline_uncorrectable_raw_value > 0)
        for: 30m
        labels:
          severity: warning
          tier: homelab
        annotations:
          summary: "{{ $labels.disk }} on {{ $labels.instance }} is gaining bad sectors"
          description: "Reallocated, uncorrectable or pending sectors went up. A disk in this state can fail suddenly; plan a replacement."

      - alert: SmartMetricsStale
        expr: time() - smartmon_smartctl_run > 7200
        for: 15m
        labels:
          severity: warning
          tier: homelab
        annotations:
          summary: "SMART data for {{ $labels.disk }} has not refreshed for {{ $value | humanizeDuration }}"
          description: "The disk alerts are blind. Check prometheus-node-exporter-smartmon.timer on the Proxmox host."

      - alert: HypervisorTemperatureHigh
        expr: |
          max by (instance) (node_hwmon_temp_celsius{instance="homelab:9100", chip=~"platform_coretemp.*"}) > 90
          or max by (instance, disk) (smartmon_temperature_celsius_raw_value) > 55
        for: 10m
        labels:
          severity: warning
          tier: homelab
        annotations:
          summary: "The Proxmox host is running hot ({{ $value }} °C)"
          description: "CPU above 90 °C or a disk above 55 °C for 10 minutes. Check the fan and airflow under the laptop."
