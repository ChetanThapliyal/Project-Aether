services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:v2
    container_name: silverbullet
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SB_USER=${SB_USER}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./data/silverbullet:/space
    networks:
      - proxied-net
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "silverbullet"
      tsdproxy.container_port: "3000"

networks:
  proxied-net:
    external: true
