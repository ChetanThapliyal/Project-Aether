services:
  jellyfin-app:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Your/Timezone
    volumes:
      - /your/media/path
      - /your/media/path
      - /your/media/path
      - /your/media/path
      - /your/media/path
      - /your/media/path
      - /your/media/path
    ports:
      - "8096:8096"
    labels:
      - "tsdproxy.enable=true"
      - "tsdproxy.name=jellyfin"
      - "tsdproxy.container_port=8096"
    networks:
      - proxied-net
    restart: unless-stopped

networks:
  proxied-net:
    external: true
