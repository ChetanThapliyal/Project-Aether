x-server-discovery: &server-discovery
  NOTESNOOK_SERVER_PORT: 5264
  NOTESNOOK_SERVER_HOST: notesnook-server
  IDENTITY_SERVER_PORT: 8264
  IDENTITY_SERVER_HOST: identity-server
  SSE_SERVER_PORT: 7264
  SSE_SERVER_HOST: sse-server
  SELF_HOSTED: 1
  IDENTITY_SERVER_URL: ${AUTH_SERVER_PUBLIC_URL}
  NOTESNOOK_APP_HOST: ${NOTESNOOK_APP_PUBLIC_URL}

x-env-files: &env-files
  - .env

services:
  # Environment validation service
  validate:
    image: vandot/alpine-bash
    container_name: notesnook-validate
    entrypoint: /bin/bash
    env_file: *env-files
    command:
      - -c
      - |
        # List of required environment variables
        required_vars=(
          "INSTANCE_NAME"
          "NOTESNOOK_API_SECRET"
          "DISABLE_SIGNUPS"
          "SMTP_USERNAME"
          "SMTP_PASSWORD"
          "SMTP_HOST"
          "SMTP_PORT"
          "AUTH_SERVER_PUBLIC_URL"
          "NOTESNOOK_APP_PUBLIC_URL"
          "MONOGRAPH_PUBLIC_URL"
          "ATTACHMENTS_SERVER_PUBLIC_URL"
        )

        # Check each required environment variable
        for var in "$${required_vars[@]}"; do
          if [ -z "$${!var}" ]; then
            echo "Error: Required environment variable $$var is not set."
            exit 1
          fi
        done

        echo "All required environment variables are set."
    restart: "no"
    networks:
      - notesnook-internal
      - proxied-net

  # MongoDB database for Notesnook
  notesnook-db:
    image: mongo:7.0.12
    container_name: notesnook-db
    hostname: notesnook-db
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - notesnook-internal
      - proxied-net
    command: --replSet rs0 --bind_ip_all
    depends_on:
      validate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: echo 'try { rs.status() } catch (err) { rs.initiate() }; db.runCommand("ping").ok' | mongosh mongodb://localhost:27017 --quiet
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s

  # MinIO S3-compatible storage for attachments
  notesnook-s3:
    image: minio/minio:RELEASE.2024-07-29T22-14-52Z
    container_name: notesnook-s3
    networks:
      - notesnook-internal
      - proxied-net
    volumes:
      - ./data/s3:/data/s3
    environment:
      MINIO_BROWSER: "on"
    depends_on:
      validate:
        condition: service_completed_successfully
    env_file: *env-files
    command: server /data/s3 --console-address :9090
    restart: unless-stopped
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s

  # Setup S3 bucket
  setup-s3:
    image: minio/mc:RELEASE.2024-07-26T13-08-44Z
    container_name: notesnook-setup-s3
    depends_on:
      - notesnook-s3
    networks:
      - notesnook-internal
      - proxied-net
    entrypoint: /bin/bash
    env_file: *env-files
    command:
      - -c
      - |
        until mc alias set minio http://notesnook-s3:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
          sleep 1;
        done;
        mc mb minio/attachments -p

  # Identity/Authentication server (internal only)
  identity-server:
    image: streetwriters/identity:latest
    container_name: notesnook-identity
    networks:
      - notesnook-internal
      - proxied-net
    env_file: *env-files
    depends_on:
      - notesnook-db
    restart: unless-stopped
    healthcheck:
      test: wget --tries=1 -nv -q  http://localhost:8264/health -O- || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    labels:
      - "tsdproxy.enable=true"
      - "tsdproxy.name=notesnook-auth"
      - "tsdproxy.container_port=8264"
    environment:
      <<: *server-discovery
      MONGODB_CONNECTION_STRING: mongodb://notesnook-db:27017/identity?replSet=rs0
      MONGODB_DATABASE_NAME: identity

  # Main Notesnook sync server (ONLY service exposed via tsdproxy)
  notesnook-server:
    image: streetwriters/notesnook-sync:latest
    container_name: notesnook-server
    networks:
      - notesnook-internal
      - proxied-net
    env_file: *env-files
    depends_on:
      - notesnook-s3
      - setup-s3
      - identity-server
    restart: unless-stopped
    labels:
      - "tsdproxy.enable=true"
      - "tsdproxy.name=notesnook"
      - "tsdproxy.container_port=5264"
    healthcheck:
      test: wget --tries=1 -nv -q  http://localhost:5264/health -O- || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    volumes:
      # Add this line to persist the keys:
      - ./data/keys:/app/.aspnet/DataProtection-Keys
    environment:
      <<: *server-discovery
      MONGODB_CONNECTION_STRING: mongodb://notesnook-db:27017/?replSet=rs0
      MONGODB_DATABASE_NAME: notesnook
      S3_INTERNAL_SERVICE_URL: "http://notesnook-s3:9000"
      S3_INTERNAL_BUCKET_NAME: "attachments"
      S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      S3_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      S3_SERVICE_URL: "${ATTACHMENTS_SERVER_PUBLIC_URL}"
      S3_REGION: "us-east-1"
      S3_BUCKET_NAME: "attachments"

  # Server-Sent Events server for real-time sync (internal only)
  sse-server:
    image: streetwriters/sse:latest
    container_name: notesnook-sse
    env_file: *env-files
    depends_on:
      - identity-server
      - notesnook-server
    networks:
      - notesnook-internal
      - proxied-net
    restart: unless-stopped
    healthcheck:
      test: wget --tries=1 -nv -q  http://localhost:7264/health -O- || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    labels:
      - "tsdproxy.enable=true"
      - "tsdproxy.name=notesnook-sse"
      - "tsdproxy.container_port=7264"
    environment:
      <<: *server-discovery

  # Monograph server (for publishing notes - internal only)
  monograph-server:
    image: streetwriters/monograph:latest
    container_name: notesnook-monograph
    env_file: *env-files
    depends_on:
      - notesnook-server
    networks:
      - notesnook-internal
      - proxied-net
    restart: unless-stopped
    healthcheck:
      test: wget --tries=1 -nv -q  http://localhost:3000/api/health -O- || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    labels:
      - "tsdproxy.enable=true"
      - "tsdproxy.name=notesnook-mono"
      - "tsdproxy.container_port=3000"
    environment:
      <<: *server-discovery
      API_HOST: http://notesnook-server:5264
      PUBLIC_URL: ${MONOGRAPH_PUBLIC_URL}

  # Auto-heal unhealthy containers
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: notesnook-autoheal
    tty: true
    restart: unless-stopped
    environment:
      - AUTOHEAL_INTERVAL=60
      - AUTOHEAL_START_PERIOD=300
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    depends_on:
      validate:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - notesnook-internal
      - proxied-net

networks:
  notesnook-internal:
    driver: bridge
  proxied-net:
    external: true
