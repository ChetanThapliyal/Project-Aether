services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Your/Timezone
    volumes:
      - /your/media/path
      - /your/media/path
      - /your/media/path
    ports:
      - "7878:7878"
    labels:
      - "tsdproxy.enable=true"
      - "tsdproxy.name=radarr"
      - "tsdproxy.container_port=7878"
    networks:
      - proxied-net
    restart: unless-stopped

networks:
  proxied-net:
    external: true
