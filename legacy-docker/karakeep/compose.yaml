services:
  karakeep-app:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    restart: unless-stopped
    volumes:
      - /your/media/path
    # network_mode: service:karakeep-ts
    networks:
      - proxied-net
    # ports:
    #   - "3000"
    labels:
      - "tsdproxy.enable=true"
      - "tsdproxy.name=karakeep"
      - "tsdproxy.container_port=3000"
    environment:
      - MAX_ASSET_SIZE_MB=200
      - MEILI_ADDR=http://karakeep-meilisearch:7700
      - BROWSER_WEB_URL=http://karakeep-chrome:9222
      - NEXTAUTH_SECRET=<YOUR_NEXTAUTH_SECRET>
      - MEILI_MASTER_KEY=<YOUR_MEILI_MASTER_KEY>
      - NEXTAUTH_URL=https://karakeep.tail7067ab.ts.net
      - DATA_DIR=/data
      - CRAWLER_STORE_SCREENSHOT=true
      - CRAWLER_FULL_PAGE_SCREENSHOT=true
      - CRAWLER_ENABLE_ADBLOCKER=true
      - OPENAI_BASE_URL=https://api.perplexity.ai
      - OPENAI_API_KEY=<YOUR_OPENAI_API_KEY>
      - INFERENCE_TEXT_MODEL=sonar-pro
      - INFERENCE_IMAGE_MODEL=sonar-pro
  karakeep-chrome:
    image: gcr.io/zenika-hub/alpine-chrome:123
    container_name: karakeep-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    networks:
      - proxied-net
  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.13.3
    container_name: karakeep-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=<YOUR_MEILI_MASTER_KEY>
    volumes:
      - /your/media/path
    networks:
      - proxied-net

networks:
  proxied-net:
    external: true
