services:
  booklore:
    image: booklore/booklore:latest
    container_name: booklore
    environment:
      - USER_ID=${APP_USER_ID}
      - GROUP_ID=${APP_GROUP_ID}
      - TZ=Your/Timezone
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=YOUR_PASSWORD
      - BOOKLORE_PORT=${BOOKLORE_PORT}
    depends_on:
      booklore-db:
        condition: service_healthy
    ports:
      - "${BOOKLORE_PORT}:${BOOKLORE_PORT}"
    volumes:
      - ./data:/app/data
      - /your/media/path
      - ./bookdrop:/bookdrop
    restart: unless-stopped
    labels:
      - "tsdproxy.enable=true"
      - "tsdproxy.name=booklore"
      - "tsdproxy.container_port=${BOOKLORE_PORT}"
    networks:
      - proxied-net

  booklore-db:
    image: lscr.io/linuxserver/mariadb:11.4.5
    container_name: booklore-db
    environment:
      - PUID=1000${DB_USER_ID}
      - PGID=1000${DB_GROUP_ID}
      - TZ=Your/Timezone
      - MYSQL_ROOT_PASSWORD=YOUR_PASSWORD
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=YOUR_PASSWORD
    volumes:
      - ./config/mariadb/config:/config
    restart: unless-stopped
    networks:
      - proxied-net
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  proxied-net:
    external: true
