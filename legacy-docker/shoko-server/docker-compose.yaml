services:
  shoko_server:
    shm_size: 256m
    container_name: shoko_server
    image: ghcr.io/shokoanime/server:latest
    restart: always
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Your/Timezone
    ports:
      - "8111"
    volumes:
      - "./shoko-config:/home/user/.shoko"
      - "/your/media/path
    labels:
      - "tsdproxy.enable=true"
      - "tsdproxy.name=shoko"
      - "tsdproxy.container_port=8111"
    networks:
      - proxied-net

networks:
  proxied-net:
    external: true
