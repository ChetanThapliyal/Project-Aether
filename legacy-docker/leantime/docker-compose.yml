services:
  leantime_db:
    image: mysql:8.4
    container_name: leantime_db
    volumes:
      - ./db_data:/var/lib/mysql
    restart: unless-stopped
    env_file: ./.env                                        # Environment file with settings
    networks:
      - proxied-net
    command: --character-set-server=UTF8MB4 --collation-server=UTF8MB4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  leantime:
    container_name: leantime
    image: leantime/leantime:${LEAN_VERSION:-latest}
    restart: unless-stopped
    env_file: ./.env                                        # Environment file with settings
    # Add security options
    security_opt:
      - no-new-privileges:true
    # Add capabilities
    cap_add:
      # - CAP_NET_BIND_SERVICE
      - CAP_CHOWN
      - CAP_SETGID
      - CAP_SETUID
    ports:
      - "8080"
    networks:
      - proxied-net
    volumes:
      - ./public_userfiles:/var/www/html/public/userfiles     # Volume to store public files, logo etc
      - ./userfiles:/var/www/html/userfiles                   # Original volume name for compatibility
      - ./plugins:/var/www/html/app/Plugins                   # Plugin storage
      - ./logs:/var/www/html/storage/logs                     # Log storage
    labels:
      - "tsdproxy.enable=true"
      - "tsdproxy.name=leantime"
      - "tsdproxy.container_port=8080"
    depends_on:
      leantime_db:
        condition: service_healthy

  # Add a helper container for volume permissions
  # Run via docker compose --profile mysql_helper up -d

  mysql_helper:
    image: mysql:8.4
    command: chown -R mysql:mysql /var/lib/mysql
    volumes:
      - ./db_data:/var/lib/mysql
    user: root
    profiles: [ "helper" ]

volumes:
  db_data:
    external: false # Docker will manage these
  public_userfiles:
    external: false
  plugins:
    external: false
  logs:
    external: false

networks:
  proxied-net:
    external: true
