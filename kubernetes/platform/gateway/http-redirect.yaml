# Phase 04 task 4.19: plain HTTP on any lab name answers with a permanent redirect
# to HTTPS. App routes attach to the https listener only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab-https-redirect
  namespace: gateway-system
spec:
  parentRefs:
    - name: aether-gateway
      sectionName: http
  hostnames:
    - "*.lab.chetan-thapliyal.cloud"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
