# 4.16 exit check and a permanent synthetic probe (4.20): ping.lab answers from
# Envoy itself, no backend pod, so it tests DNS, tailnet path, certificate and
# gateway in one request and nothing else.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: ping-ok
  namespace: gateway-system
spec:
  directResponse:
    contentType: text/plain
    statusCode: 200
    body:
      type: Inline
      inline: "ok\n"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ping
  namespace: gateway-system
spec:
  parentRefs:
    - name: aether-gateway
      sectionName: https
  hostnames:
    - ping.lab.chetan-thapliyal.cloud
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: ping-ok
