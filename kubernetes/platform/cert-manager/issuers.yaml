apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aether-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: aether-internal-ca
  secretName: aether-root-ca-secret
  # HARD-09: a root CA, not a leaf. The defaults (90 days, rotationPolicy Always
  # since cert-manager v1.18) would re-key the root at every renewal and break
  # every client that trusts it. Keep the key; renew 30 days before expiry.
  duration: 87600h       # 10 years
  renewBefore: 720h      # 30 days
  privateKey:
    rotationPolicy: Never  # don't change algorithm or size here: that forces a new key
  issuerRef:
    name: selfsigned-root-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: aether-ca-issuer
spec:
  ca:
    secretName: aether-root-ca-secret
---
# Consumed by the Gateway's HTTPS listener (PLAT-04). Without this Certificate
# the listener stays ResolvedRefs=False forever.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aether-wildcard-cert
  namespace: gateway-system
spec:
  secretName: aether-wildcard-cert
  dnsNames:
    - "*.aether.local"   # replace with your internal DNS domain
    - "aether.local"
  issuerRef:
    name: aether-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
