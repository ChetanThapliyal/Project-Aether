# Phase 04 task 4.19: limits for the apps namespace, enforced by the API server.
# LimitRange: a container that sets no requests or limits gets these, so nothing
# runs unbounded. ResourceQuota: a ceiling for the whole namespace, sized so the
# apps can never take the memory the platform on the same workers needs
# (each worker has ~2.5 GiB allocatable since 4.32; the platform requests ~1.8 GiB
# of the 5 GiB). Limits may overcommit: eviction ranks apps before the platform.
apiVersion: v1
kind: LimitRange
metadata:
  name: app-defaults
  namespace: apps
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 25m, memory: 64Mi }
      default: { cpu: 500m, memory: 256Mi }
      max: { memory: 2Gi }   # the largest planned job (Remotion render)
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: apps-ceiling
  namespace: apps
spec:
  hard:
    requests.cpu: 1500m
    requests.memory: 2560Mi   # M8 Paperless: 640 Mi app + 256 Mi nightly export
    limits.memory: 6Gi
    pods: "40"
    persistentvolumeclaims: "20"
    services.loadbalancers: "0"   # apps are reached through the gateway only
    services.nodeports: "0"
