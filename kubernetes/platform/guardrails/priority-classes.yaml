# Phase 04 task 4.19: when a worker runs short, the scheduler evicts batch work
# first, then apps, and keeps the platform (databases, gateway) running.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform
value: 1000000
globalDefault: false
description: "Shared services every app depends on (databases, gateway). Evicted last."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: apps
value: 100000
globalDefault: false
description: "User-facing apps (set by the app-defaults component)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: batch
value: 1000
globalDefault: false
preemptionPolicy: Never   # waits for room instead of evicting anything
description: "One-off and scheduled jobs (renders, exports). Never displaces running work."
