apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argocd-traffic
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # 1. Ingress from Tailscale Operator proxy
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8080
    # 2. Ingress between internal ArgoCD components (Server, Repo, Redis, Controller)
    - from:
        - podSelector: {}
    # 3. Scrapes for OCI Prometheus (Controller 8082, Server 8083, Repo-server 8084)
    - ports:
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
