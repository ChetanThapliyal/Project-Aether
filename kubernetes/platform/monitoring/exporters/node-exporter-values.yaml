nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - operator: Exists
    effect: NoSchedule
hostNetwork: true
hostPID: true
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 50m
    memory: 32Mi
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
service:
  type: ClusterIP
  port: 9100
  targetPort: 9100
