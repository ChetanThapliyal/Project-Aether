apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smoke-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ChetanThapliyal/Project-Aether.git
    targetRevision: HEAD
    path: kubernetes/platform/smoke-test
    # Bug A fix: do NOT set plugin.name when the CMP defines a discover.find.glob rule.
    # ArgoCD CMP v2 auto-discovers the ksops-plugin sidecar when it finds ksops-secret.yaml.
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true   # Ensures `platform` namespace exists even if platform.yaml hasn't synced yet
