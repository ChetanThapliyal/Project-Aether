apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-apps
  namespace: argocd
  # No resources-finalizer (HARD-18): deleting root-apps must only orphan the
  # child Applications, never cascade into every workload they deploy.
spec:
  project: default
  source:
    repoURL: https://github.com/ChetanThapliyal/Project-Aether.git
    targetRevision: main
    path: kubernetes/cluster
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
