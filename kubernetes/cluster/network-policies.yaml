apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-network-policies
  namespace: argocd
  annotations:
    # GOP-06: a GitHub webhook refreshes only apps whose source path changed (INC-2026-013)
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ChetanThapliyal/Project-Aether.git
    targetRevision: main
    path: kubernetes/platform/network-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
