apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.14.8
    helm:
      valuesObject:
        controller:
          nodeSelector:
            kubernetes.io/hostname: k3s-worker-02
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi   # HARD-18: OOMKilled at 64Mi in the DR-05 reconnect storm; idles ~52Mi
        speaker:
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  # The metallb controller injects its own CA into the bgppeers conversion webhook.
  # The chart ships a placeholder, so without this ArgoCD and the controller overwrite
  # each other every ~6 min (found by HARD-06's ArgoAppNotSynced, 8 Nov).
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: bgppeers.metallb.io
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Also skip the field when syncing, or any other sync would write the placeholder back.
      - RespectIgnoreDifferences=true
