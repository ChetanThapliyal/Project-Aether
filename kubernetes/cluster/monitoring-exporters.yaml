apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-node-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-node-exporter
    targetRevision: 4.45.0
    helm:
      valuesObject:
        nodeSelector:
          kubernetes.io/os: linux
        tolerations:
          - operator: Exists
            effect: NoSchedule
        hostNetwork: true
        hostPID: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
        service:
          type: ClusterIP
          port: 9100
          targetPort: 9100
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-state-metrics
    targetRevision: 5.27.0
    helm:
      valuesObject:
        hostNetwork: true
        nodeSelector:
          kubernetes.io/hostname: k3s-worker-01
        resources:
          requests:
            cpu: 15m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
