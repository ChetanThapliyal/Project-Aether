apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.15.0
    helm:
      valuesObject:
        crds:
          create: false            # PodLogs CRD unused
        controller:
          type: daemonset
          # No hostNetwork (HARD-15): pods reach Loki over the tailnet through
          # the node's NAT, so the monitoring NetworkPolicy applies to Alloy.
          tolerations:
            - operator: Exists
              effect: NoSchedule
          volumes:
            extra:
              - name: alloy-data
                hostPath:
                  path: /var/lib/alloy
                  type: DirectoryOrCreate
        configReloader:
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits:   { cpu: 20m, memory: 48Mi }
        alloy:
          enableReporting: false   # no usage reports to Grafana Labs (egress is denied anyway)
          # Read positions live on the node, so a restart doesn't re-send every log.
          storagePath: /var/lib/alloy
          mounts:
            varlog: true           # read-only /var/log for /var/log/pods
            extra:
              - name: alloy-data
                mountPath: /var/lib/alloy
          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
          configMap:
            # Labels match the Promtail chart's defaults exactly, so streams,
            # dashboards and the LogShippingStalled rule carry over unchanged.
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("NODE_NAME")
                }
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_pod_controller_name"]
                  regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
                  target_label  = "__tmp_controller_name"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__tmp_controller_name", "__meta_kubernetes_pod_name"]
                  regex         = "^;*([^;]+)(;.*)?$"
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance", "__meta_kubernetes_pod_label_instance"]
                  regex         = "^;*([^;]+)(;.*)?$"
                  target_label  = "instance"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_component"]
                  regex         = "^;*([^;]+)(;.*)?$"
                  target_label  = "component"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node_name"     // HARD-06 LogShippingStalled depends on this label
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["namespace", "app"]
                  separator     = "/"
                  target_label  = "job"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
                rule {   // static pods log under their config hash, not their UID
                  source_labels = ["__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash", "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  regex         = "true/(.*)"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
              }

              local.file_match "pods" {
                path_targets = discovery.relabel.pods.output
              }

              loki.source.file "pods" {
                targets    = local.file_match.pods.targets
                forward_to = [loki.process.pods.receiver]
              }

              loki.process "pods" {
                stage.cri {}
                forward_to = [loki.write.oci.receiver]
              }

              loki.write "oci" {
                endpoint {
                  url = "http://100.68.99.53:3100/loki/api/v1/push"   // tailnet IP: see HARD-02 / 01.05 FND-03
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # No ServerSideApply: no CRDs installed (Convention C4)
