apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-namespaces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ChetanThapliyal/Project-Aether.git
    targetRevision: HEAD
    path: kubernetes/platform/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
