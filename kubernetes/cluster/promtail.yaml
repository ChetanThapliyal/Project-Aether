apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: promtail
    targetRevision: 6.16.6
    helm:
      valuesObject:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        config:
          clients:
            - url: http://bookorbit-net.tail7067ab.ts.net:3100/loki/api/v1/push
          snippets:
            pipelineStages:
              - cri: {}
        tolerations:
          - operator: Exists
            effect: NoSchedule
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 50m
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
