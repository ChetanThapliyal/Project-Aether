apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-ksops-config
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: ksops
    spec:
      version: v1.0
      discover:
        find:
          glob: "**/ksops-*.yaml"
      generate:
        command: ["sh", "-c"]
        args: ["kustomize build --enable-alpha-plugins --enable-exec ."]
