apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: it-tools
spec:
  parentRefs:
    - name: aether-gateway
      namespace: gateway-system
      sectionName: https   # HTTP is redirected for every lab name (gateway/http-redirect.yaml)
  hostnames:
    - it-tools.lab.chetan-thapliyal.cloud
  rules:
    - backendRefs:
        - { name: it-tools, port: 80 }
