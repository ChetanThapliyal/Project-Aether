apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: affine }
  strategy: { type: Recreate }   # one writer to the schema migrations
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affine
        aether.dev/postgres: "true"
        aether.dev/redis: "true"
        # Copilot (AI) providers, mail and link previews are outbound HTTPS.
        aether.dev/internet: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # the image's node user (the OCI copy ran as root)
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Schema and data migrations before every start (the compose file's affine-migration).
        - name: migrate
          image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
          command: ["node", "./scripts/self-host-predeploy.js"]
          env: &env
            - { name: HOME, value: /home/affine }   # AFFiNE keeps ~/.affine/{config,storage}
            - { name: AFFINE_SERVER_EXTERNAL_URL, value: https://affine.lab.chetan-thapliyal.cloud }
            - { name: AFFINE_SERVER_HTTPS, value: "true" }
            - { name: AFFINE_INDEXER_ENABLED, value: "false" }
            - { name: REDIS_SERVER_HOST, value: redis.databases.svc.cluster.local }
          envFrom: &envFrom
            - secretRef: { name: affine }   # DATABASE_URL, REDIS_SERVER_PASSWORD, AFFINE_PRIVATE_KEY
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: &mounts
            - { name: home, mountPath: /home/affine }
            - { name: storage, mountPath: /home/affine/.affine/storage }
            # ~/.affine is a root-owned mount point; config needs its own writable volume.
            # Nothing persistent lives there: the private key comes from the Secret.
            - { name: config, mountPath: /home/affine/.affine/config }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
          env: *env
          envFrom: *envFrom
          ports:
            - { name: http, containerPort: 3010 }
          startupProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 30
            failureThreshold: 4
          resources:   # 178 MiB idle on OCI; measure for a week here (tracker)
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext: *containerSecurity
          volumeMounts: *mounts
      volumes:
        - name: home
          emptyDir: { sizeLimit: 64Mi }
        - name: config
          emptyDir: { sizeLimit: 16Mi }
        - name: storage
          persistentVolumeClaim: { claimName: affine-storage }
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
