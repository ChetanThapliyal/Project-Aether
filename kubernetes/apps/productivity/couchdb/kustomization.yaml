# M4 CouchDB (Phase 04): backend for Obsidian Self-hosted LiveSync. Fresh install:
# the OCI copy held only system databases (P4-D7, 18 Nov), so nothing was migrated.
# Data on local-path (databases never go on NFS). NOT backed up yet: add a nightly
# copy before real vaults sync to it (tracker M4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
components:
  - ../../_components/app-defaults
labels:
  - pairs: { app.kubernetes.io/name: couchdb }
    includeSelectors: true
generators:
  - ksops-couchdb.yaml
resources:
  - config.yaml
  - statefulset.yaml
  - service.yaml
  - httproute.yaml
