# Nightly CouchDB export (ADR-022): every non-system database as JSON with its
# attachments, read back and counted, on nfs-zfs. The hypervisor snapshots that
# dataset and ships it to the Object Lock bucket at 04:00, and its APP-01 heartbeat
# also requires this export's LAST_SUCCESS to be under 26 h old.
# Restore one database: python3 /scripts/restore.py <dump.json> <new-db-name>
# (from a pod with this ConfigMap and the backup volume mounted; see restore.py).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-backup
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-zfs
  resources:
    requests: { storage: 2Gi }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-backup-scripts
data:
  export.py: |
    """Export every non-system CouchDB database; refuse to mark success unless each
    file reads back and its live document count matches CouchDB's own count."""
    import base64, datetime, json, os, pathlib, shutil, urllib.parse, urllib.request

    BASE = os.environ["COUCH_URL"]
    AUTH = "Basic " + base64.b64encode(f'{os.environ["COUCHDB_USER"]}:{os.environ["COUCHDB_PASSWORD"]}'.encode()).decode()
    ROOT = pathlib.Path("/backup")
    KEEP = 7

    def get(path):
        req = urllib.request.Request(BASE + path, headers={"Authorization": AUTH, "Accept": "application/json"})
        with urllib.request.urlopen(req, timeout=600) as r:
            return json.load(r)

    day = datetime.date.today().isoformat()
    out, tmp = ROOT / day, ROOT / f".tmp-{day}"
    shutil.rmtree(tmp, ignore_errors=True)
    tmp.mkdir(parents=True)
    dbs = [d for d in get("/_all_dbs") if not d.startswith("_")]
    counts, total = {}, 0
    for db in dbs:
        q = urllib.parse.quote(db, safe="")
        expected = get(f"/{q}")["doc_count"]
        rows = get(f"/{q}/_all_docs?include_docs=true&attachments=true")["rows"]
        path = tmp / f"{q}.json"
        path.write_text(json.dumps({"db": db, "docs": [r["doc"] for r in rows]}))
        got = len(json.loads(path.read_text())["docs"])          # read it back
        if got != expected:
            raise SystemExit(f"FAIL {db}: exported {got} docs, CouchDB reports {expected}")
        counts[db] = got; total += got
        print(f"{db}: {got} docs, {path.stat().st_size} bytes")
    (tmp / "counts.json").write_text(json.dumps(counts, indent=1))
    shutil.rmtree(out, ignore_errors=True)
    tmp.rename(out)
    for old in sorted(p for p in ROOT.iterdir() if p.is_dir() and p.name[:2] == "20")[:-KEEP]:
        shutil.rmtree(old)
    size = sum(f.stat().st_size for f in out.iterdir())
    marker = f"{datetime.datetime.now(datetime.timezone.utc):%Y-%m-%dT%H:%M:%SZ} {day} databases={len(dbs)} docs={total} bytes={size}\n"
    (ROOT / "LAST_SUCCESS.tmp").write_text(marker)
    (ROOT / "LAST_SUCCESS.tmp").rename(ROOT / "LAST_SUCCESS")
    print("OK", marker.strip())
  restore.py: |
    """Restore one exported database into a NEW database (never over a live one):
       python3 /scripts/restore.py /backup/<day>/<db>.json <new-db-name>
    Revisions are kept (new_edits=false), so LiveSync clients see the same history."""
    import base64, json, os, sys, urllib.parse, urllib.request
    BASE = os.environ["COUCH_URL"]
    AUTH = "Basic " + base64.b64encode(f'{os.environ["COUCHDB_USER"]}:{os.environ["COUCHDB_PASSWORD"]}'.encode()).decode()
    def call(method, path, body=None):
        req = urllib.request.Request(BASE + path, method=method, headers={"Authorization": AUTH, "Content-Type": "application/json"},
                                     data=None if body is None else json.dumps(body).encode())
        with urllib.request.urlopen(req, timeout=600) as r:
            return json.load(r)
    dump, target = json.load(open(sys.argv[1])), urllib.parse.quote(sys.argv[2], safe="")
    call("PUT", f"/{target}")                                   # fails if it exists: by design
    for i in range(0, len(dump["docs"]), 500):
        res = call("POST", f"/{target}/_bulk_docs", {"docs": dump["docs"][i:i + 500], "new_edits": False})
        bad = [r for r in res if "error" in r]
        if bad:
            raise SystemExit(f"FAIL: {bad[:3]}")
    n = call("GET", f"/{target}")["doc_count"]
    print(f"restored {n} docs into {sys.argv[2]} (dump had {len(dump['docs'])})")
    sys.exit(0 if n == len(dump["docs"]) else 1)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: couchdb-backup
spec:
  schedule: "45 1 * * *"          # after the 01:30 PostgreSQL dumps, before the 04:00 offsite copy
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: couchdb-backup   # NOT couchdb: the Service must never select this pod
        spec:
          restartPolicy: Never
          priorityClassName: batch
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 5984
            runAsGroup: 5984
            fsGroup: 5984
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: export
              image: python:3.13.18-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
              command: ["python3", "-u", "/scripts/export.py"]
              env:
                - { name: COUCH_URL, value: http://couchdb.apps.svc.cluster.local }
              envFrom:
                - secretRef: { name: couchdb }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 500m, memory: 512Mi }   # each database is held in memory once
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: backup, mountPath: /backup }
          volumes:
            - name: scripts
              configMap: { name: couchdb-backup-scripts }
            - name: backup
              persistentVolumeClaim: { claimName: couchdb-backup }
