apiVersion: apps/v1
kind: Deployment
metadata:
  name: blinko
spec:
  replicas: 0   # M2 cutover: 0 until the OCI data is restored, then 1
  selector:
    matchLabels: { app.kubernetes.io/name: blinko }
  strategy: { type: Recreate }   # one writer to the files and the schema migrations
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blinko
        aether.dev/postgres: "true"
        aether.dev/redis: "false"
        # AI providers, link previews and the plugin marketplace are all outbound HTTPS.
        aether.dev/internet: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # the image's node user (the OCI copy ran as root)
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: blinko
          image: blinkospace/blinko:1.8.9@sha256:ebbdcc375451570fad37319dea443c062d2a451a45d4f2ee0d98189d4b7615a5
          env:
            - { name: NODE_ENV, value: production }
            - { name: NEXTAUTH_URL, value: https://blinko.lab.chetan-thapliyal.cloud }
            - { name: NEXT_PUBLIC_BASE_URL, value: https://blinko.lab.chetan-thapliyal.cloud }
            - { name: HOME, value: /tmp }               # npx and prisma write caches under HOME
            - { name: CHECKPOINT_DISABLE, value: "1" }  # no Prisma telemetry
            - { name: NPM_CONFIG_UPDATE_NOTIFIER, value: "false" }
          envFrom:
            - secretRef: { name: blinko }   # DATABASE_URL, NEXTAUTH_SECRET
          ports:
            - { name: http, containerPort: 1111 }
          startupProbe:   # migrations and seed run before the server listens
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
          resources:   # 139 MiB idle on OCI
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /app/.blinko }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: blinko-data }
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
