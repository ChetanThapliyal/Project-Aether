apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: myapp }
  strategy: { type: Recreate }   # one replica with a RWO volume: never two at once
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myapp
        # Egress is opt-in (network-policies/apps-egress.yaml). Keep only what the app needs:
        aether.dev/postgres: "false"
        aether.dev/redis: "false"
        aether.dev/internet: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: myapp
          image: REGISTRY/IMAGE:TAG@sha256:DIGEST   # tag AND digest: Renovate updates both (4.21)
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:   # measure idle and busy use, then set; the LimitRange is only a fallback
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
