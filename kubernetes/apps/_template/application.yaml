# Goes to kubernetes/cluster/app-myapp.yaml (the root app picks up every file there).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-myapp
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-wave: "5"   # after platform, databases and guardrails
spec:
  project: default
  source:
    repoURL: https://github.com/ChetanThapliyal/Project-Aether.git
    targetRevision: main
    path: kubernetes/apps/<group>/myapp
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
