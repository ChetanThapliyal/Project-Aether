# =============================================================================
# K3s Workers — Join Cluster
# =============================================================================
# Retrieves the node token from the control plane and joins each worker
# to the cluster as a K3s agent.
# =============================================================================

# First, fetch the token from the control node
- name: Retrieve node token from control plane
  hosts: control
  become: true

  tasks:
    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token

    - name: Store node token as fact
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_token.content | b64decode | trim }}"

# Then, join workers using the token
- name: Join worker nodes to K3s cluster
  hosts: workers
  become: true

  vars:
    k3s_version: "v1.36.4+k3s1"
    k3s_server_url: "https://192.168.1.51:6443"
    k3s_token: "{{ hostvars['k3s-control-01']['k3s_node_token'] }}"

  tasks:
    - name: Check if K3s agent is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install K3s agent
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          K3S_URL="{{ k3s_server_url }}" \
          K3S_TOKEN="{{ k3s_token }}" \
          sh -s - agent
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_binary.stat.exists

    - name: Wait for K3s agent to be running
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        enabled: true

# Finally, verify all nodes joined
- name: Verify cluster membership
  hosts: control
  become: true

  tasks:
    - name: Wait for all nodes to appear
      ansible.builtin.shell: |
        k3s kubectl get nodes --no-headers | wc -l
      register: node_count
      until: node_count.stdout | int >= 3
      retries: 30
      delay: 10
      changed_when: false

    - name: Display cluster nodes
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: cluster_nodes
      changed_when: false

    - name: Show cluster status
      ansible.builtin.debug:
        msg: "{{ cluster_nodes.stdout_lines }}"
