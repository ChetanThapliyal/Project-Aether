          NODE_ENV={{ oci_blinko_node_env }}
          NEXTAUTH_URL={{ oci_blinko_nextauth_url }}
          NEXT_PUBLIC_BASE_URL={{ oci_blinko_next_public_base_url }}
          NEXTAUTH_SECRET={{ oci_blinko_nextauth_secret }}
          POSTGRES_USER={{ oci_blinko_postgres_user }}
          POSTGRES_PASSWORD={{ oci_blinko_postgres_password }}
          POSTGRES_DB={{ oci_blinko_postgres_db }}
