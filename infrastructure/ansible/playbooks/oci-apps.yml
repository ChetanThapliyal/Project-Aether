    # ─── CouchDB (Obsidian LiveSync) ────────────────────────
    - name: Create couchdb directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "5984"
        group: "5984"
      loop:
        - "{{ app_base_dir }}/couchdb"
        - "{{ app_base_dir }}/couchdb/data"
        - "{{ app_base_dir }}/couchdb/etc"
        - "{{ app_base_dir }}/couchdb/etc/local.d"
      tags: [couchdb, apps]

    - name: Copy couchdb compose file
      copy:
        src: ../../../legacy-docker/oci-services/couchdb.yml
        dest: "{{ app_base_dir }}/couchdb/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
      tags: [couchdb, apps]

    - name: Copy couchdb env file
      copy:
        content: |
          COUCHDB_USER={{ oci_couchdb_user }}
          COUCHDB_PASSWORD={{ oci_couchdb_password }}
        dest: "{{ app_base_dir }}/couchdb/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
      no_log: true
      tags: [couchdb, apps]

    - name: Copy couchdb CORS config
      copy:
        content: |
          [couchdb]
          single_node = true

          [chttpd]
          max_http_request_size = 4294967296
          bind_address = 0.0.0.0

          [cors]
          credentials = true
          origins = app://obsidian.md,capacitor://localhost,http://localhost
          headers = accept, authorization, content-type, origin, referer
          methods = GET, PUT, POST, HEAD, DELETE
          max_age = 3600
        dest: "{{ app_base_dir }}/couchdb/etc/local.d/docker.ini"
        owner: "5984"
        group: "5984"
        mode: "0644"
      tags: [couchdb, apps]

    - name: Start couchdb
      community.docker.docker_compose_v2:
        project_src: "{{ app_base_dir }}/couchdb"
        state: present
        pull: always
      tags: [couchdb, apps]

