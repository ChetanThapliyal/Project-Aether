---
# =============================================================================
# OCI Applications Playbook
# =============================================================================
# Manages Docker Compose deployments for self-hosted applications on OCI.
# Each application is tagged with both its service name and the general 'apps'
# tag, enabling targeted single-service deploys or full application sweeps.
#
# Examples:
#   ansible-playbook playbooks/oci-apps.yml --tags n8n
#   ansible-playbook playbooks/oci-apps.yml --tags apps
# =============================================================================

- name: Deploy OCI applications
  hosts: bookorbit
  become: true

  vars:
    app_user: "{{ hostvars[inventory_hostname].app_user | default(ansible_user | default('ubuntu')) }}"
    app_base_dir: "{{ hostvars[inventory_hostname].app_base_dir | default('/home/' ~ app_user) }}"
    docker_network: proxied-net

  tasks:
    # ─── Load SOPS Secrets ──────────────────────────────
    - name: Load SOPS-encrypted secrets
      community.sops.load_vars:
        file: ../../secrets/ansible-secrets.sops.yaml
      tags: [always]

    # ─── bookorbit (Book Management) ────────────────────
    - name: Create bookorbit directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
      loop:
        - "{{ app_base_dir }}/bookorbit"
        - "{{ app_base_dir }}/bookorbit/data/app"
        - "{{ app_base_dir }}/bookorbit/data/postgres"
        - "{{ app_base_dir }}/bookorbit/books"
      tags: [bookorbit, apps]

    - name: Copy bookorbit compose file
      copy:
        src: ../../../legacy-docker/oci-services/bookorbit.yml
        dest: "{{ app_base_dir }}/bookorbit/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
      tags: [bookorbit, apps]

    - name: Copy bookorbit env file
      copy:
        content: |
          APP_IMAGE={{ oci_bookorbit_app_image }}
          APP_PORT={{ oci_bookorbit_app_port }}
          BOOKS_HOST_PATH={{ oci_bookorbit_books_host_path }}
          PUID={{ oci_bookorbit_puid }}
          PGID={{ oci_bookorbit_pgid }}
          POSTGRES_USER={{ oci_bookorbit_postgres_user }}
          POSTGRES_PASSWORD={{ oci_bookorbit_postgres_password }}
          POSTGRES_DB={{ oci_bookorbit_postgres_db }}
          JWT_SECRET={{ oci_bookorbit_jwt_secret }}
          SETUP_BOOTSTRAP_TOKEN={{ oci_bookorbit_setup_bootstrap_token }}
          APP_URL={{ oci_bookorbit_app_url }}
          NODE_MAX_OLD_SPACE_SIZE={{ oci_bookorbit_node_max_old_space_size }}
        dest: "{{ app_base_dir }}/bookorbit/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
      no_log: true
      tags: [bookorbit, apps]

    - name: Start bookorbit
      community.docker.docker_compose_v2:
        project_src: "{{ app_base_dir }}/bookorbit"
        state: present
        pull: always
      tags: [bookorbit, apps]

    # ─── vikunja (Task Management) ──────────────────────
    # - name: Create vikunja directories
