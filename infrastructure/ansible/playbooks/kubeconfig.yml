# =============================================================================
# Kubeconfig — Fetch From Control Plane
# =============================================================================
# Pulls the kubeconfig from the K3s control node, rewrites the server
# address from 127.0.0.1 to the control node's actual IP, and saves
# it locally at ~/.kube/config.
# =============================================================================

- name: Fetch kubeconfig from K3s control plane
  hosts: control
  become: true

  vars:
    control_ip: "192.168.1.51"
    local_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/config"

  tasks:
    - name: Read kubeconfig from control node
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_raw

    - name: Decode kubeconfig
      ansible.builtin.set_fact:
        kubeconfig_content: "{{ kubeconfig_raw.content | b64decode | regex_replace('127\\.0\\.0\\.1', control_ip) }}"

    - name: Ensure local ~/.kube directory exists
      ansible.builtin.file:
        path: "{{ local_kubeconfig | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Write kubeconfig to local machine
      ansible.builtin.copy:
        content: "{{ kubeconfig_content }}"
        dest: "{{ local_kubeconfig }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Verify kubectl works locally
      ansible.builtin.command: kubectl get nodes
      delegate_to: localhost
      become: false
      register: kubectl_output
      changed_when: false

    - name: Show cluster access confirmation
      ansible.builtin.debug:
        msg: "{{ kubectl_output.stdout_lines }}"
