---
# =============================================================================
# Project Aether — DR-04: Backblaze B2 Offsite Restic Replication on Proxmox
# =============================================================================
# Implements Task 3.19 / Decision P3-D3:
# Automates offsite replication of encrypted K3s etcd Restic snapshots from
# Proxmox host storage (/mnt/aether-pool/restic-k3s-etcd) to Backblaze B2
# (b2:aether-restic-etcd-offsite:/) using native `restic copy`.
#
# Examples:
#   ansible-playbook playbooks/proxmox-etcd-b2.yml
#   task ansible:etcd:b2
#
# HARD-12: the immutable copy is now the age-encrypted upload to the Object Lock
# bucket (Terraform 04-backblaze-b2, etcd_offsite_locked). The restic copy to the
# old bucket runs alongside it until the new restore path is drilled, then it's
# removed with that bucket.
# =============================================================================

- name: Configure Backblaze B2 Offsite Restic Replication on Proxmox Host
  hosts: proxmox
  become: true

  vars:
    rclone_version: v1.75.2 # bump together with the checksum below

  tasks:
    - name: HARD-23 | Refuse to run unless the DR paths are ZFS datasets on aether-pool
      # Runs before any file: state=directory task, which would otherwise recreate
      # a plain directory on the SSD (pve-root) if a dataset failed to mount.
      ansible.builtin.command: findmnt -n -o FSTYPE,SOURCE --target {{ item }}
      loop:
        - /mnt/aether-pool/k3s-etcd-snapshots
        - /mnt/aether-pool/restic-k3s-etcd
      register: dr_fs
      changed_when: false
      check_mode: false
      failed_when: dr_fs.rc != 0 or dr_fs.stdout.split() != ['zfs', 'aether-pool/' ~ (item | basename)]

    # ─── Step 1: Load SOPS Secrets ───────────────────────────────────────────
    - name: Load SOPS-encrypted secrets from group_vars
      community.sops.load_vars:
        file: ../group_vars/proxmox/vault.yaml
      ignore_errors: true

    - name: Load SOPS-encrypted secrets from global secrets
      community.sops.load_vars:
        file: ../../secrets/ansible-secrets.sops.yaml
      ignore_errors: true

    - name: Verify required Backblaze B2 credentials exist
      ansible.builtin.assert:
        that:
          - b2_application_key_id is defined
          - b2_application_key is defined
          - restic_b2_password is defined
          - kuma_push_base is defined
          - kuma_push_tokens is defined and kuma_push_tokens.etcd_b2 is defined
        fail_msg: "Required variables (b2_application_key_id, b2_application_key, restic_b2_password, kuma_push_base, kuma_push_tokens.etcd_b2) are missing from SOPS vault!"

    - name: HARD-12 | Require the upload-only key and the DR age recipient
      ansible.builtin.assert:
        that:
          - b2_offsite_upload_key_id | default('') | length > 0
          - b2_offsite_upload_key | default('') | length > 0
          - dr_offsite_age_recipient | default('') is match('^age1[0-9a-z]{58}$')
        fail_msg: >-
          b2_offsite_upload_key_id / b2_offsite_upload_key (terraform output in 04-backblaze-b2)
          or dr_offsite_age_recipient (public half of dr_offsite_age_identity) are missing
          from group_vars/proxmox/vault.yaml.
        quiet: true

    - name: HARD-12 | Install age (and unzip for the rclone release)
      ansible.builtin.apt:
        name: [age, unzip]
        state: present

    # Debian's rclone (1.60) authorises with B2 API v1, which B2 rejects for keys
    # created by current Terraform ("not currently supported on API version
    # number 1"). Use a pinned upstream release; sha256 from SHA256SUMS and the
    # GitHub asset digest, which agree.
    - name: HARD-12 | Remove Debian's rclone
      ansible.builtin.apt:
        name: rclone
        state: absent

    - name: HARD-12 | Download rclone {{ rclone_version }}
      ansible.builtin.get_url:
        url: "https://downloads.rclone.org/{{ rclone_version }}/rclone-{{ rclone_version }}-linux-amd64.zip"
        dest: "/var/cache/rclone-{{ rclone_version }}-linux-amd64.zip"
        checksum: "sha256:349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702"
        mode: "0644"

    - name: HARD-12 | Unpack rclone {{ rclone_version }}
      ansible.builtin.unarchive:
        src: "/var/cache/rclone-{{ rclone_version }}-linux-amd64.zip"
        dest: /opt
        remote_src: true
        creates: "/opt/rclone-{{ rclone_version }}-linux-amd64/rclone"

    - name: HARD-12 | Link rclone into PATH
      ansible.builtin.file:
        src: "/opt/rclone-{{ rclone_version }}-linux-amd64/rclone"
        dest: /usr/local/bin/rclone
        state: link

    # ─── Step 2: Directories & Credentials Configuration ─────────────────────
    - name: Ensure /etc/restic configuration directory exists
      ansible.builtin.file:
        path: /etc/restic
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Deploy Backblaze B2 remote Restic password
      ansible.builtin.copy:
        dest: /etc/restic/b2-etcd-password.txt
        content: "{{ restic_b2_password }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Deploy Backblaze B2 offsite environment file
      ansible.builtin.copy:
        dest: /etc/restic/b2-offsite.env
        owner: root
        group: root
        mode: "0600"
        content: |
          # Backblaze B2 S3-Compatible Credentials (Managed via Terraform 04-backblaze-b2)
          export AWS_ACCESS_KEY_ID="{{ b2_application_key_id }}"
          export AWS_SECRET_ACCESS_KEY="{{ b2_application_key }}"
          export B2_ACCOUNT_ID="{{ b2_application_key_id }}"
          export B2_ACCOUNT_KEY="{{ b2_application_key }}"

          # Source Repository (Local HDD ZFS Pool)
          export RESTIC_FROM_REPOSITORY="/mnt/aether-pool/restic-k3s-etcd"
          export RESTIC_FROM_PASSWORD_FILE="/etc/restic/etcd-password.txt"

          # Destination Repository (Backblaze B2 via S3-Compatible API)
          export RESTIC_REPOSITORY="s3:https://{{ b2_s3_endpoint | default('s3.us-east-005.backblazeb2.com') }}/{{ b2_bucket_name | default('aether-restic-etcd-offsite') }}"
          export RESTIC_PASSWORD_FILE="/etc/restic/b2-etcd-password.txt"

          # HARD-12: immutable copy. Upload-only key (native B2 API via rclone), and the
          # public age recipient only: this host can't read back what it uploads.
          export RCLONE_B2_ACCOUNT="{{ b2_offsite_upload_key_id }}"
          export RCLONE_B2_KEY="{{ b2_offsite_upload_key }}"
          export B2_LOCKED_BUCKET="{{ b2_offsite_locked_bucket | default('aether-etcd-offsite-lock') }}"
          export DR_AGE_RECIPIENT="{{ dr_offsite_age_recipient }}"
      no_log: true

    # ─── Step 3: Initialize Remote B2 Repository (Idempotent) ────────────────
    - name: Check if remote Backblaze B2 repository is initialized
      ansible.builtin.command: restic cat config
      environment:
        AWS_ACCESS_KEY_ID: "{{ b2_application_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ b2_application_key }}"
        RESTIC_REPOSITORY: "s3:https://{{ b2_s3_endpoint | default('s3.us-east-005.backblazeb2.com') }}/{{ b2_bucket_name | default('aether-restic-etcd-offsite') }}"
        RESTIC_PASSWORD_FILE: "/etc/restic/b2-etcd-password.txt"
      register: b2_restic_cat
      failed_when: false
      changed_when: false

    - name: Initialize remote Backblaze B2 Restic repository
      ansible.builtin.command: restic init
      environment:
        AWS_ACCESS_KEY_ID: "{{ b2_application_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ b2_application_key }}"
        RESTIC_REPOSITORY: "s3:https://{{ b2_s3_endpoint | default('s3.us-east-005.backblazeb2.com') }}/{{ b2_bucket_name | default('aether-restic-etcd-offsite') }}"
        RESTIC_PASSWORD_FILE: "/etc/restic/b2-etcd-password.txt"
      when: b2_restic_cat.rc != 0

    # ─── Step 4: Deploy Replication Script ───────────────────────────────────
    - name: Deploy replication script /usr/local/bin/replicate-etcd-b2.sh
      ansible.builtin.copy:
        dest: /usr/local/bin/replicate-etcd-b2.sh
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/usr/bin/env bash
          # =============================================================================
          # Project Aether — DR-04: Offsite Restic Copy to Backblaze B2
          # =============================================================================
          set -euo pipefail

          # HARD-23: a dataset can fail to mount after a reboot; never write DR data to the SSD.
          for p in /mnt/aether-pool/k3s-etcd-snapshots /mnt/aether-pool/restic-k3s-etcd; do
            [ "$(findmnt -n -o SOURCE --target "$p" 2>/dev/null)" = "aether-pool/$(basename "$p")" ] \
              || { echo "ERROR: $p is not the aether-pool ZFS dataset (not mounted?)"; exit 1; }
          done

          source /etc/restic/b2-offsite.env
          LOG_FILE="/var/log/restic-b2-copy.log"
          SNAPSHOTS_DIR="/mnt/aether-pool/k3s-etcd-snapshots"

          # HARD-06 / INC-2026-010: stale input is a FAILURE (sync may have failed upstream).
          # Checks the same mirror restic reads; the restic repo itself is not inspected.
          newest=$(find "${SNAPSHOTS_DIR}" -maxdepth 1 -type f -name 'etcd-snapshot-*' -printf '%T@\n' | sort -n | tail -1)
          if [ -z "${newest}" ] || [ $(( $(date +%s) - ${newest%.*} )) -gt 93600 ]; then   # 26 h
            echo "[$(date -Iseconds)] ERROR: newest snapshot older than 26h in ${SNAPSHOTS_DIR}; upstream sync failed?" | tee -a "${LOG_FILE}"
            exit 1
          fi

          # HARD-12: the newest snapshot, age-encrypted, as its own object in the Object Lock
          # bucket. B2 locks every version for 30 days; this key can't delete or hide files.
          # A rerun must not add a second version of the same night. The existence check
          # lists (listFiles); --ignore-existing would HEAD the object, which needs readFiles,
          # and this key deliberately can't read (401).
          latest=$(find "${SNAPSHOTS_DIR}" -maxdepth 1 -type f -name 'etcd-snapshot-*' -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
          obj="etcd/$(basename "${latest}").age"
          enc=$(mktemp)
          trap 'rm -f "${enc}"' EXIT
          age -r "${DR_AGE_RECIPIENT}" -o "${enc}" "${latest}"
          echo "[$(date -Iseconds)] Uploading ${obj} to the locked bucket ${B2_LOCKED_BUCKET}..." | tee -a "${LOG_FILE}"
          in_bucket() { rclone lsf ":b2:${B2_LOCKED_BUCKET}/etcd/" 2>>"${LOG_FILE}" | grep -xF "$(basename "${obj}")" >/dev/null; }
          if in_bucket; then
            echo "[$(date -Iseconds)] ${obj} is already in the bucket; not uploading again" | tee -a "${LOG_FILE}"
          else
            rclone copyto --no-check-dest "${enc}" ":b2:${B2_LOCKED_BUCKET}/${obj}" 2>&1 | tee -a "${LOG_FILE}"
          fi
          if ! in_bucket; then
            echo "[$(date -Iseconds)] ERROR: ${obj} is not in ${B2_LOCKED_BUCKET} after upload" | tee -a "${LOG_FILE}"
            exit 1
          fi

          # Transitional (until the old bucket is retired): restic copy to the unlocked bucket.
          echo "[$(date -Iseconds)] Starting offsite Restic copy to Backblaze B2..." | tee -a "${LOG_FILE}"
          restic copy 2>&1 | tee -a "${LOG_FILE}"

          echo "[$(date -Iseconds)] Verifying remote Backblaze B2 repository..." | tee -a "${LOG_FILE}"
          restic check 2>&1 | tee -a "${LOG_FILE}"

          echo "[$(date -Iseconds)] Backblaze B2 offsite replication successful." | tee -a "${LOG_FILE}"

          # HARD-06: heartbeat on SUCCESS only (set -e means we only get here if every step passed)
          curl -fsS -m 10 --retry 3 "{{ kuma_push_base }}/{{ kuma_push_tokens.etcd_b2 }}?status=up&msg=OK" >/dev/null \
            || echo "[$(date -Iseconds)] WARN: heartbeat push failed (replication itself succeeded)" | tee -a "${LOG_FILE}"
      no_log: true  # HARD-06: the rendered script contains a push token

    # ─── Step 5: Systemd Service & Daily Timer ───────────────────────────────
    - name: Deploy systemd service unit for B2 replication
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s-etcd-b2.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Project Aether - Offsite Restic Copy to Backblaze B2 (DR-04)
          After=k3s-etcd-restic.service network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          # One DR stage at a time: serialises timer runs, boot catch-up (Persistent=true) and manual runs (HARD-04).
          ExecStart=/usr/bin/flock -w 3600 /run/lock/k3s-etcd-dr.lock /usr/local/bin/replicate-etcd-b2.sh
          User=root
          StandardOutput=journal
          StandardError=journal

    - name: Deploy systemd timer unit (Daily 03:30 Asia/Kolkata)
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s-etcd-b2.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Daily Offsite Replication of etcd Backups to Backblaze B2 (03:30 Asia/Kolkata)
          # No Requires=: in a .timer it starts the service whenever the timer starts (HARD-04 / N1).

          [Timer]
          # One clock (IST) for the whole pipeline: K3s snapshot 02:00 -> sync 02:30 -> restic 03:00 -> B2 03:30.
          OnCalendar=*-*-* 03:30:00 Asia/Kolkata
          Persistent=true

          [Install]
          WantedBy=timers.target
      register: b2_timer_unit

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start k3s-etcd-b2.timer (restart if its schedule changed)
      ansible.builtin.systemd:
        name: k3s-etcd-b2.timer
        enabled: true
        state: "{{ 'restarted' if b2_timer_unit.changed else 'started' }}"

    # ─── Step 6: Initial Replication Run & Verification ──────────────────────
    - name: Trigger initial Backblaze B2 replication run
      ansible.builtin.command: /usr/bin/flock -w 3600 /run/lock/k3s-etcd-dr.lock /usr/local/bin/replicate-etcd-b2.sh
      register: initial_replication
      changed_when: true

    - name: Query Backblaze B2 remote snapshots list
      ansible.builtin.command: restic snapshots
      environment:
        AWS_ACCESS_KEY_ID: "{{ b2_application_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ b2_application_key }}"
        RESTIC_REPOSITORY: "s3:https://{{ b2_s3_endpoint | default('s3.us-east-005.backblazeb2.com') }}/{{ b2_bucket_name | default('aether-restic-etcd-offsite') }}"
        RESTIC_PASSWORD_FILE: "/etc/restic/b2-etcd-password.txt"
      register: b2_snapshots
      changed_when: false

    - name: Display Backblaze B2 remote snapshots summary
      ansible.builtin.debug:
        msg: "{{ b2_snapshots.stdout_lines }}"

    - name: HARD-12 | List the locked bucket
      ansible.builtin.shell: |
        set -o pipefail
        . /etc/restic/b2-offsite.env
        rclone lsl ":b2:${B2_LOCKED_BUCKET}/etcd/" | sort -k2,3 | tail -5
      args:
        executable: /bin/bash
      register: b2_locked_ls
      changed_when: false

    - name: HARD-12 | Display the locked bucket's newest objects
      ansible.builtin.debug:
        msg: "{{ b2_locked_ls.stdout_lines }}"
