---
# =============================================================================
# OCI Server Orchestration (Master Playbook)
# =============================================================================
# Thin entrypoint delegating to modular sub-playbooks for OCI infrastructure:
#   - oci-base.yml:       Apt updates, Docker runtime, network, tsdproxy, systemhog
#   - oci-apps.yml:       All application container deployments (tagged per-service)
#   - oci-monitoring.yml: Prometheus, Grafana, datasources, dashboards
#   - oci-ops.yml:        OPS-02 Telegram notification channels, Restic backups
#
# Examples:
#   # Full run:
#   task ansible:oci
#   ansible-playbook playbooks/bootstrap-oci.yml
#
#   # Targeted runs via tags:
#   task ansible:oci -- --tags n8n
#   task ansible:oci -- --tags ops-02
#   task ansible:oci -- --tags monitoring
# =============================================================================

- import_playbook: oci-base.yml
- import_playbook: oci-apps.yml
- import_playbook: oci-monitoring.yml
- import_playbook: oci-ops.yml
