---
- name: Setup bookorbit server
  hosts: bookorbit
  become: true

  vars:
    app_base_dir: /home/ubuntu
    docker_network: proxied-net
    # Set to false to disable systemhog (after upgrading to PAYG)
    enable_systemhog: true

  tasks:
    # ─── Load SOPS Secrets ──────────────────────────────
    - name: Load SOPS-encrypted secrets
      community.sops.load_vars:
        file: ../../secrets/ansible-secrets.sops.yaml

    # ─── System Setup ───────────────────────────────────
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - curl
          - git
        state: present

    - name: Ensure docker service is running
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    # ─── Docker Network ─────────────────────────────────
    - name: Create shared docker network
      community.docker.docker_network:
        name: "{{ docker_network }}"
        state: present

    # ─── tsdproxy (Tailscale Reverse Proxy) ─────────────
    - name: Create tsdproxy directory
      file:
        path: "{{ app_base_dir }}/tsdproxy"
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copy tsdproxy compose file
      copy:
        src: ../../../legacy-docker/oci-services/tsdproxy.yml
        dest: "{{ app_base_dir }}/tsdproxy/docker-compose.yml"
        owner: ubuntu
        group: ubuntu

    - name: Copy tsdproxy env file
      copy:
        content: |
          TSDPROXY_AUTHKEY={{ oci_tsdproxy_tsdproxy_authkey }}
        dest: "{{ app_base_dir }}/tsdproxy/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      no_log: true

    - name: Start tsdproxy
      community.docker.docker_compose_v2:
        project_src: "{{ app_base_dir }}/tsdproxy"
        state: present
        pull: always

    # ─── bookorbit (Book Management) ────────────────────
    - name: Create bookorbit directories
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
      loop:
        - "{{ app_base_dir }}/bookorbit"
        - "{{ app_base_dir }}/bookorbit/data/app"
        - "{{ app_base_dir }}/bookorbit/data/postgres"
        - "{{ app_base_dir }}/bookorbit/books"

    - name: Copy bookorbit compose file
      copy:
        src: ../../../legacy-docker/oci-services/bookorbit.yml
        dest: "{{ app_base_dir }}/bookorbit/docker-compose.yml"
        owner: ubuntu
        group: ubuntu

    - name: Copy bookorbit env file
      copy:
        content: |
          APP_IMAGE={{ oci_bookorbit_app_image }}
          APP_PORT={{ oci_bookorbit_app_port }}
          BOOKS_HOST_PATH={{ oci_bookorbit_books_host_path }}
          PUID={{ oci_bookorbit_puid }}
          PGID={{ oci_bookorbit_pgid }}
          POSTGRES_USER={{ oci_bookorbit_postgres_user }}
          POSTGRES_PASSWORD={{ oci_bookorbit_postgres_password }}
          POSTGRES_DB={{ oci_bookorbit_postgres_db }}
          JWT_SECRET={{ oci_bookorbit_jwt_secret }}
          SETUP_BOOTSTRAP_TOKEN={{ oci_bookorbit_setup_bootstrap_token }}
          APP_URL={{ oci_bookorbit_app_url }}
          NODE_MAX_OLD_SPACE_SIZE={{ oci_bookorbit_node_max_old_space_size }}
        dest: "{{ app_base_dir }}/bookorbit/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      no_log: true

    - name: Start bookorbit
      community.docker.docker_compose_v2:
        project_src: "{{ app_base_dir }}/bookorbit"
        state: present
        pull: always

