---
# =============================================================================
# Project Aether — DR-02: Automated Off-Node K3s etcd Snapshot Sync to Proxmox
# =============================================================================
# Implements GITOPS-11 / Task 3.17:
# Sets up automated daily pull of etcd snapshots from k3s-control-01 to the
# Proxmox VE ZFS HDD pool (single-disk; HARD-23) (/mnt/aether-pool/k3s-etcd-snapshots/).
#
# Examples:
#   ansible-playbook playbooks/proxmox-etcd-sync.yml
#   task ansible:etcd:sync
# =============================================================================

# ─── Step 1: Generate Dedicated SSH Keypair on Proxmox ──────────────────────
- name: Setup SSH Keypair on Proxmox Host
  hosts: proxmox
  become: true
  tasks:
    - name: HARD-23 | Refuse to run unless the DR paths are ZFS datasets on aether-pool
      # Runs before any file: state=directory task, which would otherwise recreate
      # a plain directory on the SSD (pve-root) if a dataset failed to mount.
      ansible.builtin.command: findmnt -n -o FSTYPE,SOURCE --target {{ item }}
      loop:
        - /mnt/aether-pool/k3s-etcd-snapshots
        - /mnt/aether-pool/restic-k3s-etcd
      register: dr_fs
      changed_when: false
      check_mode: false
      failed_when: dr_fs.rc != 0 or dr_fs.stdout.split() != ['zfs', 'aether-pool/' ~ (item | basename)]

    - name: Ensure /root/.ssh directory exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate dedicated Ed25519 keypair for etcd snapshot sync
      community.crypto.openssh_keypair:
        path: /root/.ssh/id_ed25519_etcd_sync
        type: ed25519
        comment: "k3s-etcd-sync@homelab-pve"
        mode: "0600"
        owner: root
        group: root
      register: etcd_sync_key

# ─── Step 2: Authorize Sync Key on K3s Control Plane ────────────────────────
- name: DR-02 | Authorize Sync Key and Permissions on K3s Control Plane
  hosts: control
  become: true
  tasks:
    - name: Authorize Proxmox sync public key for owl on control plane
      ansible.posix.authorized_key:
        user: owl
        state: present
        key: "{{ hostvars['homelab']['etcd_sync_key']['public_key'] }}"
        comment: "k3s-etcd-sync-from-proxmox"

    - name: Authorize Proxmox sync public key for root on control plane
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ hostvars['homelab']['etcd_sync_key']['public_key'] }}"
        comment: "k3s-etcd-sync-from-proxmox"

# ─── Step 3: Deploy Sync Script & Systemd Timer on Proxmox Host ─────────────
- name: DR-02 | Deploy Sync Script & Systemd Timer on Proxmox Host
  hosts: proxmox
  become: true
  tasks:
    - name: Load SOPS-encrypted secrets
      community.sops.load_vars:
        file: ../../secrets/ansible-secrets.sops.yaml

    - name: HARD-06 | Verify the Kuma heartbeat secrets exist
      ansible.builtin.assert:
        that:
          - kuma_push_base is defined
          - kuma_push_tokens is defined and kuma_push_tokens.etcd_sync is defined
        fail_msg: "kuma_push_base / kuma_push_tokens.etcd_sync missing from SOPS; the sync would run without a heartbeat."

    - name: Ensure destination directory on ZFS storage pool exists
      ansible.builtin.file:
        path: /mnt/aether-pool/k3s-etcd-snapshots
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Deploy sync script /usr/local/bin/sync-k3s-etcd-snapshots.sh
      ansible.builtin.copy:
        dest: /usr/local/bin/sync-k3s-etcd-snapshots.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          # HARD-23: a dataset can fail to mount after a reboot; never write DR data to the SSD.
          for p in /mnt/aether-pool/k3s-etcd-snapshots /mnt/aether-pool/restic-k3s-etcd; do
            [ "$(findmnt -n -o SOURCE --target "$p" 2>/dev/null)" = "aether-pool/$(basename "$p")" ] \
              || { echo "ERROR: $p is not the aether-pool ZFS dataset (not mounted?)"; exit 1; }
          done

          DEST_DIR="/mnt/aether-pool/k3s-etcd-snapshots"
          SOURCE_HOST="192.168.1.51"
          SOURCE_USER="owl"
          SOURCE_DIR="/var/lib/rancher/k3s/server/db/snapshots/"
          LOG_FILE="/var/log/k3s-etcd-sync.log"

          mkdir -p "${DEST_DIR}"
          echo "[$(date -Iseconds)] Starting etcd snapshot synchronization from ${SOURCE_HOST}..." | tee -a "${LOG_FILE}"

          # Use sudo rsync so user owl has full read access to 0600 root-owned snapshot files
          rsync -avz --delete \
            --rsync-path="sudo rsync" \
            -e "ssh -o StrictHostKeyChecking=accept-new -i /root/.ssh/id_ed25519_etcd_sync" \
            "${SOURCE_USER}@${SOURCE_HOST}:${SOURCE_DIR}" \
            "${DEST_DIR}/" 2>&1 | tee -a "${LOG_FILE}"

          SNAPSHOT_COUNT=$(find "${DEST_DIR}" -type f -name "*snapshot*" -o -name "*manual-test*" | wc -l)
          if [ "${SNAPSHOT_COUNT}" -eq 0 ]; then
            echo "[$(date -Iseconds)] ERROR: No etcd snapshots found in ${DEST_DIR} after sync!" | tee -a "${LOG_FILE}"
            exit 1
          fi

          echo "[$(date -Iseconds)] Successfully synced ${SNAPSHOT_COUNT} snapshot(s) to ${DEST_DIR}." | tee -a "${LOG_FILE}"

          # HARD-06: heartbeat on SUCCESS only (set -e means we only get here if every step passed)
          curl -fsS -m 10 --retry 3 "{{ kuma_push_base }}/{{ kuma_push_tokens.etcd_sync }}?status=up&msg=OK" >/dev/null \
            || echo "[$(date -Iseconds)] WARN: heartbeat push failed (sync itself succeeded)" | tee -a "${LOG_FILE}"
      no_log: true  # HARD-06: the rendered script contains a push token

    - name: Deploy systemd service unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s-etcd-sync.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Synchronize K3s etcd snapshots from control-01 to Proxmox ZFS pool
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          # One DR stage at a time: serialises timer runs, boot catch-up (Persistent=true) and manual runs (HARD-04).
          ExecStart=/usr/bin/flock -w 3600 /run/lock/k3s-etcd-dr.lock /usr/local/bin/sync-k3s-etcd-snapshots.sh
          User=root
          StandardOutput=journal
          StandardError=journal

    - name: Deploy systemd timer unit (Daily 02:30 Asia/Kolkata)
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s-etcd-sync.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Daily synchronization of K3s etcd snapshots to off-node ZFS pool (02:30 Asia/Kolkata)
          # No Requires=: in a .timer it starts the service whenever the timer starts (HARD-04 / N1).

          [Timer]
          # One clock (IST) for the whole pipeline: K3s snapshot 02:00 -> sync 02:30 -> restic 03:00 -> B2 03:30.
          OnCalendar=*-*-* 02:30:00 Asia/Kolkata
          Persistent=true

          [Install]
          WantedBy=timers.target
      register: sync_timer_unit

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start k3s-etcd-sync.timer (restart if its schedule changed)
      ansible.builtin.systemd:
        name: k3s-etcd-sync.timer
        enabled: true
        state: "{{ 'restarted' if sync_timer_unit.changed else 'started' }}"

    - name: Trigger initial synchronization run to verify pipeline
      ansible.builtin.command: /usr/bin/flock -w 3600 /run/lock/k3s-etcd-dr.lock /usr/local/bin/sync-k3s-etcd-snapshots.sh
      register: initial_sync
      changed_when: true

    - name: Display synchronization result
      ansible.builtin.debug:
        msg: "{{ initial_sync.stdout_lines }}"
