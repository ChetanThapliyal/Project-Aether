---
# =============================================================================
# Project Aether — GCP DMZ Observability Deployment Playbook
# =============================================================================
# Deploys Uptime Kuma, Glance, and Cloudflared on the GCP e2-micro DMZ instance.
# Stack location: /opt/dmz
# Access: Tailscale mesh (ports 3000, 3001) + Cloudflare Zero-Trust Tunnel
# =============================================================================

- name: Deploy GCP DMZ Observability Stack
  hosts: gcp_dmz
  become: true

  vars:
    dmz_dir: /opt/dmz
    dmz_user: owl
    dmz_group: owl
    enable_swap: true
    swap_size_gb: 2

  tasks:
    # ─── Load SOPS Secrets (if available) ────────────────
    - name: Check if ansible-secrets.sops.yaml exists
      delegate_to: localhost
      become: false
      stat:
        path: "{{ playbook_dir }}/../../secrets/ansible-secrets.sops.yaml"
      register: sops_file
      tags: [always]

    - name: Load SOPS-encrypted secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../../secrets/ansible-secrets.sops.yaml"
      when: sops_file.stat.exists
      ignore_errors: true
      tags: [always]

    # ─── Ensure Swap (e2-micro 1GB RAM stability) ─────────
    - name: Check if swapfile exists
      stat:
        path: /swapfile
      register: swapfile_stat
      when: enable_swap

    - name: Allocate 2GB swapfile for e2-micro stability
      command: fallocate -l {{ swap_size_gb }}G /swapfile
      when: enable_swap and not swapfile_stat.stat.exists

    - name: Secure swapfile permissions
      file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
      when: enable_swap and not swapfile_stat.stat.exists

    - name: Format swapfile filesystem
      command: mkswap /swapfile
      when: enable_swap and not swapfile_stat.stat.exists

    - name: Activate swapfile
      command: swapon /swapfile
      when: enable_swap and not swapfile_stat.stat.exists

    - name: Ensure swapfile persistence in /etc/fstab
      mount:
        name: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present
      when: enable_swap

    # ─── Systemd Override: Docker after Tailscale ─────────
    - name: Ensure docker systemd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure Docker to wait for Tailscale service
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/override.conf
        content: |
          [Unit]
          After=tailscaled.service
          Wants=tailscaled.service
        owner: root
        group: root
        mode: "0644"
      register: docker_dropin

    # FND-08: reload now, not via a handler. Handlers are skipped when a later
    # task fails, which would leave the drop-in written but never loaded.
    - name: Reload systemd now so the Docker ordering takes effect
      ansible.builtin.systemd:
        daemon_reload: true
      when: docker_dropin.changed

    # ─── DMZ Directories ─────────────────────────────────
    - name: Ensure /opt/dmz directory hierarchy exists
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ dmz_user }}"
        group: "{{ dmz_group }}"
        mode: "0750"
      loop:
        - "{{ dmz_dir }}"
        - "{{ dmz_dir }}/uptime-kuma"
        - "{{ dmz_dir }}/glance"
        - "{{ dmz_dir }}/glance/assets"

    # ─── Environment & Secrets ────────────────────────────
    - name: Deploy DMZ .env configuration file
      copy:
        content: |
          # Managed by Ansible — Project Aether GCP DMZ
          {% if gcp_dmz_cloudflare_tunnel_token is defined and gcp_dmz_cloudflare_tunnel_token | length > 0 %}
          COMPOSE_PROFILES=tunnel
          CLOUDFLARE_TUNNEL_TOKEN={{ gcp_dmz_cloudflare_tunnel_token }}
          {% else %}
          # COMPOSE_PROFILES=tunnel
          CLOUDFLARE_TUNNEL_TOKEN=
          {% endif %}
          PUID=1000
          PGID=1000
          HAWSER_TOKEN={{ gcp_dmz_hawser_token | default('') }}
        dest: "{{ dmz_dir }}/.env"
        owner: "{{ dmz_user }}"
        group: "{{ dmz_group }}"
        mode: "0600"
      no_log: true

    # ─── Homepage leftovers (FND-08) ──────────────────────
    # Homepage was replaced by Glance on 2026-11-02. Delete this task once no
    # host has the directory.
    - name: Remove the retired Homepage config directory
      ansible.builtin.file:
        path: "{{ dmz_dir }}/homepage"
        state: absent

    # ─── Glance Configuration Files ───────────────────────
    - name: Deploy Glance config and assets
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ dmz_user }}"
        group: "{{ dmz_group }}"
        mode: "0644"
      loop:
        - { src: "../../docker/gcp-dmz/glance/glance.yml", dest: "{{ dmz_dir }}/glance/glance.yml" }
        - { src: "../../docker/gcp-dmz/glance/assets/user.css", dest: "{{ dmz_dir }}/glance/assets/user.css" }
        - { src: "../../docker/gcp-dmz/glance/assets/favicon.svg", dest: "{{ dmz_dir }}/glance/assets/favicon.svg" }
      register: glance_files

    # ─── Docker Compose File ──────────────────────────────
    - name: Copy docker-compose.yml to DMZ host
      copy:
        src: ../../docker/gcp-dmz/docker-compose.yml
        dest: "{{ dmz_dir }}/docker-compose.yml"
        owner: "{{ dmz_user }}"
        group: "{{ dmz_group }}"
        mode: "0640"

    # ─── Workaround for GHCR IPv4-only limitation on GCP VM ───
    # ghcr.io has no IPv6, so the DMZ can't pull Hawser itself. Copy exactly the
    # image the compose file pins (Dependabot bumps it there), via this machine.
    - name: Read the Hawser image reference from the compose file
      ansible.builtin.set_fact:
        hawser_image: "{{ lookup('file', '../../docker/gcp-dmz/docker-compose.yml') | regex_search('ghcr\\.io/finsys/hawser:[^\\s#]+') }}"

    - name: Fail if the Hawser image reference wasn't found
      ansible.builtin.assert:
        that: hawser_image | length > 0
        fail_msg: "No ghcr.io/finsys/hawser:<tag> line in docker-compose.yml"
        quiet: true

    - name: Check if the pinned Hawser image exists on the DMZ host
      ansible.builtin.command: docker image inspect {{ hawser_image }}
      register: hawser_img_check
      failed_when: false
      changed_when: false

    - name: Pull the pinned Hawser image locally (IPv4 available)
      delegate_to: localhost
      become: false
      ansible.builtin.command: docker pull --platform linux/amd64 {{ hawser_image }}
      when: hawser_img_check.rc != 0

    - name: Save the Hawser image to a tar archive locally
      delegate_to: localhost
      become: false
      ansible.builtin.command: docker save -o /tmp/hawser-image.tar {{ hawser_image }}
      when: hawser_img_check.rc != 0

    - name: Copy the Hawser image to the DMZ host
      ansible.builtin.copy:
        src: /tmp/hawser-image.tar
        dest: /tmp/hawser-image.tar
        mode: "0600"
      when: hawser_img_check.rc != 0

    - name: Load the Hawser image on the DMZ host
      ansible.builtin.command: docker load -i /tmp/hawser-image.tar
      when: hawser_img_check.rc != 0

    - name: Clean up the remote tar archive
      ansible.builtin.file:
        path: /tmp/hawser-image.tar
        state: absent
      when: hawser_img_check.rc != 0

    - name: Clean up the local tar archive
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: /tmp/hawser-image.tar
        state: absent
      when: hawser_img_check.rc != 0

    # ─── Start Docker Compose Stack ───────────────────────
    - name: Remove the retired cyan Aether logo (FND-19)
      ansible.builtin.file:
        path: "{{ dmz_dir }}/glance/assets/aether-logo.svg"
        state: absent

    - name: Launch DMZ observability stack
      community.docker.docker_compose_v2:
        project_src: "{{ dmz_dir }}"
        state: present
        pull: missing          # pinned digests: pulls only on a fresh host (Docker Hub works over IPv6; Hawser is loaded above)
        remove_orphans: true   # FND-08: drops socket-proxy, which only Homepage used

    # ─── Verification ─────────────────────────────────────
    # Cloudflare caches /assets/user.css for 4 h, keyed on Glance's ?v= value,
    # which changes only when Glance (re)starts. Restart on any Glance file change
    # so a CSS-only update gets a fresh URL instead of the cached copy.
    - name: Restart Glance when its config or assets changed (cache-bust the stylesheet)
      ansible.builtin.command: docker restart glance
      when: glance_files is changed
      changed_when: true

    - name: Wait for Uptime Kuma to respond locally
      uri:
        url: http://127.0.0.1:3001
        status_code: [200, 302]
      register: uptime_kuma_check
      until: uptime_kuma_check.status in [200, 302]
      retries: 15
      delay: 3

    - name: Wait for Glance to respond locally
      uri:
        url: http://127.0.0.1:3000
        status_code: [200, 302]
      register: glance_check
      until: glance_check.status in [200, 302]
      retries: 20
      delay: 3

    - name: Print deployment summary
      debug:
        msg:
          - "=========================================================="
          - " Project Aether — GCP DMZ Observability Stack Live!        "
          - "=========================================================="
          - " Glance        : http://aether-gcp-dmz:3000 (Tailscale)    "
          - " Uptime Kuma   : http://aether-gcp-dmz:3001 (Tailscale)    "
          - " Cloudflared   : {{ 'Active (tunnel profile)' if (gcp_dmz_cloudflare_tunnel_token is defined and gcp_dmz_cloudflare_tunnel_token | length > 0) else 'Inactive (configure gcp_dmz_cloudflare_tunnel_token to activate)' }}"
          - "=========================================================="

    # ─── OPS-02: Uptime Kuma — Telegram Alert Channel ─────
    - name: OPS-02 | Check if Telegram secrets are available
      set_fact:
        telegram_configured: >-
          {{ (telegram_bot_token is defined and telegram_bot_token | string | length > 0) and
             (telegram_chat_id is defined and telegram_chat_id | string | length > 0) and
             (uptime_kuma_admin_password is defined and uptime_kuma_admin_password | string | length > 0) }}
      tags: [ops-02, notifications]

    - name: OPS-02 | Skip notice — Telegram secrets not found in SOPS
      debug:
        msg:
          - "⚠  OPS-02: Telegram notification channel NOT provisioned."
          - "   Add the following to ansible-secrets.sops.yaml and re-run:"
          - "     uptime_kuma_admin_password: <your UK admin password>"
          - "     telegram_bot_token: <token from @BotFather>"
          - "     telegram_chat_id:   <chat ID — run: curl https://api.telegram.org/bot<TOKEN>/getUpdates>"
          - "   Then re-run: task ansible:dmz --tags ops-02"
      when: not telegram_configured
      tags: [ops-02, notifications]

    - name: OPS-02 | Install uptime-kuma-api on localhost (Socket.IO client)
      pip:
        name: uptime-kuma-api
        state: present
        extra_args: --break-system-packages
      delegate_to: localhost
      become: false
      when: telegram_configured
      tags: [ops-02, notifications]

    - name: OPS-02 | Provision Telegram channel in GCP DMZ UK (aether-gcp-dmz:3001) via Tailscale
      # Runs locally — reaches GCP DMZ UK over Tailscale mesh. No pip3 needed on remote host.
      command: >
        python3 "{{ playbook_dir }}/../templates/provision_uk_telegram.py"
        --url http://aether-gcp-dmz:3001
        --username che01tan
        --password {{ uptime_kuma_admin_password | quote }}
        --bot-token {{ telegram_bot_token | string | quote }}
        --chat-id {{ telegram_chat_id | string | quote }}
        --name "Telegram — Aether Alerts"
      register: uk_dmz_provision
      changed_when: "'OK:' in uk_dmz_provision.stdout"
      delegate_to: localhost
      become: false
      when: telegram_configured
      no_log: true
      tags: [ops-02, notifications]

    - name: OPS-02 | Show provisioning result (GCP DMZ)
      debug:
        msg: "{{ uk_dmz_provision.stdout }}"
      when: telegram_configured and uk_dmz_provision is defined
      tags: [ops-02, notifications]

    # ─── HARD-06: Push monitors (needs uptime-kuma-api + the Telegram notification above) ───
    - name: HARD-06 | Provision push monitors in GCP DMZ UK (watchdog + DR stages)
      command: >
        python3 "{{ playbook_dir }}/../templates/provision_uk_push_monitors.py"
        --url http://aether-gcp-dmz:3001
        --username che01tan
        --password {{ uptime_kuma_admin_password | quote }}
        --notification "Telegram — Aether Alerts"
        --monitors {{ monitors | to_json | quote }}
      vars:
        monitors:
          - { name: "Watchdog — OCI Alertmanager",  token: "{{ kuma_push_tokens.watchdog }}",    interval: 300 }
          - { name: "DR-02 etcd sync (Proxmox)",    token: "{{ kuma_push_tokens.etcd_sync }}",   interval: 93600 }
          - { name: "DR-03 etcd restic (Proxmox)",  token: "{{ kuma_push_tokens.etcd_restic }}", interval: 93600 }
          - { name: "DR-04 etcd → B2 (Proxmox)",    token: "{{ kuma_push_tokens.etcd_b2 }}",     interval: 93600 }
      register: uk_push_provision
      changed_when: "'OK:' in uk_push_provision.stdout"
      delegate_to: localhost
      become: false
      when: telegram_configured
      no_log: true
      tags: [hard-06, notifications]

    # ─── FND-20: public feed freshness monitor + public-safe status page ───
    # Only monitors whose names are safe to show publicly go on the page. The
    # host monitor ("… (bookorbit-net)") is deliberately left off.
    - name: FND-20 | Provision the feed freshness monitor and the public status page
      command: >
        python3 "{{ playbook_dir }}/../templates/provision_uk_public_feed.py"
        --url http://aether-gcp-dmz:3001
        --username che01tan
        --password {{ uptime_kuma_admin_password | quote }}
        --notification "Telegram — Aether Alerts"
        --feed-url https://public-feed.tail7067ab.ts.net/summary.json
        --public-monitors {{ public_monitors | to_json | quote }}
      vars:
        public_monitors:
          - "OCI Nightly Restic Backup"
          - "Watchdog — OCI Alertmanager"
          - "DR-02 etcd sync (Proxmox)"
          - "DR-03 etcd restic (Proxmox)"
          - "DR-04 etcd → B2 (Proxmox)"
          - "OCI — Bookorbit"
      register: uk_public_feed
      changed_when: "'OK:' in uk_public_feed.stdout"
      delegate_to: localhost
      become: false
      when: telegram_configured
      no_log: true
      tags: [fnd-20, notifications]

    - name: FND-20 | Show public feed provisioning result
      debug:
        msg: "{{ uk_public_feed.stdout_lines }}"
      when: telegram_configured and uk_public_feed is defined
      tags: [fnd-20, notifications]

    - name: HARD-06 | Show push monitor provisioning result (monitor names only, no tokens)
      debug:
        msg: "{{ uk_push_provision.stdout_lines }}"
      when: telegram_configured and uk_push_provision.stdout_lines is defined
      tags: [hard-06, notifications]

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
