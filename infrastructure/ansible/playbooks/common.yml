# =============================================================================
# Common Setup — All K3s Nodes
# =============================================================================
# Prepares every node with required packages, kernel modules, sysctl
# settings, QEMU guest agent, and Tailscale before K3s installation.
# =============================================================================

- name: Common setup for all K3s nodes
  hosts: k3s_cluster
  become: true

  tasks:
    # ----- Load SOPS Secrets -----
    - name: Load SOPS-encrypted secrets
      community.sops.load_vars:
        file: ../../../infrastructure/secrets/ansible-secrets.sops.yaml

    # ----- System Updates -----
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - open-iscsi
          - nfs-common
          - jq
          - qemu-guest-agent
        state: present

    # ----- QEMU Guest Agent -----
    - name: Enable and start QEMU guest agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started

    # ----- Swap -----
    - name: Disable swap (required by Kubernetes)
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Remove swap from /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '\sswap\s'
        state: absent

    # ----- Kernel Modules -----
    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - overlay

    - name: Persist kernel modules across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf
        content: |
          br_netfilter
          overlay
        mode: "0644"

    # ----- Sysctl -----
    - name: Set required sysctl parameters
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-k3s.conf
        reload: true
      loop:
        - { key: net.bridge.bridge-nf-call-iptables, value: "1" }
        - { key: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { key: net.ipv4.ip_forward, value: "1" }

    # ----- Timezone -----
    - name: Set timezone to Asia/Kolkata
      community.general.timezone:
        name: Asia/Kolkata

    # ----- Tailscale -----
    - name: Add Tailscale GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Add Tailscale APT repository
      ansible.builtin.deb822_repository:
        name: tailscale
        uris: "https://pkgs.tailscale.com/stable/ubuntu"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components:
          - main
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
        state: present

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Enable and start Tailscale service
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Authenticate Tailscale
      ansible.builtin.command: >
        tailscale up --authkey={{ tailscale_auth_key }} --accept-routes
      register: tailscale_result
      changed_when: "'Success' in tailscale_result.stdout or tailscale_result.rc == 0"
      failed_when: tailscale_result.rc != 0
