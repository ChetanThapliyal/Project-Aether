# =============================================================================
# Common Setup — All K3s Nodes
# =============================================================================
# Prepares every node with required packages, kernel modules, and sysctl
# settings before K3s installation.
# =============================================================================

- name: Common setup for all K3s nodes
  hosts: k3s_cluster
  become: true

  tasks:
    # ----- System Updates -----
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - open-iscsi
          - nfs-common
          - jq
        state: present

    # ----- Swap -----
    - name: Disable swap (required by Kubernetes)
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Remove swap from /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '\sswap\s'
        state: absent

    # ----- Kernel Modules -----
    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - overlay

    - name: Persist kernel modules across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf
        content: |
          br_netfilter
          overlay
        mode: "0644"

    # ----- Sysctl -----
    - name: Set required sysctl parameters
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-k3s.conf
        reload: true
      loop:
        - { key: net.bridge.bridge-nf-call-iptables, value: "1" }
        - { key: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { key: net.ipv4.ip_forward, value: "1" }

    # ----- Timezone -----
    - name: Set timezone to Asia/Kolkata
      community.general.timezone:
        name: Asia/Kolkata
