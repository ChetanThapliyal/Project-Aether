---
# =============================================================================
# OCI Base Infrastructure Playbook
# =============================================================================
# Prepares the OCI VM with base system packages, Docker runtime,
# shared Docker network, and Tailscale reverse proxy (tsdproxy).
# =============================================================================

- name: Configure OCI base infrastructure
  hosts: bookorbit
  become: true

  vars:
    app_user: "{{ hostvars[inventory_hostname].app_user | default(ansible_user | default('ubuntu')) }}"
    app_base_dir: "{{ hostvars[inventory_hostname].app_base_dir | default('/home/' ~ app_user) }}"
    docker_network: proxied-net

  tasks:
    # ─── Load SOPS Secrets ──────────────────────────────
    - name: Load SOPS-encrypted secrets
      community.sops.load_vars:
        file: ../../secrets/ansible-secrets.sops.yaml
      tags: [always]

    # ─── System Setup ───────────────────────────────────
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [base, system]

    - name: Install required packages
      apt:
        name:
          - curl
          - git
          - restic
        state: present
      tags: [base, system]

    # Pairs with the UDP 41641 rule on the OCI security list. Without both, the
    # homelab (behind carrier-grade NAT) can't open a direct path and stays on
    # the DERP relay.
    - name: Allow Tailscale's WireGuard port through ufw
      community.general.ufw:
        rule: allow
        port: "41641"
        proto: udp
        comment: Tailscale direct paths
      tags: [base, firewall]

    # ─── Tailscale on the host (FND-18) ─────────────────
    # The host joins the tailnet as bookorbit-net. Installing and joining here
    # means a rebuilt instance (DR Scenario 02) needs no hand-typed commands.
    # The join runs only when the node isn't already connected: joining
    # with other flags on a live node fails or re-authenticates it.
    - name: FND-18 | Add Tailscale GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"
      tags: [base, tailscale]

    - name: FND-18 | Add Tailscale APT repository
      ansible.builtin.deb822_repository:
        name: tailscale
        uris: "https://pkgs.tailscale.com/stable/ubuntu"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components:
          - main
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
        state: present
      tags: [base, tailscale]

    # Tailscale's install script writes the one-line tailscale.list; with the
    # deb822 file above, apt would warn about the same repository twice.
    - name: FND-18 | Remove the one-line repository file the install script leaves
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/tailscale.list
        state: absent
      tags: [base, tailscale]

    - name: FND-18 | Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true
      tags: [base, tailscale]

    - name: FND-18 | Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started
      tags: [base, tailscale]

    - name: FND-18 | Read Tailscale state
      ansible.builtin.command: tailscale status --json
      register: ts_status
      changed_when: false
      failed_when: false
      check_mode: false   # read-only, and the join guard below needs the result
      tags: [base, tailscale]

    - name: FND-18 | Decide whether this node must join
      ansible.builtin.set_fact:
        ts_needs_join: "{{ ts_status.rc != 0 or (ts_status.stdout | from_json).BackendState != 'Running' }}"
      tags: [base, tailscale]

    # no_log on the join below would hide an "undefined variable" error, so the
    # missing key is caught here with a readable message.
    - name: FND-18 | Require the auth key when a join is needed
      ansible.builtin.assert:
        that: oci_host_tailscale_auth_key is defined
        fail_msg: >-
          This node isn't on the tailnet and oci_host_tailscale_auth_key isn't in
          infrastructure/secrets/ansible-secrets.sops.yaml. Create a pre-authorised,
          tagged key in the Tailscale console and add it with `sops`.
      when: ts_needs_join | bool
      tags: [base, tailscale]

    - name: FND-18 | Join the tailnet (only if not already running)
      ansible.builtin.command: >
        tailscale up
        --auth-key={{ oci_host_tailscale_auth_key }}
        --hostname=bookorbit-net
        --advertise-tags={{ oci_host_tailscale_tags | default('tag:oci') }}
      when: ts_needs_join | bool
      no_log: true
      tags: [base, tailscale]

    # FND-04: SSH is reached over the tailnet only (public 22 is closed in the
    # OCI security list). 10- sorts before 60-cloudimg-settings.conf, and sshd
    # takes the first value it reads, so these win.
    - name: FND-04 | sshd hardening drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-aether-hardening.conf
        content: |
          # Managed by Ansible (oci-base.yml, FND-04)
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          MaxAuthTries 3
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      register: sshd_dropin
      tags: [ssh, security]

    - name: FND-04 | Validate the full sshd config before reloading
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      when: sshd_dropin.changed
      tags: [ssh, security]

    - name: FND-04 | Reload sshd
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
      when: sshd_dropin.changed
      tags: [ssh, security]

    - name: Ensure docker service is running
      systemd:
        name: docker
        state: started
        enabled: true
      tags: [base, docker]

    - name: Configure Docker daemon (enable containerd image store for zstd layer support)
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "features": {
              "containerd-snapshotter": true
            }
          }
        owner: root
        group: root
        mode: "0644"
      notify: restart docker
      tags: [base, docker]

    - name: "Add {{ app_user }} user to docker group"
      user:
        name: "{{ app_user }}"
        groups: docker
        append: true
      tags: [base, docker]

    # ─── Docker Network ─────────────────────────────────
    - name: Create shared docker network
      community.docker.docker_network:
        name: "{{ docker_network }}"
        state: present
      tags: [base, docker]

    # ─── tsdproxy (Tailscale Reverse Proxy) ─────────────
    - name: Create tsdproxy directory
      file:
        path: "{{ app_base_dir }}/tsdproxy"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
      tags: [tsdproxy]

    - name: Copy tsdproxy compose file
      copy:
        src: ../../../legacy-docker/oci-services/tsdproxy.yml
        dest: "{{ app_base_dir }}/tsdproxy/docker-compose.yml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
      tags: [tsdproxy]

    # FND-03: tsdproxy v2 signs nodes in through a Tailscale OAuth client, with
    # one provider per role (app / probe / admin) so each node gets its role's tags.
    - name: Require the tsdproxy OAuth client in SOPS
      ansible.builtin.assert:
        that:
          - oci_tsdproxy_oauth_client_id | default('') | length > 0
          - oci_tsdproxy_oauth_client_secret | default('') | length > 0
        fail_msg: >-
          oci_tsdproxy_oauth_client_id / oci_tsdproxy_oauth_client_secret are missing from
          ansible-secrets.sops.yaml. Without a config, tsdproxy v2 502s every service (#496).
        quiet: true
      tags: [tsdproxy]

    - name: Create tsdproxy config directory
      file:
        path: "{{ app_base_dir }}/tsdproxy/config"
        state: directory
        owner: root
        group: root
        mode: "0700"
      tags: [tsdproxy]

    - name: Render tsdproxy config
      template:
        src: ../templates/tsdproxy.yaml.j2
        dest: "{{ app_base_dir }}/tsdproxy/config/tsdproxy.yaml"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      register: tsdproxy_config
      tags: [tsdproxy]

    - name: Remove the v1 auth-key env file (replaced by the OAuth config)
      file:
        path: "{{ app_base_dir }}/tsdproxy/.env"
        state: absent
      tags: [tsdproxy]

    - name: Start tsdproxy (recreate when its config changed; it reads it only at start)
      community.docker.docker_compose_v2:
        project_src: "{{ app_base_dir }}/tsdproxy"
        state: present
        pull: missing
        recreate: "{{ 'always' if tsdproxy_config.changed else 'auto' }}"
      tags: [tsdproxy]

    # ─── Systemhog removal ──────────────────────────────
    # systemhog (OCI anti-reclamation load generator) is retired. These
    # tasks remove it from hosts that still have it; delete them once
    # no host carries it.
    - name: Stop and disable systemhog
      systemd:
        name: systemhog
        state: stopped
        enabled: false
      failed_when: false
      tags: [systemhog, base]

    - name: Remove systemhog files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/systemhog.service
        - /usr/local/bin/systemhog
        - /etc/systemhog
        - /var/log/systemhog.log
      notify: reload systemd
      tags: [systemhog, base]

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted

    - name: reload systemd
      systemd:
        daemon_reload: true
