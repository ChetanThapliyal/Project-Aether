---
# =============================================================================
# OCI Operations & Maintenance Playbook
# =============================================================================
# Handles operational automation for OCI:
#   - OPS-02: Uptime Kuma Telegram notification channel provisioning
#   - Automated Restic backups to S3/Cloudflare R2
#
# Examples:
#   ansible-playbook playbooks/oci-ops.yml --tags ops-02
#   ansible-playbook playbooks/oci-ops.yml --tags backup
#   ansible-playbook playbooks/bootstrap-oci.yml --tags ops
# =============================================================================

- name: Configure OCI operations and backups
  hosts: bookorbit
  become: true

  vars:
    app_user: "{{ hostvars[inventory_hostname].app_user | default(ansible_user | default('ubuntu')) }}"
    app_base_dir: "{{ hostvars[inventory_hostname].app_base_dir | default('/home/' ~ app_user) }}"
    rclone_version: v1.75.2   # 5.61; matches proxmox-etcd-b2.yml, bump both with their checksums

  tasks:
    # ─── Load SOPS Secrets ──────────────────────────────
    - name: Load SOPS-encrypted secrets
      community.sops.load_vars:
        file: ../../secrets/ansible-secrets.sops.yaml
      tags: [always]

    # ─── OPS-02: OCI Uptime Kuma — Telegram Alert Channel ─
    # Targets the primary OCI Uptime Kuma instance (uptimekuma on Tailscale).
    # Runs from LOCALHOST (which is on Tailscale) — no pip3 required on remote host.
    # Requires in ansible-secrets.sops.yaml:
    #   uptime_kuma_admin_password: <your UK admin password>
    #   telegram_bot_token:  <token from @BotFather>
    #   telegram_chat_id:    <chat ID — see deploy-dmz.yml for instructions>
    - name: OPS-02 | Check if Telegram secrets are available (OCI)
      set_fact:
        telegram_configured_oci: >-
          {{ (telegram_bot_token is defined and telegram_bot_token | string | length > 0) and
             (telegram_chat_id is defined and telegram_chat_id | string | length > 0) and
             (uptime_kuma_admin_password is defined and uptime_kuma_admin_password | string | length > 0) }}
      tags: [ops-02, notifications, ops, fnd-17]

    - name: OPS-02 | Skip notice — Telegram secrets not found (OCI)
      debug:
        msg:
          - "⚠  OPS-02: OCI Telegram notification channel NOT provisioned."
          - "   Add telegram_bot_token, telegram_chat_id, uptime_kuma_admin_password to SOPS secrets."
          - "   Then re-run: task ansible:oci -- --tags ops-02"
      when: not telegram_configured_oci
      tags: [ops-02, notifications, ops]

    - name: OPS-02 | Install uptime-kuma-api on localhost (Socket.IO client)
      pip:
        name: uptime-kuma-api
        state: present
        extra_args: --break-system-packages
      delegate_to: localhost
      become: false
      when: telegram_configured_oci
      tags: [ops-02, notifications, ops]

    - name: OPS-02 | Provision Telegram channel in OCI UK (https://uptimekuma) via Tailscale
      # Runs locally — reaches OCI UK over Tailscale mesh. No pip3 needed on remote host.
    # Full tailnet name: the short name fails TLS (the certificate is for the FQDN).
      command: >
        python3 "{{ playbook_dir }}/../templates/provision_uk_telegram.py"
        --url https://uptimekuma.tail7067ab.ts.net
        --username kill3rbee
        --password {{ uptime_kuma_admin_password | quote }}
        --bot-token {{ telegram_bot_token | string | quote }}
        --chat-id {{ telegram_chat_id | string | quote }}
        --name "Telegram — Aether Alerts (OCI)"
      register: uk_oci_provision
      changed_when: "'OK:' in uk_oci_provision.stdout"
      delegate_to: localhost
      become: false
      when: telegram_configured_oci
      no_log: true
      tags: [ops-02, notifications, ops]

    - name: OPS-02 | Show provisioning result (OCI)
      debug:
        msg: "{{ uk_oci_provision.stdout }}"
      when: telegram_configured_oci and uk_oci_provision is defined
      tags: [ops-02, notifications, ops]

    # ─── FND-17: heartbeat for the DMZ Kuma backup ──────────
    # The DMZ's nightly backup-kuma.sh pushes here on success. It reports to OCI,
    # not to the DMZ's own Kuma, so losing the DMZ can't hide a missing backup.
    - name: FND-17 | Provision the "DMZ Kuma Backup" push monitor in OCI UK
      command: >
        python3 "{{ playbook_dir }}/../templates/provision_uk_push_monitors.py"
        --url https://uptimekuma.tail7067ab.ts.net
        --username kill3rbee
        --password {{ uptime_kuma_admin_password | quote }}
        --notification "Telegram — Aether Alerts (OCI)"
        --monitors {{ monitors | to_json | quote }}
      vars:
        monitors:
          - { name: "DMZ Kuma Backup", token: "{{ kuma_push_tokens.dmz_kuma_backup }}", interval: 93600 }
      register: uk_oci_push
      changed_when: "'OK:' in uk_oci_push.stdout"
      delegate_to: localhost
      become: false
      when: telegram_configured_oci
      no_log: true
      tags: [fnd-17, notifications, ops]

    - name: FND-17 | Show push monitor provisioning result (names only)
      debug:
        msg: "{{ uk_oci_push.stdout_lines }}"
      when: telegram_configured_oci and uk_oci_push.stdout_lines is defined
      tags: [fnd-17, notifications, ops]

    # ─── Backups (Restic) ───────────────────────────────────
    - name: Create backup directory
      file:
        path: /opt/backup
        state: directory
        owner: root
        mode: "0700"
      tags: [backup, restic, ops]

    - name: Deploy restic env file
      copy:
        content: |
          export AWS_ACCESS_KEY_ID={{ oci_backup_s3_access_key | quote }}
          export AWS_SECRET_ACCESS_KEY={{ oci_backup_s3_secret_key | quote }}
          export RESTIC_PASSWORD={{ oci_backup_restic_password | quote }}
          export RESTIC_REPOSITORY={{ ('s3:' ~ oci_backup_s3_endpoint ~ '/dr-backups') | quote }}
          export UPTIME_KUMA_PUSH_URL={{ oci_backup_kuma_push_url | quote }}
        dest: /opt/backup/restic.env
        owner: root
        mode: "0600"
      no_log: true
      tags: [backup, restic, ops]

    - name: Deploy backup script
      template:
        src: ../templates/backup.sh.j2
        dest: /opt/backup/run-backup.sh
        owner: root
        mode: "0700"
      tags: [backup, restic, ops]

    # ─── 5.61: offsite copy to the Object Lock bucket on Backblaze B2 ───
    # Same pattern as the homelab (HARD-12): an upload-only key, here limited to
    # oci/, and only the public age recipient on this host.
    - name: 5.61 | Require the offsite key, the age recipient and the heartbeat token
      ansible.builtin.assert:
        that:
          - b2_oci_offsite_upload_key_id | default('') | length > 0
          - b2_oci_offsite_upload_key | default('') | length > 0
          - dr_offsite_age_recipient | default('') is match('^age1')
          - kuma_push_base is defined and kuma_push_tokens.oci_b2 is defined
        fail_msg: "5.61 secrets missing from ansible-secrets.sops.yaml; the offsite copy would fail every night."
        quiet: true
      tags: [backup, restic, ops, offsite]

    - name: 5.61 | Install age and unzip
      ansible.builtin.apt:
        name: [age, unzip]
        state: present
      tags: [backup, restic, ops, offsite]

    # Ubuntu's rclone authorises with B2 API v1, which rejects current keys (see
    # proxmox-etcd-b2.yml). Same pinned release; sha256 from SHA256SUMS and the
    # GitHub asset digest, which agree.
    - name: 5.61 | Download rclone {{ rclone_version }} (arm64)
      ansible.builtin.get_url:
        url: "https://downloads.rclone.org/{{ rclone_version }}/rclone-{{ rclone_version }}-linux-arm64.zip"
        dest: "/var/cache/rclone-{{ rclone_version }}-linux-arm64.zip"
        checksum: "sha256:7e1e8d69654941b7b7df84ee74c5f7fb09cce7d5496947fb7bf16b55ff427d10"
        mode: "0644"
      tags: [backup, restic, ops, offsite]

    - name: 5.61 | Unpack rclone {{ rclone_version }}
      ansible.builtin.unarchive:
        src: "/var/cache/rclone-{{ rclone_version }}-linux-arm64.zip"
        dest: /opt
        remote_src: true
        creates: "/opt/rclone-{{ rclone_version }}-linux-arm64/rclone"
      tags: [backup, restic, ops, offsite]

    - name: 5.61 | Link rclone into PATH
      ansible.builtin.file:
        src: "/opt/rclone-{{ rclone_version }}-linux-arm64/rclone"
        dest: /usr/local/bin/rclone
        state: link
      tags: [backup, restic, ops, offsite]

    - name: 5.61 | Deploy the offsite env file
      ansible.builtin.copy:
        content: |
          export RCLONE_B2_ACCOUNT={{ b2_oci_offsite_upload_key_id | quote }}
          export RCLONE_B2_KEY={{ b2_oci_offsite_upload_key | quote }}
          export B2_LOCKED_BUCKET=aether-oci-offsite-lock   # 3-day lock, its own bucket (5.61)
          export DR_AGE_RECIPIENT={{ dr_offsite_age_recipient | quote }}
          export OFFSITE_PUSH_URL={{ (kuma_push_base ~ '/' ~ kuma_push_tokens.oci_b2 ~ '?status=up&msg=OK') | quote }}
        dest: /opt/backup/b2-offsite.env
        owner: root
        mode: "0600"
      no_log: true
      tags: [backup, restic, ops, offsite]

    - name: 5.61 | Deploy the offsite copy script
      ansible.builtin.template:
        src: ../templates/offsite-b2.sh.j2
        dest: /opt/backup/offsite-b2.sh
        owner: root
        mode: "0700"
      tags: [backup, restic, ops, offsite]

    # FND-02: Kestra (aether.ops.restic-nightly) is the only scheduler.
    # Keep this task until the cron is gone everywhere, then delete it.
    - name: Remove legacy cron (Kestra restic-nightly is the only scheduler)
      cron:
        name: "Restic Nightly Backup"
        user: root
        state: absent
      tags: [backup, restic, ops]

    # ─── Docker Prune (Weekly) ──────────────────────────────
    # 4.13: Kestra's ops/oci-docker-prune flow (Sunday 04:00 UTC) is the only scheduler.
    # This cron ran the same command in the same minute; the two raced (Kestra's
    # 8 Nov run failed). Remove it, as FND-02 did for the restic cron.
    - name: Remove legacy Docker prune cron (Kestra oci-docker-prune is the only scheduler)
      cron:
        name: "Weekly Docker Prune"
        user: root
        state: absent
      tags: [docker-prune, ops]
