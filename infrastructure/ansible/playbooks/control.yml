# =============================================================================
# K3s Control Plane — Initialize Server
# =============================================================================
# Installs K3s in server mode on the control node and waits for it to be ready.
# Stores the node token so workers can join.
# =============================================================================

- name: Initialize K3s control plane
  hosts: control
  become: true

  vars:
    k3s_version: "v1.36.4+k3s1"
    k3s_tailnet_name: "k3s-control-01.tail7067ab.ts.net"   # extra API certificate name (FND-11)

  tasks:
    # ----- Server token escrow (HARD-10) -----
    # A snapshot can only be restored onto a new VM with the original server
    # token, so it lives in SOPS and must match the live cluster.
    - name: Load SOPS-encrypted secrets
      community.sops.load_vars:
        file: ../../secrets/ansible-secrets.sops.yaml

    - name: Require an escrowed server token
      ansible.builtin.assert:
        that:
          - k3s_server_token is defined
          - k3s_server_token is match('^K10[0-9a-f]+::server:.+')
        fail_msg: "k3s_server_token is missing from SOPS. Snapshots can't be restored on a new VM without it."
        quiet: true

    # ----- Install K3s Server -----
    - name: Check if K3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install K3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          sh -s - server \
            --cluster-init \
            --secrets-encryption \
            --token "{{ k3s_server_token.split('::server:') | last }}" \
            --write-kubeconfig-mode "600" \
            --tls-san "{{ ansible_host }}" \
            --tls-san "{{ k3s_tailnet_name }}" \
            --node-taint "node-role.kubernetes.io/control-plane:NoSchedule" \
            --disable traefik \
            --disable servicelb
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_binary.stat.exists
      # A fresh cluster makes its own CA, so it takes only the passphrase.
      # A restore (HARD-11) passes the full K10... token instead.
      no_log: true

    # ----- Wait for K3s -----
    - name: Wait for K3s to be ready
      ansible.builtin.command: k3s kubectl get nodes
      register: k3s_status
      until: k3s_status.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for control node to be Ready
      ansible.builtin.shell: |
        k3s kubectl get nodes -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}'
      register: node_ready
      until: node_ready.stdout == "True"
      retries: 30
      delay: 10
      changed_when: false

    - name: Read live server token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/token
      register: live_server_token
      no_log: true

    - name: Assert the escrowed token matches the live cluster
      ansible.builtin.assert:
        that: (live_server_token.content | b64decode | trim) == k3s_server_token
        fail_msg: "Live K3s token differs from the SOPS escrow. Re-escrow it (k3s token rotate?) or a restore will fail."
        quiet: true
      no_log: true

    # ----- Node Taint -----
    - name: Ensure control plane taint is applied
      ansible.builtin.command: >
        k3s kubectl taint nodes {{ inventory_hostname }} node-role.kubernetes.io/control-plane:NoSchedule --overwrite
      register: taint_result
      changed_when: "'modified' in taint_result.stdout or 'tainted' in taint_result.stdout"

    # ----- Retrieve Node Token -----
    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token

    - name: Store node token as fact
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_token.content | b64decode | trim }}"
        cacheable: true

    - name: Display K3s status
      ansible.builtin.debug:
        msg: "K3s control plane is running. Node token retrieved."

    # ----- Deploy Automated Etcd Snapshot Configuration -----
    - name: Ensure K3s config drop-in directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy K3s automated etcd snapshot configuration
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/10-etcd-snapshot.yaml
        content: |
          etcd-snapshot-schedule-cron: "0 2 * * *"
          etcd-snapshot-retention: 14
          etcd-snapshot-dir: "/var/lib/rancher/k3s/server/db/snapshots"
          etcd-snapshot-compress: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart K3s Control Plane

    # ----- Secrets encryption at rest (HARD-13) -----
    # On an existing cluster the order is fixed (K3s docs): `k3s secrets-encrypt
    # enable` first, then the flag and a restart, then `rotate-keys`. Adding the
    # flag before `enable` is the wrong order, so refuse until K3s has an
    # encryption config. A fresh install gets --secrets-encryption above.
    - name: HARD-13 | Check for an encryption config
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/cred/encryption-config.json
      register: k3s_enc_config

    - name: HARD-13 | Refuse to persist the flag before `secrets-encrypt enable`
      ansible.builtin.assert:
        that: k3s_enc_config.stat.exists
        fail_msg: >-
          No encryption config yet. Run `sudo k3s secrets-encrypt enable` on the control VM
          first (HARD-13 step 2), then re-run this playbook.
        quiet: true

    - name: HARD-13 | Persist secrets encryption
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/30-secrets-encryption.yaml
        content: |
          secrets-encryption: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart K3s Control Plane

    # ----- Admin kubeconfig 600 + tailnet SAN (FND-11) -----
    # `--write-kubeconfig-mode` is hard-coded in the unit's ExecStart, and a CLI
    # flag beats any config.yaml.d drop-in, so an existing node's unit has to be
    # edited. Both edits are idempotent and tolerate the old unit's layout
    # (one flag or value per line, tab-indented). A fresh install above already
    # uses 600 and the SAN.
    - name: FND-11 | Kubeconfig mode 600 in the K3s unit
      ansible.builtin.replace:
        path: /etc/systemd/system/k3s.service
        regexp: |-
          ('--write-kubeconfig-mode' \\\n\t)'644'
        replace: |-
          \1'600'
      register: k3s_unit_mode

    - name: FND-11 | Tailnet FQDN as an extra API certificate name
      ansible.builtin.replace:
        path: /etc/systemd/system/k3s.service
        regexp: |-
          ('--tls-san' \\\n\t'{{ ansible_host }}' \\\n)(?!\t'--tls-san' \\\n\t'{{ k3s_tailnet_name }}')
        replace: |-
          \1\t'--tls-san' \\\n\t'{{ k3s_tailnet_name }}' \\\n
      register: k3s_unit_san

    # Reload now, not via a handler: a later failure would skip a handler and
    # leave an edited unit that systemd hasn't read (FND-08 lesson).
    - name: FND-11 | Reload systemd so the edited unit is read
      ansible.builtin.systemd:
        daemon_reload: true

    - name: FND-11 | Apply other pending K3s restarts now
      ansible.builtin.meta: flush_handlers

    # Converge on the *running* state, not on whether this run edited the unit:
    # daemon_reload never reports "changed", and a re-run after a half-applied
    # change finds the unit already edited. K3s writes k3s.yaml from the flag it
    # started with, so the file's mode shows which flag is live.
    - name: FND-11 | Read the admin kubeconfig's mode
      ansible.builtin.stat:
        path: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig_stat

    - name: FND-11 | Restart K3s so the running service uses the edited unit
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when: not ansible_check_mode and k3s_kubeconfig_stat.stat.mode != '0600'

    - name: FND-11 | Wait for the API
      ansible.builtin.command: k3s kubectl get nodes
      register: k3s_api_after
      until: k3s_api_after.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      when: not ansible_check_mode

    - name: FND-11 | Re-read the admin kubeconfig's mode
      ansible.builtin.stat:
        path: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig_after

    - name: FND-11 | Assert the admin kubeconfig is 0600, root only
      ansible.builtin.assert:
        that:
          - k3s_kubeconfig_after.stat.mode == '0600'
          - k3s_kubeconfig_after.stat.pw_name == 'root'
        fail_msg: "/etc/rancher/k3s/k3s.yaml is {{ k3s_kubeconfig_after.stat.mode }}; K3s writes it from the unit's --write-kubeconfig-mode when it starts."
        quiet: true
      when: not ansible_check_mode   # nothing restarts in a dry run

  handlers:
    - name: Restart K3s Control Plane
      ansible.builtin.systemd:
        name: k3s
        state: restarted
