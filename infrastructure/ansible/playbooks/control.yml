# =============================================================================
# K3s Control Plane — Initialize Server
# =============================================================================
# Installs K3s in server mode on the control node and waits for it to be ready.
# Stores the node token so workers can join.
# =============================================================================

- name: Initialize K3s control plane
  hosts: control
  become: true

  vars:
    k3s_version: "v1.36.4+k3s1"

  tasks:
    # ----- Server token escrow (HARD-10) -----
    # A snapshot can only be restored onto a new VM with the original server
    # token, so it lives in SOPS and must match the live cluster.
    - name: Load SOPS-encrypted secrets
      community.sops.load_vars:
        file: ../../secrets/ansible-secrets.sops.yaml

    - name: Require an escrowed server token
      ansible.builtin.assert:
        that:
          - k3s_server_token is defined
          - k3s_server_token is match('^K10[0-9a-f]+::server:.+')
        fail_msg: "k3s_server_token is missing from SOPS. Snapshots can't be restored on a new VM without it."
        quiet: true

    # ----- Install K3s Server -----
    - name: Check if K3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install K3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          sh -s - server \
            --cluster-init \
            --token "{{ k3s_server_token.split('::server:') | last }}" \
            --write-kubeconfig-mode "644" \
            --tls-san "{{ ansible_host }}" \
            --node-taint "node-role.kubernetes.io/control-plane:NoSchedule" \
            --disable traefik \
            --disable servicelb
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_binary.stat.exists
      # A fresh cluster makes its own CA, so it takes only the passphrase.
      # A restore (HARD-11) passes the full K10... token instead.
      no_log: true

    # ----- Wait for K3s -----
    - name: Wait for K3s to be ready
      ansible.builtin.command: k3s kubectl get nodes
      register: k3s_status
      until: k3s_status.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for control node to be Ready
      ansible.builtin.shell: |
        k3s kubectl get nodes -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}'
      register: node_ready
      until: node_ready.stdout == "True"
      retries: 30
      delay: 10
      changed_when: false

    - name: Read live server token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/token
      register: live_server_token
      no_log: true

    - name: Assert the escrowed token matches the live cluster
      ansible.builtin.assert:
        that: (live_server_token.content | b64decode | trim) == k3s_server_token
        fail_msg: "Live K3s token differs from the SOPS escrow. Re-escrow it (k3s token rotate?) or a restore will fail."
        quiet: true
      no_log: true

    # ----- Node Taint -----
    - name: Ensure control plane taint is applied
      ansible.builtin.command: >
        k3s kubectl taint nodes {{ inventory_hostname }} node-role.kubernetes.io/control-plane:NoSchedule --overwrite
      register: taint_result
      changed_when: "'modified' in taint_result.stdout or 'tainted' in taint_result.stdout"

    # ----- Retrieve Node Token -----
    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token

    - name: Store node token as fact
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_token.content | b64decode | trim }}"
        cacheable: true

    - name: Display K3s status
      ansible.builtin.debug:
        msg: "K3s control plane is running. Node token retrieved."

    # ----- Deploy Automated Etcd Snapshot Configuration -----
    - name: Ensure K3s config drop-in directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy K3s automated etcd snapshot configuration
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/10-etcd-snapshot.yaml
        content: |
          etcd-snapshot-schedule-cron: "0 2 * * *"
          etcd-snapshot-retention: 14
          etcd-snapshot-dir: "/var/lib/rancher/k3s/server/db/snapshots"
          etcd-snapshot-compress: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart K3s Control Plane

  handlers:
    - name: Restart K3s Control Plane
      ansible.builtin.systemd:
        name: k3s
        state: restarted
