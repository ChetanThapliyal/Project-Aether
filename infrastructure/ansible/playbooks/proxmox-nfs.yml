---
# =============================================================================
# Phase 04 task 4.17 — NFS storage for app files (ADR-016 addendum)
# =============================================================================
# ZFS dataset aether-pool/k8s-apps on the Proxmox host, exported over NFSv4 to
# the three K3s nodes only, with sanoid snapshots (hourly x48, daily x14).
# Databases stay on local-path (node-local, fast); app files (documents,
# archives, blobs, render output) live here so they survive a worker loss.
# The cluster side is csi-driver-nfs with StorageClass nfs-zfs
# (kubernetes/cluster/csi-driver-nfs.yaml, kubernetes/platform/storage/).
#
# Run: ansible-playbook -i inventory/hosts.yml playbooks/proxmox-nfs.yml
# =============================================================================

- name: Proxmox NFS export for Kubernetes app files
  hosts: proxmox
  become: true
  vars:
    k8s_apps_dataset: aether-pool/k8s-apps
    k8s_apps_path: /mnt/aether-pool/k8s-apps
    k8s_apps_quota: 200G          # leaves room on the pool for the etcd backup chain
    k8s_nfs_clients: "{{ groups['k3s_cluster'] | map('extract', hostvars, 'ansible_host') | list }}"

  tasks:
    - name: Install the NFS server and sanoid
      ansible.builtin.apt:
        name: [nfs-kernel-server, sanoid]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the app-files dataset
      community.general.zfs:
        name: "{{ k8s_apps_dataset }}"
        state: present
        extra_zfs_properties:
          mountpoint: "{{ k8s_apps_path }}"
          compression: lz4
          atime: "off"
          xattr: sa
          quota: "{{ k8s_apps_quota }}"

    - name: Serve NFSv4 only (one TCP port, no rpcbind dependency for clients)
      community.general.ini_file:
        path: /etc/nfs.conf
        section: nfsd
        option: "{{ item.key }}"
        value: "{{ item.value }}"
        mode: "0644"
      loop:
        - { key: vers3, value: "n" }
        - { key: vers4.0, value: "n" }
        - { key: vers4.1, value: "y" }
        - { key: vers4.2, value: "y" }
      notify: Restart NFS server

    - name: Create the config directories (neither package ships them on PVE 9)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: [/etc/exports.d, /etc/sanoid]

    # no_root_squash: csi-driver-nfs creates and chowns one subdirectory per
    # PVC as root. Each pod mounts only its own subdirectory, and only the
    # three node addresses can mount at all.
    - name: Export the dataset to the K3s nodes only
      ansible.builtin.copy:
        dest: /etc/exports.d/k8s-apps.exports
        mode: "0644"
        content: |
          # Managed by Ansible (proxmox-nfs.yml, task 4.17)
          {{ k8s_apps_path }} {{ k8s_nfs_clients | map('regex_replace', '$', '(rw,sync,no_subtree_check,no_root_squash,sec=sys)') | join(' ') }}
      notify: Reload exports

    - name: Snapshot policy for the dataset
      ansible.builtin.copy:
        dest: /etc/sanoid/sanoid.conf
        mode: "0644"
        content: |
          # Managed by Ansible (proxmox-nfs.yml, task 4.17)
          # Restore a file: copy it back from
          #   {{ k8s_apps_path }}/.zfs/snapshot/<snapshot>/<namespace>/<pvc>/
          [{{ k8s_apps_dataset }}]
                  use_template = k8s_apps

          [template_k8s_apps]
                  frequently = 0
                  hourly = 48
                  daily = 14
                  monthly = 0
                  yearly = 0
                  autosnap = yes
                  autoprune = yes

    - name: Enable the NFS server and the sanoid timer
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [nfs-server.service, sanoid.timer]

    # 4.20: Debian's node exporter skips /mnt, so the app dataset's fill is invisible
    # to Prometheus. Publish ZFS facts through the textfile collector instead.
    - name: Deploy the ZFS metrics script (textfile collector)
      ansible.builtin.copy:
        dest: /usr/local/bin/zfs-textfile-metrics.sh
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Managed by Ansible (proxmox-nfs.yml, task 4.20)
          set -euo pipefail
          out=/var/lib/prometheus/node-exporter/aether_zfs.prom
          tmp=$(mktemp "${out}.XXXXXX")
          trap 'rm -f "$tmp"' EXIT
          {
            echo "# HELP aether_zfs_dataset_used_bytes Bytes referenced by the dataset (what its quota counts)."
            echo "# TYPE aether_zfs_dataset_used_bytes gauge"
            echo "# HELP aether_zfs_dataset_quota_bytes The dataset's quota, 0 when it has none."
            echo "# TYPE aether_zfs_dataset_quota_bytes gauge"
            echo "# HELP aether_zfs_dataset_available_bytes Bytes the dataset can still take."
            echo "# TYPE aether_zfs_dataset_available_bytes gauge"
            echo "# HELP aether_zfs_newest_snapshot_timestamp_seconds Creation time of the dataset's newest snapshot, 0 when none."
            echo "# TYPE aether_zfs_newest_snapshot_timestamp_seconds gauge"
            zfs list -Hp -o name,referenced,quota,available -r -t filesystem aether-pool | while read -r ds ref quota avail; do
              echo "aether_zfs_dataset_used_bytes{dataset=\"$ds\"} $ref"
              echo "aether_zfs_dataset_quota_bytes{dataset=\"$ds\"} $quota"
              echo "aether_zfs_dataset_available_bytes{dataset=\"$ds\"} $avail"
              newest=$(zfs list -Hp -t snapshot -o creation -s creation -d 1 "$ds" 2>/dev/null | tail -1)
              echo "aether_zfs_newest_snapshot_timestamp_seconds{dataset=\"$ds\"} ${newest:-0}"
            done
            # INC-2026-014 follow-up: scrub results, so a missed or failed scrub alerts.
            echo "# HELP aether_zfs_pool_last_scrub_timestamp_seconds When the pool's last completed scrub finished, 0 when never."
            echo "# TYPE aether_zfs_pool_last_scrub_timestamp_seconds gauge"
            echo "# HELP aether_zfs_pool_scrub_errors Errors the last completed scrub found."
            echo "# TYPE aether_zfs_pool_scrub_errors gauge"
            echo "# HELP aether_zfs_pool_device_errors Read, write and checksum errors summed over the pool's devices since import."
            echo "# TYPE aether_zfs_pool_device_errors gauge"
            for pool in $(zpool list -H -o name); do
              scan=$(zpool status "$pool" | sed -n 's/^ *scan: //p')
              when=0; serr=0
              case "$scan" in
                "scrub repaired"*" errors on "*)
                  serr=$(echo "$scan" | sed -n 's/.* with \([0-9]*\) errors on .*/\1/p')
                  when=$(date -d "$(echo "$scan" | sed 's/.* errors on //')" +%s 2>/dev/null || echo 0) ;;
              esac
              derr=$(zpool status -p "$pool" | awk '/^\t  / && NF>=5 && $3 ~ /^[0-9]+$/ {s += $3 + $4 + $5} END {print s+0}')
              echo "aether_zfs_pool_last_scrub_timestamp_seconds{pool=\"$pool\"} ${when:-0}"
              echo "aether_zfs_pool_scrub_errors{pool=\"$pool\"} ${serr:-0}"
              echo "aether_zfs_pool_device_errors{pool=\"$pool\"} $derr"
            done
          } > "$tmp"
          chmod 0644 "$tmp"
          mv "$tmp" "$out"

    - name: Deploy the ZFS metrics service and 5-minute timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: zfs-textfile-metrics.service
          content: |
            [Unit]
            Description=ZFS dataset metrics for node exporter (4.20)
            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/zfs-textfile-metrics.sh
        - name: zfs-textfile-metrics.timer
          content: |
            [Unit]
            Description=Refresh ZFS dataset metrics every 5 minutes (4.20)
            [Timer]
            OnBootSec=1min
            OnUnitActiveSec=5min
            [Install]
            WantedBy=timers.target
      register: zfs_metrics_units

    - name: Reload systemd and enable the ZFS metrics timer
      ansible.builtin.systemd_service:
        name: zfs-textfile-metrics.timer
        enabled: true
        state: started
        daemon_reload: "{{ zfs_metrics_units.changed }}"

    - name: Flush handlers before checking
      ansible.builtin.meta: flush_handlers

    # Check live state rather than trust handlers: a failed earlier run drops
    # queued handlers, and the rerun then sees no change and never fires them.
    - name: Read the NFS versions the kernel server is offering
      ansible.builtin.slurp:
        src: /proc/fs/nfsd/versions
      register: nfsd_versions

    - name: Restart the NFS server if it still offers NFSv3 or v4.0
      ansible.builtin.systemd_service:
        name: nfs-server.service
        state: restarted
      when: (nfsd_versions.content | b64decode).split() | intersect(['+3', '+4.0']) | length > 0

    - name: Re-export (idempotent; applies /etc/exports.d)
      ansible.builtin.command: exportfs -ra
      changed_when: false

    - name: Read the live export list
      ansible.builtin.command: exportfs -s
      register: nfs_exports
      changed_when: false

    - name: Assert the dataset is exported to exactly the K3s nodes
      ansible.builtin.assert:
        that:
          - nfs_exports.stdout_lines | select('search', '^' ~ k8s_apps_path ~ '\\s') | list | length == k8s_nfs_clients | length
        fail_msg: "Unexpected exports: {{ nfs_exports.stdout_lines }}"
        quiet: true

  handlers:
    - name: Restart NFS server
      ansible.builtin.systemd_service:
        name: nfs-server.service
        state: restarted

    - name: Reload exports
      ansible.builtin.command: exportfs -ra
      changed_when: true
