# =============================================================================
# Project Aether — Ansible Inventory
# =============================================================================
# K3s cluster nodes provisioned by Terraform on Proxmox
# =============================================================================

all:
  vars:
    ansible_user: owl
    app_user: owl
    ansible_ssh_private_key_file: ~/.ssh/homelab
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

  children:
    control:
      hosts:
        k3s-control-01:
          ansible_host: 192.168.1.51

    workers:
      hosts:
        k3s-worker-01:
          ansible_host: 192.168.1.52
        k3s-worker-02:
          ansible_host: 192.168.1.53

    k3s_cluster:
      children:
        control:
        workers:

    gcp_dmz:
      hosts:
        aether-gcp-dmz:
          ansible_host: aether-gcp-dmz
          ansible_user: owl
          app_user: owl

    oci:
      hosts:
        bookorbit:
          ansible_host: bookorbit
          ansible_user: ubuntu
          app_user: ubuntu
