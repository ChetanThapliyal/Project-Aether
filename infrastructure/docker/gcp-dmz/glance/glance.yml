  # ---------------------------------------------------------------------------
  # Page 4: Networking. Role-level only (public-repo detail policy): no IPs,
  # hostnames or port numbers. Static design facts dated below; update this page
  # when a networking chore lands (FND-03/11/12/14/18, GOP-04, Phase 04).
  # ---------------------------------------------------------------------------
  - name: "Network & access"
    slug: networking            # FND-24 rename; the slug keeps the URL and the CSP hash
    columns:
      - size: full
        widgets:
          - type: html
            title: Networking
            frameless: true
            hide-header: true
            source: |
              <div class="ae-live-head">
                <span class="ae-live-title">Network &amp; access</span>
                <span class="vitals-badge">DESIGN · 20 NOV 2026</span>
              </div>
              <div class="ae-hero">
                <div class="ae-stat"><div class="ae-stat-label">Sites on one mesh</div><div class="ae-stat-num">3</div><div class="ae-stat-sub">home lab, Oracle Cloud and Google Cloud, joined by WireGuard (Tailscale)</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Inbound TCP from the internet</div><div class="ae-stat-num ae-ok">0<span>ports</span></div><div class="ae-stat-sub">home is behind carrier-grade NAT; both clouds allow no inbound TCP</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Access rules</div><div class="ae-stat-num">12<span>rules</span></div><div class="ae-stat-sub">across 11 role tags, deny by default</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Policy tests</div><div class="ae-stat-num">7</div><div class="ae-stat-sub">run on every policy save; a save that breaks a boundary is rejected</div></div>
              </div>

              <div class="vitals-card">
                <div class="section-title">How traffic moves · five flows, one at a time</div>
                <img class="ae-diagram" src="/assets/aether-traffic.gif" width="1280" height="720" loading="lazy" alt="Animated diagram with three zones: the on-prem home lab, the Oracle Cloud core and the Google Cloud DMZ, joined by a private WireGuard mesh. It plays five flows in turn: a visitor reaching the status page through Cloudflare and an outbound tunnel; the operator working over the mesh; a git push deploying through a signed webhook; metrics, logs and alerts; and backups going offsite with heartbeats.">
              </div>

              <div class="vitals-card">
                <div class="section-title">The public paths</div>
                <div class="ae-path">
                  <div class="ae-hop"><span class="ae-hop-k">Visitor</span><span class="ae-hop-v">browser, HTTPS</span></div>
                  <span class="ae-flow-arrow" aria-hidden="true">→</span>
                  <div class="ae-hop"><span class="ae-hop-k">Cloudflare edge</span><span class="ae-hop-v">TLS ends here, managed certificate</span></div>
                  <span class="ae-flow-arrow" aria-hidden="true">→</span>
                  <div class="ae-hop"><span class="ae-hop-k">Tunnel</span><span class="ae-hop-v">opened outbound by the edge host, over IPv6</span></div>
                  <span class="ae-flow-arrow" aria-hidden="true">→</span>
                  <div class="ae-hop ae-hop-end"><span class="ae-hop-k">This page</span><span class="ae-hop-v">Glance, read-only</span></div>
                </div>
                <p class="ae-muted">A second hostname on the same tunnel publishes one path: GitHub's push notifications to the GitOps controller, which rejects any request not signed with a shared secret. Every other path there returns 404, and the controller's UI stays on the mesh. Nothing else is reachable from the internet. The live numbers on this page come from a sanitised summary that the page pulls from the monitoring core over the private mesh, so visitors never touch the private network.</p>
              </div>

              <div class="ae-section-head">Zones</div>
              <div class="ae-envs">
                <div class="vitals-card ae-env">
                  <div class="ae-env-head">
                    <div><div class="ae-env-kicker">On premises</div><div class="ae-env-name">Home lab</div></div>
                    <span class="vitals-badge">CGNAT</span>
                  </div>
                  <p class="ae-note">The hypervisor and the three cluster VMs sit on the home LAN behind carrier-grade NAT, so nothing at home can be reached from outside.</p>
                  <div class="ae-chips"><span>no port forwards</span><span>MetalLB layer 2</span><span>Envoy Gateway</span></div>
                  <div class="bar-row"><span class="bar-name">Ingress</span><span class="ae-fact">Envoy Gateway, reachable on the mesh only; public DNS names for the apps point at its mesh address, with Let's Encrypt certificates issued over DNS</span></div>
                  <div class="bar-row"><span class="bar-name">In-cluster</span><span class="ae-fact">default-deny NetworkPolicies, both directions, for the apps, the databases, the gateway, the certificate issuer, monitoring and platform services; only the Envoy proxy may reach app pods, and the proxy reaches nothing but the apps</span></div>
                  <div class="bar-row"><span class="bar-name">Pods</span><span class="ae-fact">the apps, the databases, the gateway, the certificate issuer and the GitOps controller refuse any pod that runs as root or keeps extra privileges (Pod Security <code>restricted</code>); only the load balancer, node metrics and the mesh keep host access</span></div>
                  <div class="bar-row"><span class="bar-name">Admin</span><span class="ae-fact">the ArgoCD UI is published on the mesh by the Tailscale operator, not on the LAN</span></div>
                </div>
                <div class="vitals-card ae-env">
                  <div class="ae-env-head">
                    <div><div class="ae-env-kicker">ap-mumbai-1</div><div class="ae-env-name">Oracle Cloud</div></div>
                    <span class="vitals-badge">NO INBOUND TCP</span>
                  </div>
                  <p class="ae-note">Every service is its own node on the mesh, published by tsdproxy with a role tag: app, admin or probe. The cloud firewall lets in the mesh's direct-path traffic and, for when the mesh is down, SSH through Google IAP, which Google IAM gates.</p>
                  <div class="ae-chips"><span>per-service nodes</span><span>3 roles</span><span>SSH over the mesh only</span></div>
                  <div class="bar-row"><span class="bar-name">Roles</span><span class="ae-fact">admins reach admin tools; the observer reaches probe services only</span></div>
                  <div class="bar-row"><span class="bar-name">Logs in</span><span class="ae-fact">cluster nodes and the hypervisor may push logs to Loki and nothing else</span></div>
                  <div class="bar-row"><span class="bar-name">SSH</span><span class="ae-fact">public SSH closed; hardened sshd behind the mesh</span></div>
                </div>
                <div class="vitals-card ae-env">
                  <div class="ae-env-head">
                    <div><div class="ae-env-kicker">us-central1-a</div><div class="ae-env-name">Google Cloud</div></div>
                    <span class="vitals-badge">IPV6 ONLY</span>
                  </div>
                  <p class="ae-note">The least-trusted machine: the outside observer and this page. It has no public IPv4, accepts no inbound connections, and can reach only probe services and the cluster's front door.</p>
                  <div class="ae-chips"><span>no public IPv4</span><span>outbound tunnel</span><span>observer role</span></div>
                  <div class="bar-row"><span class="bar-name">Out</span><span class="ae-fact">probes probe-tagged services and the cluster ingress over HTTPS</span></div>
                  <div class="bar-row"><span class="bar-name">In</span><span class="ae-fact">receives backup and watchdog heartbeats on its monitor only</span></div>
                  <div class="bar-row"><span class="bar-name">Public</span><span class="ae-fact">served only through the Cloudflare tunnel</span></div>
                </div>
              </div>

              <div class="vitals-card ae-gap-top">
                <div class="section-title">Who may talk to whom (mesh rules, by role)</div>
                <div class="ae-flows">
                  <div class="ae-flow"><span class="ae-flow-from">Operator devices</span><span class="ae-flow-arrow" aria-hidden="true">→</span><span class="ae-flow-to">every zone</span><span class="ae-flow-what">admin and SSH</span><span class="ae-flow-note">re-authenticated every 12 h on personal devices</span></div>
                  <div class="ae-flow"><span class="ae-flow-from">Edge observer</span><span class="ae-flow-arrow" aria-hidden="true">→</span><span class="ae-flow-to">probe services, cluster ingress</span><span class="ae-flow-what">HTTPS</span><span class="ae-flow-note">nothing else on the cloud host; admin tools don't even resolve</span></div>
                  <div class="ae-flow"><span class="ae-flow-from">Monitoring core</span><span class="ae-flow-arrow" aria-hidden="true">→</span><span class="ae-flow-to">cluster nodes, hypervisor</span><span class="ae-flow-what">metrics</span><span class="ae-flow-note">scrape only, no SSH or API access</span></div>
                  <div class="ae-flow"><span class="ae-flow-from">Monitoring core</span><span class="ae-flow-arrow" aria-hidden="true">→</span><span class="ae-flow-to">edge observer</span><span class="ae-flow-what">heartbeats, host metrics</span><span class="ae-flow-note">push monitors and one metrics port; no remote Docker access</span></div>
                  <div class="ae-flow"><span class="ae-flow-from">Cluster nodes</span><span class="ae-flow-arrow" aria-hidden="true">→</span><span class="ae-flow-to">monitoring core</span><span class="ae-flow-what">logs</span><span class="ae-flow-note">Alloy to Loki; the only path out of the cluster</span></div>
                  <div class="ae-flow"><span class="ae-flow-from">Hypervisor</span><span class="ae-flow-arrow" aria-hidden="true">→</span><span class="ae-flow-to">edge observer</span><span class="ae-flow-what">heartbeats</span><span class="ae-flow-note">each backup stage reports in</span></div>
                  <div class="ae-flow"><span class="ae-flow-from">Hypervisor</span><span class="ae-flow-arrow" aria-hidden="true">→</span><span class="ae-flow-to">monitoring core</span><span class="ae-flow-what">logs</span><span class="ae-flow-note">its journal to Loki, so a power cut leaves evidence off the box</span></div>
                </div>
              </div>


          # FND-24: identity and access, role level only. The two counts come
          # from access.json, built at every deploy (build_track_record.py
          # --access): service-account keys in the Google Cloud project, and
          # encrypted secret files in Git. No names, IDs or key ages.
          - type: custom-api
            title: Identity and access
            frameless: true
            hide-header: true
            url: http://127.0.0.1:8080/assets/access.json
            cache: 10m
            template: |
              {{ $known := .JSON.Exists "user_keys" }}
              {{ $keys := .JSON.Int "user_keys" }}
              <div class="ae-section-head">Identity and access</div>
              <div class="ae-hero">
                <div class="ae-stat"><div class="ae-stat-label">Service-account keys</div><div class="ae-stat-num {{ if and $known (eq $keys 0) }}ae-ok{{ else }}ae-bad{{ end }}">{{ if $known }}{{ $keys }}{{ else }}?{{ end }}</div><div class="ae-stat-sub">{{ if $known }}long-lived keys for the {{ .JSON.Int "service_accounts" }} Google Cloud service accounts{{ else }}not checked at the last deploy{{ end }}; counted at every deploy</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Secrets in Git</div><div class="ae-stat-num {{ if eq (.JSON.Int "secret_files") (.JSON.Int "secret_files_encrypted") }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "secret_files_encrypted" }}<span>/{{ .JSON.Int "secret_files" }}</span></div><div class="ae-stat-sub">files encrypted with SOPS; CI rejects a plaintext one</div></div>
                <div class="ae-stat"><div class="ae-stat-label">People with access</div><div class="ae-stat-num">1</div><div class="ae-stat-sub">the operator; everything else is a machine identity</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Public SSH</div><div class="ae-stat-num ae-ok">0<span>hosts</span></div><div class="ae-stat-sub">SSH only over the mesh, or IAP when it's down</div></div>
              </div>
              <div class="vitals-card">
                <div class="section-title">Who and what can do what (design facts · 16 Nov 2026)</div>
                <div class="bar-row"><span class="bar-name">Operator</span><span class="ae-fact">SSH from personal devices re-authenticates every 12 hours; routine logins aren't root</span></div>
                <div class="bar-row"><span class="bar-name">CI</span><span class="ae-fact">GitHub Actions gets short-lived cloud credentials through workload identity federation, only from <code>main</code>; it can read infrastructure state and metadata, nothing else</span></div>
                <div class="bar-row"><span class="bar-name">Edge VM</span><span class="ae-fact">its service account may create backup objects only: it can't read, replace or delete them</span></div>
                <div class="bar-row"><span class="bar-name">Cluster</span><span class="ae-fact">secrets are decrypted inside the cluster at deploy time; the GitOps UI is reachable on the mesh only</span></div>
                <div class="bar-row"><span class="bar-name">Secrets</span><span class="ae-fact">encrypted for two independent keys, one local and one in Cloud KMS; each alone decrypts (checked 15 Nov 2026); mesh auth keys follow a rotation runbook</span></div>
                <div class="bar-row"><span class="bar-name">Break-glass</span><span class="ae-fact">if the mesh is down, SSH goes through Google's Identity-Aware Proxy, gated by IAM; no host has public SSH</span></div>
              </div>

          - type: html
            title: Roadmap and decisions
            frameless: true
            hide-header: true
            source: |
              <div class="vitals-card ae-gap-top">
                <div class="ae-backups-head">
                  <div>
                    <div class="ae-stat-label">Still changing</div>
                    <div class="ae-stat-num">1<span>queued change</span></div>
                    <div class="ae-stat-sub">the network isn't final; these land over the next phases</div>
                  </div>
                  <span class="vitals-badge">ROADMAP</span>
                </div>
                <ul class="ae-changes">
                  <li><span class="ae-change-id">Apps</span><div><div class="ae-change-title">More apps on the cluster</div><div class="ae-change-text">Three apps already run behind the gateway with files on NFS from the home lab's ZFS pool. The rest follow in Phase 04, each with its own route and outside check.</div></div></li>
                </ul>
              </div>

              <div class="ae-section-head">Decisions</div>
              <div class="ae-adrs">
                <a class="ae-adr" href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/004-network-access.md" target="_blank" rel="noreferrer"><span class="ae-adr-num">004</span><span class="ae-adr-title">Network access</span><span class="ae-adr-sub">a mesh for operators; one public entry point</span></a>
                <a class="ae-adr" href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/013-tailnet-microsegmentation.md" target="_blank" rel="noreferrer"><span class="ae-adr-num">013</span><span class="ae-adr-title">Tailnet segmentation</span><span class="ae-adr-sub">role tags, rules and tests</span></a>
                <a class="ae-adr" href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/020-public-observability-data-diode.md" target="_blank" rel="noreferrer"><span class="ae-adr-num">020</span><span class="ae-adr-title">Public observability</span><span class="ae-adr-sub">the tunnel and the data diode</span></a>
                <a class="ae-adr" href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/021-internal-dns-and-pki.md" target="_blank" rel="noreferrer"><span class="ae-adr-num">021</span><span class="ae-adr-title">Internal DNS and PKI</span><span class="ae-adr-sub">names and certificates inside</span></a>
