                    <span class="vitals-badge">A1.FLEX · ARM</span>
                  </div>
                  <p class="ae-note">The monitoring and automation core: Prometheus, Loki, Grafana, Alertmanager and Kestra, plus a few small apps, all in Docker.</p>
                  <div class="ae-chips"><span>2 OCPU</span><span>12 GB RAM</span><span>100 GB disk</span></div>
