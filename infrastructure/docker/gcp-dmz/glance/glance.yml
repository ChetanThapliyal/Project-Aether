  # ---------------------------------------------------------------------------
  # Page 5: Docs (FND-23). The index is built from the repo at every deploy
  # (build_track_record.py --docs), so new ADRs, reviews and runbooks appear
  # without editing this file. Posts come from the blog's homelab tag only;
  # Lexicon has no tag feeds, so its notes (mostly unrelated) aren't listed.
  # Feeds are fetched by Glance on the DMZ, which has IPv6 only.
  # ---------------------------------------------------------------------------
  - name: Docs
    slug: docs
    columns:
      - size: full
        widgets:
          # Heading and the four counts first; the lists stay below the carousel
          # and read the same file.
          - type: custom-api
            title: Docs
            frameless: true
            hide-header: true
            url: http://127.0.0.1:8080/assets/docs-index.json
            cache: 5m
            template: |
              <div class="ae-live-head">
                <span class="ae-live-title">Docs</span>
                <a class="vitals-badge ae-badge-link" href="https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs" target="_blank" rel="noreferrer">ALL IN THE REPOSITORY ↗</a>
              </div>
              <div class="ae-hero">
                <div class="ae-stat"><div class="ae-stat-label">Architecture decisions</div><div class="ae-stat-num">{{ .JSON.Int "counts.adrs" }}</div><div class="ae-stat-sub">why each part is built the way it is</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Incident reviews</div><div class="ae-stat-num">{{ .JSON.Int "counts.incidents" }}</div><div class="ae-stat-sub">blameless, with root cause and guardrails</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Recovery scenarios</div><div class="ae-stat-num">{{ .JSON.Int "counts.dr" }}</div><div class="ae-stat-sub">each with a restore runbook and a drill</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Runbooks</div><div class="ae-stat-num">{{ .JSON.Int "counts.runbooks" }}</div><div class="ae-stat-sub">step by step, kept next to the code</div></div>
              </div>

          - type: html
            title: How it works
            hide-header: true
            frameless: true
            source: |
              <div class="ae-section-head" id="how-it-works">How it works</div>
              <div class="vitals-card">
                <div class="ae-carousel-head">
                  <div class="section-title">Flow diagrams · one part of the system each</div>
                  <span class="ae-carousel-hint">use Back and Next, or swipe</span>
                </div>
                <div class="ae-carousel" tabindex="0" role="region" aria-label="Flow diagrams">
                  <figure class="ae-carousel-slide" id="ae-slide-1">
                    <nav class="ae-carousel-nav" aria-label="Diagram 1 of 10">
                      <a class="ae-carousel-btn" href="#ae-slide-10" aria-label="Previous diagram">‹ Back</a>
                      <span class="ae-carousel-count">1 / 10</span>
                      <a class="ae-carousel-btn" href="#ae-slide-2" aria-label="Next diagram">Next ›</a>
                    </nav>
                    <div class="ae-diagram-scroll">
                      <img class="ae-diagram ae-diagram-wide" src="/assets/aether-flow-backups.svg" width="1600" height="1006" loading="lazy" alt="Backups and recovery. A K3s etcd snapshot at 02:00 is pulled to the hypervisor's ZFS disk, kept in a local restic repository and copied, age-encrypted, to an Object-Locked Backblaze B2 bucket. App databases are dumped at 01:30, snapshotted and streamed into the same bucket at 04:00. The cloud host runs restic nightly to object storage. Every stage sends a heartbeat to Uptime Kuma on the edge VM only when it succeeds, so silence raises an alert.">
                    </div>
                    <figcaption>
                      <span>Backups and recovery: three nightly paths, three copies, and a heartbeat sent only on success.</span>
                      <span class="ae-carousel-links"><a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/018-offsite-backup-and-3-2-1-disaster-recovery-strategy.md" target="_blank" rel="noreferrer">ADR-018 ↗</a> <a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/022-app-data-storage-and-backups.md" target="_blank" rel="noreferrer">ADR-022 ↗</a> <a href="/assets/aether-flow-backups.svg" target="_blank" rel="noreferrer">Full size ↗</a></span>
                    </figcaption>
                  </figure>
                  <figure class="ae-carousel-slide" id="ae-slide-2">
                    <nav class="ae-carousel-nav" aria-label="Diagram 2 of 10">
                      <a class="ae-carousel-btn" href="#ae-slide-1" aria-label="Previous diagram">‹ Back</a>
                      <span class="ae-carousel-count">2 / 10</span>
                      <a class="ae-carousel-btn" href="#ae-slide-3" aria-label="Next diagram">Next ›</a>
                    </nav>
                    <div class="ae-diagram-scroll">
                      <img class="ae-diagram ae-diagram-wide" src="/assets/aether-flow-monitoring.svg" width="1600" height="890" loading="lazy" alt="Monitoring and alerting. Prometheus, Loki, Alertmanager and Grafana run on the cloud host, off the cluster. Prometheus scrapes node exporters, kube-state-metrics, ArgoCD and the database exporters over the private mesh, and Grafana Alloy on each cluster node ships logs to Loki. Alertmanager sends alerts to Telegram. A Watchdog alert that always fires goes to Uptime Kuma on the edge VM, which also receives backup heartbeats and checks the apps from outside.">
                    </div>
                    <figcaption>
                      <span>Monitoring and alerting: it runs off the cluster, and a Watchdog alert shows the alert path still works.</span>
                      <span class="ae-carousel-links"><a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/019-centralized-logging-architecture.md" target="_blank" rel="noreferrer">ADR-019 ↗</a> <a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/020-public-observability-data-diode.md" target="_blank" rel="noreferrer">ADR-020 ↗</a> <a href="/assets/aether-flow-monitoring.svg" target="_blank" rel="noreferrer">Full size ↗</a></span>
                    </figcaption>
                  </figure>
                  <figure class="ae-carousel-slide" id="ae-slide-3">
                    <nav class="ae-carousel-nav" aria-label="Diagram 3 of 10">
                      <a class="ae-carousel-btn" href="#ae-slide-2" aria-label="Previous diagram">‹ Back</a>
                      <span class="ae-carousel-count">3 / 10</span>
                      <a class="ae-carousel-btn" href="#ae-slide-4" aria-label="Next diagram">Next ›</a>
                    </nav>
                    <div class="ae-diagram-scroll">
                      <img class="ae-diagram ae-diagram-wide" src="/assets/aether-flow-tailnet.svg" width="1600" height="920" loading="lazy" alt="Mesh segmentation. Every device on the private mesh carries a role tag, and access is granted between roles, never by location. The operator reaches every role; signed-in devices reach the apps and admin tools. The cloud host scrapes metrics from the cluster nodes, the hypervisor and the edge VM, the cluster nodes and the hypervisor send logs to it, and the hypervisor sends heartbeats to the edge VM. The edge VM may only check the monitored services, the public feed and the cluster&#x27;s web ports. Everything else is denied, and policy tests run on every save.">
                    </div>
                    <figcaption>
                      <span>Mesh segmentation: access goes by role, never by location, and policy tests run on every save.</span>
                      <span class="ae-carousel-links"><a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/013-tailnet-microsegmentation.md" target="_blank" rel="noreferrer">ADR-013 ↗</a> <a href="/assets/aether-flow-tailnet.svg" target="_blank" rel="noreferrer">Full size ↗</a></span>
                    </figcaption>
                  </figure>
                  <figure class="ae-carousel-slide" id="ae-slide-4">
                    <nav class="ae-carousel-nav" aria-label="Diagram 4 of 10">
                      <a class="ae-carousel-btn" href="#ae-slide-3" aria-label="Previous diagram">‹ Back</a>
                      <span class="ae-carousel-count">4 / 10</span>
                      <a class="ae-carousel-btn" href="#ae-slide-5" aria-label="Next diagram">Next ›</a>
                    </nav>
                    <div class="ae-diagram-scroll">
                      <img class="ae-diagram ae-diagram-wide" src="/assets/aether-flow-gitops.svg" width="1600" height="960" loading="lazy" alt="How a change is delivered. A push to main runs the same checks as the local hooks in GitHub Actions. GitHub sends a signed webhook through Cloudflare and the edge VM&#x27;s outbound tunnel to ArgoCD on the cluster, which refreshes only the apps whose files changed. Secrets stay encrypted in Git for two keys, and are decrypted inside the cluster with one of them. Hosts and machines are changed by hand with Ansible and Terraform, and a nightly job reports drift. On a fresh cluster the root app applies everything in sync waves, each healthy before the next: namespaces, operators, config, controllers, policies, databases, then apps.">
                    </div>
                    <figcaption>
                      <span>Delivery: a push is checked, then ArgoCD applies only what changed; secrets stay encrypted in Git.</span>
                      <span class="ae-carousel-links"><a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/007-secrets-management.md" target="_blank" rel="noreferrer">ADR-007 ↗</a> <a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/009-gitops-controller.md" target="_blank" rel="noreferrer">ADR-009 ↗</a> <a href="/assets/aether-flow-gitops.svg" target="_blank" rel="noreferrer">Full size ↗</a></span>
                    </figcaption>
                  </figure>
                  <figure class="ae-carousel-slide" id="ae-slide-5">
                    <nav class="ae-carousel-nav" aria-label="Diagram 5 of 10">
                      <a class="ae-carousel-btn" href="#ae-slide-4" aria-label="Previous diagram">‹ Back</a>
                      <span class="ae-carousel-count">5 / 10</span>
                      <a class="ae-carousel-btn" href="#ae-slide-6" aria-label="Next diagram">Next ›</a>
                    </nav>
                    <div class="ae-diagram-scroll">
                      <img class="ae-diagram ae-diagram-wide" src="/assets/aether-flow-secrets.svg" width="1600" height="910" loading="lazy" alt="Where secrets live and how each one reaches the place it is used. Sixteen files in the public repository are encrypted for two keys, an age key and a Cloud KMS key, and pre-commit and CI refuse any file not encrypted for both. In the cluster, ArgoCD fetches the encrypted files and a sidecar decrypts them with a copy of the age key, producing the Secrets the apps read. From the operator&#x27;s laptop, Ansible decrypts in memory and writes each host&#x27;s configuration, Terraform decrypts to a temporary file deleted when the command exits, and the mesh policy is pasted in by hand. The nightly drift check logs in to Google without a stored key and decrypts with KMS. Backups that leave the cluster are encrypted again.">
                    </div>
                    <figcaption>
                      <span>Secrets: encrypted in Git for two keys, decrypted only where each one is used.</span>
                      <span class="ae-carousel-links"><a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/007-secrets-management.md" target="_blank" rel="noreferrer">ADR-007 ↗</a> <a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/runbooks/sops-key-rotation.md" target="_blank" rel="noreferrer">Key rotation ↗</a> <a href="/assets/aether-flow-secrets.svg" target="_blank" rel="noreferrer">Full size ↗</a></span>
                    </figcaption>
                  </figure>
                  <figure class="ae-carousel-slide" id="ae-slide-6">
                    <nav class="ae-carousel-nav" aria-label="Diagram 6 of 10">
                      <a class="ae-carousel-btn" href="#ae-slide-5" aria-label="Previous diagram">‹ Back</a>
                      <span class="ae-carousel-count">6 / 10</span>
                      <a class="ae-carousel-btn" href="#ae-slide-7" aria-label="Next diagram">Next ›</a>
                    </nav>
                    <div class="ae-diagram-scroll">
                      <img class="ae-diagram ae-diagram-wide" src="/assets/aether-flow-app-request.svg" width="1600" height="810" loading="lazy" alt="How a request reaches an app. A device on the mesh asks public DNS for the app&#x27;s name, and a wildcard record answers with an address that only works on the mesh. The device connects over the mesh to a proxy that hands the connection to Envoy Gateway, which terminates HTTPS with a wildcard Let&#x27;s Encrypt certificate and routes to the app. The app reaches the shared PostgreSQL and Redis. Network policies deny everything by default, and each app opts in to the access it needs.">
                    </div>
                    <figcaption>
                      <span>How a request reaches an app: the name resolves publicly but only works on the mesh, and every hop inside the cluster is denied by default.</span>
                      <span class="ae-carousel-links"><a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/021-internal-dns-and-pki.md" target="_blank" rel="noreferrer">ADR-021 ↗</a> <a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/022-app-data-storage-and-backups.md" target="_blank" rel="noreferrer">ADR-022 ↗</a> <a href="/assets/aether-flow-app-request.svg" target="_blank" rel="noreferrer">Full size ↗</a></span>
                    </figcaption>
                  </figure>
                  <figure class="ae-carousel-slide" id="ae-slide-7">
                    <nav class="ae-carousel-nav" aria-label="Diagram 7 of 10">
                      <a class="ae-carousel-btn" href="#ae-slide-6" aria-label="Previous diagram">‹ Back</a>
                      <span class="ae-carousel-count">7 / 10</span>
                      <a class="ae-carousel-btn" href="#ae-slide-8" aria-label="Next diagram">Next ›</a>
                    </nav>
                    <div class="ae-diagram-scroll">
                      <img class="ae-diagram ae-diagram-wide" src="/assets/aether-flow-topology.svg" width="1600" height="910" loading="lazy" alt="The cluster&#x27;s layout. Three virtual machines share one laptop with 2 cores and 12 GB. The control plane runs the API server and the only etcd member and is tainted, so nothing else runs there. Worker 1 runs the mesh gateway, the Envoy proxy, most apps, Redis, and PostgreSQL and CouchDB, which are pinned there because their volumes are on that machine&#x27;s disk. Worker 2 runs ArgoCD, Paperless and the controllers. The hypervisor&#x27;s HDD holds a ZFS pool shared over NFS for app files and nightly dumps, snapshotted and sent offsite. Every workload is a single replica.">
                    </div>
                    <figcaption>
                      <span>Cluster topology: three VMs on one laptop; the databases are pinned to one worker's disk, app files sit on the hypervisor's ZFS pool.</span>
                      <span class="ae-carousel-links"><a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/016-kubernetes-storage-strategy.md" target="_blank" rel="noreferrer">ADR-016 ↗</a> <a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/runbooks/node-maintenance.md" target="_blank" rel="noreferrer">Node maintenance ↗</a> <a href="/assets/aether-flow-topology.svg" target="_blank" rel="noreferrer">Full size ↗</a></span>
                    </figcaption>
                  </figure>
                  <figure class="ae-carousel-slide" id="ae-slide-8">
                    <nav class="ae-carousel-nav" aria-label="Diagram 8 of 10">
                      <a class="ae-carousel-btn" href="#ae-slide-7" aria-label="Previous diagram">‹ Back</a>
                      <span class="ae-carousel-count">8 / 10</span>
                      <a class="ae-carousel-btn" href="#ae-slide-9" aria-label="Next diagram">Next ›</a>
                    </nav>
                    <div class="ae-diagram-scroll">
                      <img class="ae-diagram ae-diagram-wide" src="/assets/aether-flow-status-page.svg" width="1600" height="830" loading="lazy" alt="This page&#x27;s one-way data path. On the cloud host, a small service turns Prometheus metrics into a summary of counts and plain numbers every five minutes, and a check blocks any summary that contains a name or an address. The edge VM pulls that file over its single grant on the mesh, Glance draws the page from it, and Cloudflare serves the page through a tunnel opened from inside. Uptime Kuma alerts if the summary is more than 15 minutes old. Nothing flows back from the edge or from visitors.">
                    </div>
                    <figcaption>
                      <span>This page: one sanitised file leaves the cloud host, the edge pulls it, and nothing flows back.</span>
                      <span class="ae-carousel-links"><a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/020-public-observability-data-diode.md" target="_blank" rel="noreferrer">ADR-020 ↗</a> <a href="/assets/aether-flow-status-page.svg" target="_blank" rel="noreferrer">Full size ↗</a></span>
                    </figcaption>
                  </figure>
                  <figure class="ae-carousel-slide" id="ae-slide-9">
                    <nav class="ae-carousel-nav" aria-label="Diagram 9 of 10">
                      <a class="ae-carousel-btn" href="#ae-slide-8" aria-label="Previous diagram">‹ Back</a>
                      <span class="ae-carousel-count">9 / 10</span>
                      <a class="ae-carousel-btn" href="#ae-slide-10" aria-label="Next diagram">Next ›</a>
                    </nav>
                    <div class="ae-diagram-scroll">
                      <img class="ae-diagram ae-diagram-wide" src="/assets/aether-flow-cloudinit-template.svg" width="1600" height="690" loading="lazy" alt="How a cluster node is built. An Ubuntu cloud image is imported once into a virtual machine and frozen as a template, with nothing node-specific inside. Each node is a full clone of that template and gets its own user, SSH key, network settings and hostname from cloud-init on first boot. A broken node is destroyed and cloned again, and Terraform does the cloning today.">
                    </div>
                    <figcaption>
                      <span>How a node is built: one image, frozen as a template; each clone gets its identity at first boot.</span>
                      <span class="ae-carousel-links"><a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/006-proxmox-vm-provisioning-strategy.md" target="_blank" rel="noreferrer">ADR-006 ↗</a> <a href="/assets/aether-flow-cloudinit-template.svg" target="_blank" rel="noreferrer">Full size ↗</a></span>
                    </figcaption>
                  </figure>
                  <figure class="ae-carousel-slide" id="ae-slide-10">
                    <nav class="ae-carousel-nav" aria-label="Diagram 10 of 10">
                      <a class="ae-carousel-btn" href="#ae-slide-9" aria-label="Previous diagram">‹ Back</a>
                      <span class="ae-carousel-count">10 / 10</span>
                      <a class="ae-carousel-btn" href="#ae-slide-1" aria-label="Next diagram">Next ›</a>
                    </nav>
                    <div class="ae-diagram-scroll">
                      <img class="ae-diagram ae-diagram-wide" src="/assets/aether-flow-replicas-vs-backup.svg" width="1600" height="700" loading="lazy" alt="Why the cluster has backups instead of replicated storage. All three cluster nodes run on one laptop with one disk, one power supply and one hypervisor, so a replica on each node fails together with the others. Instead, databases and app files are dumped and snapshotted nightly and copied, encrypted, to a locked bucket offsite. After a power cut took every node down, a restore drill matched every database row count.">
                    </div>
                    <figcaption>
                      <span>Replicas or backups: on one physical host replicas share every failure, so the redundancy is a copy somewhere else.</span>
                      <span class="ae-carousel-links"><a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/016-kubernetes-storage-strategy.md" target="_blank" rel="noreferrer">ADR-016 ↗</a> <a href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/022-app-data-storage-and-backups.md" target="_blank" rel="noreferrer">ADR-022 ↗</a> <a href="/assets/aether-flow-replicas-vs-backup.svg" target="_blank" rel="noreferrer">Full size ↗</a></span>
                    </figcaption>
                  </figure>
                </div>
              </div>

          - type: custom-api
            title: Docs lists
            frameless: true
            hide-header: true
            url: http://127.0.0.1:8080/assets/docs-index.json
            cache: 5m
            template: |
              <div class="vitals-card">
                <div class="section-title">Architecture decisions</div>
                <ul class="ae-doclist ae-doclist-cols">
                  {{ range .JSON.Array "adrs" }}
                  <li><a href="{{ .String "url" }}" target="_blank" rel="noreferrer"><span class="ae-doc-num">{{ .String "num" }}</span><span class="ae-doc-title">{{ .String "title" }}</span></a>{{ if ne (.String "status") "Accepted" }}<span class="ae-doc-tag">{{ .String "status" }}</span>{{ end }}</li>
                  {{ end }}
                </ul>
              </div>

              <div class="vitals-card">
                <div class="section-title">Incident reviews</div>
                <ul class="ae-doclist">
                  {{ range .JSON.Array "incidents" }}
                  <li><a href="{{ .String "url" }}" target="_blank" rel="noreferrer"><span class="ae-doc-date">{{ .String "date" }}</span><span class="ae-doc-title">{{ .String "title" }}</span></a><span class="ae-sev{{ if eq (.String "severity") "SEV1" }} ae-sev1{{ else if eq (.String "severity") "SEV2" }} ae-sev2{{ end }}">{{ .String "severity" }}</span></li>
                  {{ end }}
                </ul>
              </div>

              <div class="ae-record ae-record-2">
                <div class="vitals-card">
                  <div class="section-title">Disaster recovery</div>
                  <ul class="ae-doclist">
                    {{ range .JSON.Array "dr" }}
                    <li class="ae-doc-stack"><a href="{{ .String "url" }}" target="_blank" rel="noreferrer"><span class="ae-doc-title">{{ .String "title" }}</span></a><span class="ae-doc-note"><span class="ae-dot {{ if .Bool "drilled" }}ae-ok{{ else }}ae-warn{{ end }}"></span>{{ if .Bool "drilled" }}{{ .String "last_drilled" }}{{ else }}not drilled yet{{ end }}</span></li>
                    {{ end }}
                  </ul>
                </div>
                <div class="vitals-card">
                  <div class="section-title">Runbooks</div>
                  <ul class="ae-doclist">
                    {{ range .JSON.Array "runbooks" }}
                    <li><a href="{{ .String "url" }}" target="_blank" rel="noreferrer"><span class="ae-doc-title">{{ .String "title" }}</span></a></li>
                    {{ end }}
                  </ul>
                </div>
              </div>

      - size: small
        widgets:
          # Title + summary list; cover images hidden in user.css.
          - type: rss
            title: Writing about Aether
            style: vertical-list
            limit: 8
            collapse-after: 5
            cache: 1h
            feeds:
              - url: https://chetan-thapliyal.cloud/tags/homelab/index.xml
                title: Blog

          - type: bookmarks
            title: More
            groups:
              - links:
                  - title: Repository README
                    url: https://github.com/ChetanThapliyal/Project-Aether#readme
                    icon: si:github
                  - title: All homelab posts
                    url: https://chetan-thapliyal.cloud/tags/homelab/
                    icon: si:hugo
