                <a class="ae-adr" href="https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/022-app-data-storage-and-backups.md" target="_blank" rel="noreferrer"><span class="ae-adr-num">022</span><span class="ae-adr-title">App data</span><span class="ae-adr-sub">shared database, offsite nightly, drilled</span></a>
