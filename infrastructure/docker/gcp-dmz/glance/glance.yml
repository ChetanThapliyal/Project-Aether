                  <div class="gauge-item">
                    <div class="gauge-label">Fan RPM</div>
                    <div class="gauge-val">550</div>
                    <div class="gauge-sub">Level 1 Cooling</div>
                  </div>
                </div>

                <!-- Storage Capacity Rows (Matching Grafana Disk Gauges) -->
