              <!-- Pod Status Table (Matching Grafana Table in Screenshot) -->
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">🚀 Core Kubernetes Pod Status (K3s Control &amp; Data Plane)</span>
                  <span class="vitals-badge healthy">26/26 PODS RUNNING</span>
