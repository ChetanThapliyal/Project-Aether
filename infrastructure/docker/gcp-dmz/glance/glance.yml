  # ---------------------------------------------------------------------------
  # Page 3: Infrastructure
  # ---------------------------------------------------------------------------
  - name: Infrastructure
    columns:
      - size: full
        widgets:
          - type: html
            source: |
              <div style="padding: 12px;">
                <h3 style="margin: 0 0 12px 0;">🌐 Multi-Tier Topology & Resource Budget</h3>
                <table style="width: 100%; border-collapse: collapse; font-size: 0.88em; text-align: left;">
                  <thead>
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.2);">
                      <th style="padding: 6px 8px;">Environment</th>
                      <th style="padding: 6px 8px;">Location</th>
                      <th style="padding: 6px 8px;">Specs</th>
                      <th style="padding: 6px 8px;">Primary Role</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.08);">
                      <td style="padding: 6px 8px;"><strong>GCP DMZ</strong></td>
                      <td style="padding: 6px 8px;"><code>us-central1-a</code></td>
                      <td style="padding: 6px 8px;">2 vCPU / 1 GB RAM</td>
                      <td style="padding: 6px 8px;">External Synthetic Observer & Edge Gateway</td>
                    </tr>
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.08);">
                      <td style="padding: 6px 8px;"><strong>OCI Core</strong></td>
                      <td style="padding: 6px 8px;"><code>ap-mumbai-1</code></td>
                      <td style="padding: 6px 8px;">2 OCPU / 12 GB RAM</td>
                      <td style="padding: 6px 8px;">Observability TSDB, Log Store & Automation Engine</td>
                    </tr>
                    <tr>
                      <td style="padding: 6px 8px;"><strong>Homelab</strong></td>
                      <td style="padding: 6px 8px;">Local Proxmox</td>
                      <td style="padding: 6px 8px;">4 Cores / 12 GB RAM</td>
                      <td style="padding: 6px 8px;">3-Node K3s Cluster (control-01, worker-01, worker-02)</td>
                    </tr>
                  </tbody>
                </table>
              </div>

          - type: bookmarks
            groups:
              - title: Key Architecture Records
                links:
                  - title: "ADR-004: Network Access (Tailscale)"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/004-network-access.md
                  - title: "ADR-009: GitOps Controller (ArgoCD)"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/009-gitops-controller.md
                  - title: "ADR-013: Tailnet Microsegmentation"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/013-tailnet-microsegmentation.md
                  - title: "ADR-016: Kubernetes Storage Strategy"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/016-kubernetes-storage-strategy.md
                  - title: "ADR-019: Centralized Logging Architecture"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/019-centralized-logging-architecture.md

  # ---------------------------------------------------------------------------
  # Page 4: Feeds & Upstream
  # ---------------------------------------------------------------------------
  - name: Feeds & Upstream
    columns:
      - size: full
        widgets:
          - type: rss
            limit: 6
            feeds:
              - url: https://github.com/glanceapp/glance/releases.atom
                title: Glance Releases
              - url: https://github.com/k3s-io/k3s/releases.atom
                title: K3s Releases
              - url: https://github.com/argoproj/argo-cd/releases.atom
                title: ArgoCD Releases
              - url: https://github.com/envoyproxy/gateway/releases.atom
                title: Envoy Gateway Releases
