                <div class="bar-row">
                  <span class="bar-name">NVMe Root</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width: 37.5%;"></div>
                  </div>
                  <span class="bar-info">Free: 298 GB (37.5% used)</span>
                </div>

                <div class="bar-row">
                  <span class="bar-name">SSD Local-Path</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width: 15.2%;"></div>
                  </div>
                  <span class="bar-info">Free: 223 GB (15.2% used)</span>
                </div>

                <div class="bar-row">
                  <span class="bar-name">HDD ZFS Pool</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width: 38.7%;"></div>
                  </div>
