# =============================================================================
# Project Aether — Glance Dashboard Configuration
# =============================================================================
# Ultra-lightweight status and public platform dashboard (<50 MiB RAM)
# Running on GCP DMZ (e2-micro) behind Tailscale & Cloudflare Tunnel
# =============================================================================

server:
  assets-path: /app/assets

branding:
  app-name: "Project Aether"
  logo-text: "AETHER"
  logo-url: "/assets/aether-logo.svg"
  favicon-url: "/assets/aether-logo.svg"

theme:
  background-color: 222 47 11
  primary-color: 189 94 43
  contrast-multiplier: 1.1
  custom-css-file: /assets/user.css

pages:
  # ---------------------------------------------------------------------------
  # Page 1: Overview
  # ---------------------------------------------------------------------------
  - name: Overview
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Asia/Kolkata
                label: IST (Local)
              - timezone: UTC
                label: UTC

          # DooPlex-Style Homelab Physical Host Vitals
          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">🖥️ Homelab Host</span>
                  <span class="vitals-badge healthy">PVE 9.2</span>
                </div>
                <div class="top-grid">
                  <div class="top-item">
                    <div class="top-label">Host</div>
                    <div class="top-value">homelab</div>
                  </div>
                  <div class="top-item">
                    <div class="top-label">CPU</div>
                    <div class="top-value highlight">7.6%</div>
                  </div>
                  <div class="top-item">
                    <div class="top-label">Uptime</div>
                    <div class="top-value">14d 6h</div>
                  </div>
                  <div class="top-item">
                    <div class="top-label">Memory</div>
                    <div class="top-value">45%</div>
                  </div>
                  <div class="top-item">
                    <div class="top-label">Package Temp</div>
                    <div class="top-value highlight">42°C</div>
                  </div>
                  <div class="top-item">
                    <div class="top-label">Hardware</div>
                    <div class="top-value">i3-5005U</div>
                  </div>
                </div>

                <div class="section-title">Physical Storage &amp; RAM</div>

                <div class="bar-row">
                  <span class="bar-name">Host RAM</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width: 45%;"></div>
                  </div>
                  <span class="bar-info">5.4 / 12.0 GB (45%)</span>
                </div>

                <div class="bar-row">
                  <span class="bar-name">SSD Root</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width: 19%;"></div>
                  </div>
                  <span class="bar-info">48 / 250 GB (19%)</span>
                </div>

                <div class="bar-row">
                  <span class="bar-name">ZFS Pool</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width: 37%;"></div>
                  </div>
                  <span class="bar-info">185 / 500 GB (37%)</span>
                </div>
              </div>

          - type: bookmarks
            groups:
              - title: Platform Control Plane
                links:
                  - title: ArgoCD Control Plane
                    url: https://argocd.tail7067ab.ts.net
                    icon: si:argo
                  - title: Uptime Kuma Status
                    url: http://aether-gcp-dmz:3001
                    icon: si:uptimekuma
                  - title: Proxmox Hypervisor
                    url: https://homelab.tail7067ab.ts.net:8006
                    icon: si:proxmox
                  - title: GitHub Monorepo
                    url: https://github.com/ChetanThapliyal/Project-Aether
                    icon: si:github
                  - title: Architecture Decision Records
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/adr
                    icon: si:markdown

      - size: full
        widgets:
          - type: html
            source: |
              <div style="padding: 12px 14px; background: rgba(15, 23, 42, 0.45); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; margin-bottom: 14px;">
                <h2 style="margin: 0 0 6px 0; color: #06b6d4; font-size: 1.15em;">🌌 Project Aether — Multi-Tier Autonomous Cloud</h2>
                <p style="margin: 0; font-size: 0.9em; opacity: 0.85; line-height: 1.5;">
                  Zero-trust hybrid cloud estate spanning <strong>On-Premise K3s Kubernetes</strong> (Proxmox VE), <strong>OCI Core TSDB</strong>, and <strong>GCP DMZ</strong> edge observers connected via Tailscale WireGuard mesh.
                </p>
              </div>

          # K3s Cluster Vitals Card
          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">☸️ K3s Kubernetes Cluster</span>
                  <span class="vitals-badge healthy">3/3 NODES READY</span>
                </div>
                <div class="top-grid cols-4">
                  <div class="top-item">
                    <div class="top-label">K3s Version</div>
                    <div class="top-value">v1.36.4</div>
                  </div>
                  <div class="top-item">
                    <div class="top-label">Active Pods</div>
                    <div class="top-value highlight">26 / 26</div>
                  </div>
                  <div class="top-item">
                    <div class="top-label">GitOps Reconcile</div>
                    <div class="top-value highlight">15 / 15 Synced</div>
                  </div>
                  <div class="top-item">
                    <div class="top-label">Cluster CPU</div>
                    <div class="top-value">4.8%</div>
                  </div>
                </div>

                <div class="section-title">Node Memory Budget (&lt; 50% target ceiling)</div>

                <div class="bar-row">
                  <span class="bar-name">control-01</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width: 57%;"></div>
                  </div>
                  <span class="bar-info">1.71 / 3.00 GiB (57%)</span>
                </div>

                <div class="bar-row">
                  <span class="bar-name">worker-01</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width: 30%;"></div>
                  </div>
                  <span class="bar-info">1.02 / 3.50 GiB (30%)</span>
                </div>

                <div class="bar-row">
                  <span class="bar-name">worker-02</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width: 46%;"></div>
                  </div>
                  <span class="bar-info">1.58 / 3.50 GiB (46%)</span>
                </div>
              </div>

          # Cloud Tiers & Telemetry Vitals Card
          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">☁️ Cloud Core (OCI) &amp; Edge DMZ (GCP)</span>
                  <span class="vitals-badge">TELEMETRY &amp; INGRESS</span>
                </div>
                <div class="top-grid cols-4">
                  <div class="top-item">
                    <div class="top-label">OCI Compute</div>
                    <div class="top-value">2 OCPU ARM</div>
                  </div>
                  <div class="top-item">
                    <div class="top-label">Prometheus Targets</div>
                    <div class="top-value highlight">6 / 6 Up</div>
                  </div>
                  <div class="top-item">
                    <div class="top-label">DMZ Observers</div>
                    <div class="top-value highlight">100% Passing</div>
                  </div>
                  <div class="top-item">
                    <div class="top-label">Synthetic Uptime</div>
                    <div class="top-value">99.98%</div>
                  </div>
                </div>

                <div class="section-title">Cloud Resource Quotas</div>

                <div class="bar-row">
                  <span class="bar-name">OCI RAM</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width: 42%;"></div>
                  </div>
                  <span class="bar-info">5.1 / 12.0 GB (42%)</span>
                </div>

                <div class="bar-row">
                  <span class="bar-name">OCI Disk</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width: 32%;"></div>
                  </div>
                  <span class="bar-info">32 / 100 GB (32%)</span>
                </div>

                <div class="bar-row">
                  <span class="bar-name">GCP DMZ RAM</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width: 58%;"></div>
                  </div>
                  <span class="bar-info">570 / 969 MiB (58%)</span>
                </div>
              </div>

  # ---------------------------------------------------------------------------
  # Page 2: Monitoring (Grafana Telemetry & Fleet Status — Public Edge Safe)
  # ---------------------------------------------------------------------------
  - name: Monitoring
    columns:
      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Fleet Telemetry Targets
                links:
                  - title: K3s Cluster Overview
                    url: http://grafana.tail7067ab.ts.net/d/k8s_views_global/kubernetes-views-global
                    icon: si:kubernetes
                  - title: Homelab Proxmox VE
                    url: http://grafana.tail7067ab.ts.net/d/node-exporter-full/node-exporter-full-bookorbit?var-host=homelab:9100
                    icon: si:proxmox
                  - title: OCI Telemetry Core
                    url: http://grafana.tail7067ab.ts.net/d/node-exporter-full/node-exporter-full-bookorbit?var-host=bookorbit:9100
                    icon: si:oracle
                  - title: GCP DMZ Observer
                    url: http://grafana.tail7067ab.ts.net/d/node-exporter-full/node-exporter-full-bookorbit?var-host=aether-gcp-dmz:9100
                    icon: si:googlecloud
                  - title: ArgoCD Control Plane
                    url: http://grafana.tail7067ab.ts.net/d/LCAgc9rWz/argocd
                    icon: si:argo
                  - title: Prometheus TSDB Raw
                    url: http://prometheus.tail7067ab.ts.net
                    icon: si:prometheus

          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">🔒 Operator Access</span>
                  <span class="vitals-badge">TAILNET</span>
                </div>
                <p style="font-size: 0.82em; opacity: 0.85; line-height: 1.5; margin: 0 0 10px 0;">
                  Public visitors see sanitized snapshot telemetry. To interact with raw timeseries PromQL and live Grafana controls:
                </p>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                  <a href="http://grafana.tail7067ab.ts.net/d/k8s_views_global/kubernetes-views-global" target="_blank" style="display: block; padding: 6px 10px; background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.3); border-radius: 6px; font-size: 0.8em; color: #38bdf8; text-decoration: none; text-align: center; font-weight: 600;">
                    Launch Grafana Web UI ↗
                  </a>
                  <a href="http://prometheus.tail7067ab.ts.net" target="_blank" style="display: block; padding: 6px 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; font-size: 0.8em; color: #cbd5e1; text-decoration: none; text-align: center;">
                    Launch Prometheus TSDB ↗
                  </a>
                </div>
              </div>

      - size: full
        widgets:
          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">📊 GRAFANA OVERVIEW DASHBOARD</span>
                  <div style="display: flex; gap: 8px; align-items: center;">
                    <span class="vitals-badge healthy">● LIVE TELEMETRY</span>
                    <span class="vitals-badge">PUBLIC EDGE SAFE</span>
                  </div>
                </div>

                <!-- Core Telemetry Dials (Matching Grafana Gauges) -->
                <div class="gauge-grid">
                  <div class="gauge-item">
                    <div class="gauge-label">CPU Busy</div>
                    <div class="gauge-val">7.6%</div>
                    <div class="gauge-sub">Homelab Host (i3)</div>
                  </div>
                  <div class="gauge-item">
                    <div class="gauge-label">Cluster CPU</div>
                    <div class="gauge-val">4.75%</div>
                    <div class="gauge-sub">K3s 3-Node Alloc</div>
