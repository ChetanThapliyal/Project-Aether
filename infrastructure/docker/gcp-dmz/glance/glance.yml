# =============================================================================
# Project Aether — Glance Dashboard Configuration
# =============================================================================
# Ultra-lightweight status and public platform dashboard (<50 MiB RAM)
# Running on GCP DMZ (e2-micro). Public through the Cloudflare Tunnel (FND-10).
#
# PUBLIC PAGE RULES (HARD-17, ADR-020):
#   - No tailnet hostnames or links (*.ts.net, MagicDNS short names), no LAN or
#     cluster IPs. Operator consoles are named, never linked.
#   - No numbers presented as live. Static facts carry the date they were true.
#     Live vitals arrive only through the ADR-020 summary feed.
# =============================================================================

server:
  assets-path: /app/assets

branding:
  app-name: "Project Aether"
  logo-text: "Aether"                 # styled in user.css (brand gradient)
  favicon-url: "/assets/favicon.svg"   # rose "A" on stone, same style as the portfolio's "C" icon

# FND-19: portfolio brand (blowfish-ct-folio/docs/brand). HSL of stone #1C1917,
# orange #EA580C and rose #E11D48; user.css maps the rest onto brand tokens.
theme:
  background-color: 24 10 10
  primary-color: 21 90 48
  negative-color: 347 77 50
  contrast-multiplier: 1.0
  disable-picker: true                # visitors always see the brand theme
  custom-css-file: /assets/user.css

pages:
  # ---------------------------------------------------------------------------
  # Page 1: Overview
  # ---------------------------------------------------------------------------
  - name: Overview
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Asia/Kolkata
                label: IST (Local)
              - timezone: UTC
                label: UTC

          - type: bookmarks
            title: Evidence
            groups:
              - title: In the repository
                links:
                  - title: GitHub monorepo
                    url: https://github.com/ChetanThapliyal/Project-Aether
                    icon: si:github
                  - title: Architecture decisions (20 ADRs)
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/adr
                    icon: si:markdown
                  - title: Incident reviews
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/incidents
                    icon: si:markdown
                  - title: Disaster recovery scenarios
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/disaster-recovery
                    icon: si:markdown
                  - title: Runbooks
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/runbooks
                    icon: si:markdown

          - type: monitor
            title: Public sites
            cache: 1m
            sites:
              - title: Portfolio and blog
                url: https://chetan-thapliyal.cloud/
                icon: si:hugo
              - title: Lexicon notes
                url: https://base.chetan-thapliyal.cloud/
                icon: si:astro
              - title: This status page
                url: https://status.chetan-thapliyal.cloud/
                icon: si:cloudflare

      - size: full
        widgets:
          # FND-20: live numbers from the sanitised feed on OCI (ADR-020). Numbers and
          # plain strings only; Glance escapes them, and this template draws everything.
          - type: custom-api
            title: Live status
            frameless: true
            hide-header: true
            url: https://public-feed.tail7067ab.ts.net/summary.json
            cache: 2m
            template: |
              <div class="ae-live-head">
                <span class="ae-live-title">Live status</span>
                {{ if .JSON.Bool "fresh" }}
                <span class="vitals-badge ae-live">LIVE · UPDATED <span {{ .JSON.String "generated_at" | parseTime "RFC3339" | toRelativeTime }}></span> AGO</span>
                {{ else }}
                <span class="vitals-badge ae-stale">DATA DELAYED SINCE <span {{ .JSON.String "generated_at" | parseTime "RFC3339" | toRelativeTime }}></span></span>
                {{ end }}
              </div>
              <div class="ae-hero">
                <div class="ae-stat"><div class="ae-stat-label">Nodes ready</div><div class="ae-stat-num {{ if eq (.JSON.Int "cluster.nodes_ready") (.JSON.Int "cluster.nodes_total") }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "cluster.nodes_ready" }}<span>/{{ .JSON.Int "cluster.nodes_total" }}</span></div><div class="ae-stat-sub">K3s cluster on Proxmox</div></div>
                <div class="ae-stat"><div class="ae-stat-label">GitOps apps healthy</div><div class="ae-stat-num {{ if eq (.JSON.Int "cluster.apps_ok") (.JSON.Int "cluster.apps_total") }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "cluster.apps_ok" }}<span>/{{ .JSON.Int "cluster.apps_total" }}</span></div><div class="ae-stat-sub">synced and healthy in ArgoCD</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Pods running</div><div class="ae-stat-num">{{ .JSON.Int "cluster.pods_running" }}<span>/{{ .JSON.Int "cluster.pods_total" }}</span></div><div class="ae-stat-sub">across all namespaces</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Alerts firing</div><div class="ae-stat-num {{ if eq (.JSON.Int "monitoring.alerts_firing") 0 }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "monitoring.alerts_firing" }}</div><div class="ae-stat-sub">excluding the watchdog heartbeat</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Scrape targets up</div><div class="ae-stat-num">{{ .JSON.Int "monitoring.targets_up" }}<span>/{{ .JSON.Int "monitoring.targets_total" }}</span></div><div class="ae-stat-sub">Prometheus on Oracle Cloud</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Kubernetes</div><div class="ae-stat-num">{{ .JSON.String "cluster.k3s_version" }}</div><div class="ae-stat-sub">K3s, upgraded via Ansible</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Host CPU temp</div><div class="ae-stat-num">{{ .JSON.Float "host.temp_c" | toInt }}<span>°C</span></div><div class="ae-stat-sub">the 2015 laptop under it all</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Host uptime</div><div class="ae-stat-num">{{ .JSON.Float "host.uptime_days" }}<span>days</span></div><div class="ae-stat-sub">since the last reboot</div></div>
              </div>
              <div class="vitals-card">
                <div class="section-title">Capacity</div>
                <div class="ae-gauges">
                  {{ range .JSON.Array "gauges" }}
                  <div class="ae-gauge">
                    <svg viewBox="0 0 64 64" role="img" aria-label="{{ .String "label" }} {{ .Float "pct" }} percent">
                      <circle class="ae-gauge-track" cx="32" cy="32" r="26"></circle>
                      <circle class="ae-gauge-fill ae-{{ .String "level" }}" cx="32" cy="32" r="26" stroke-dasharray="{{ .Float "dash" }} {{ .Float "gap" }}" transform="rotate(-90 32 32)"></circle>
                      <text x="32" y="37" text-anchor="middle" class="ae-gauge-val">{{ .Float "pct" | toInt }}%</text>
                    </svg>
                    <div class="ae-gauge-label">{{ .String "label" }}</div>
                    <div class="ae-gauge-group">{{ .String "group" }}</div>
                  </div>
                  {{ end }}
                </div>
              </div>

          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">Project <span class="ae-grad">Aether</span></span>
                  <span class="vitals-badge">HYBRID CLOUD HOMELAB</span>
                </div>
                <p class="ae-note">A three-node Kubernetes cluster on a Proxmox host at home, a monitoring and automation core on Oracle Cloud, and this edge observer on Google Cloud, joined by a WireGuard mesh. Everything is declared in one Git repository: Terraform for machines, Ansible for hosts, ArgoCD for the cluster, SOPS for secrets.</p>
              </div>

          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">Architecture at a glance</span>
                  <span class="vitals-badge">DESIGN FACTS · 12 NOV 2026</span>
                </div>
                <div class="top-grid cols-4">
                  <div class="top-item"><div class="top-label">Cluster</div><div class="top-value">K3s · 3 nodes</div></div>
                  <div class="top-item"><div class="top-label">GitOps apps</div><div class="top-value">17 in ArgoCD</div></div>
                  <div class="top-item"><div class="top-label">Clouds</div><div class="top-value">Home · OCI · GCP</div></div>
                  <div class="top-item"><div class="top-label">Monthly cost</div><div class="top-value">₹0 cloud</div></div>
                </div>
                <div class="section-title">How it is built</div>
                <div class="bar-row"><span class="bar-name">Delivery</span><span class="ae-fact">ArgoCD app-of-apps tracking <code>main</code>; Helm charts pinned; values linted in CI</span></div>
                <div class="bar-row"><span class="bar-name">Edge</span><span class="ae-fact">Envoy Gateway on a MetalLB address, internal PKI from cert-manager</span></div>
                <div class="bar-row"><span class="bar-name">Security</span><span class="ae-fact">Tailnet roles with policy tests, default-deny NetworkPolicies, Secrets encrypted at rest, no public SSH</span></div>
                <div class="bar-row"><span class="bar-name">Observability</span><span class="ae-fact">Prometheus, Loki (Grafana Alloy agents) and Alertmanager to Telegram, plus a dead-man's switch</span></div>
                <div class="bar-row"><span class="bar-name">Recovery</span><span class="ae-fact">Nightly etcd snapshots to ZFS, restic, then an Object-Locked offsite bucket; cold restore drilled</span></div>
              </div>

  # ---------------------------------------------------------------------------
  # Page 2: Observability (FND-20 feed + DMZ Kuma; big-number style, no links in)
  # ---------------------------------------------------------------------------
  - name: Observability
    columns:
      - size: full
        widgets:
          - type: custom-api
            title: Trends
            frameless: true
            hide-header: true
            url: https://public-feed.tail7067ab.ts.net/summary.json
            cache: 2m
            template: |
              <div class="ae-live-head">
                <span class="ae-live-title">Observability</span>
                {{ if .JSON.Bool "fresh" }}
                <span class="vitals-badge ae-live">LIVE · UPDATED <span {{ .JSON.String "generated_at" | parseTime "RFC3339" | toRelativeTime }}></span> AGO</span>
                {{ else }}
                <span class="vitals-badge ae-stale">DATA DELAYED SINCE <span {{ .JSON.String "generated_at" | parseTime "RFC3339" | toRelativeTime }}></span></span>
                {{ end }}
              </div>
              <div class="ae-hero">
                <div class="ae-stat"><div class="ae-stat-label">Scrape targets up</div><div class="ae-stat-num {{ if eq (.JSON.Int "monitoring.targets_up") (.JSON.Int "monitoring.targets_total") }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "monitoring.targets_up" }}<span>/{{ .JSON.Int "monitoring.targets_total" }}</span></div><div class="ae-stat-sub">nodes, cluster state, ArgoCD, hypervisor</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Alerts firing</div><div class="ae-stat-num {{ if eq (.JSON.Int "monitoring.alerts_firing") 0 }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "monitoring.alerts_firing" }}</div><div class="ae-stat-sub">Alertmanager to Telegram</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Cluster CPU</div><div class="ae-stat-num">{{ .JSON.Float "charts.cluster_cpu.last" | toInt }}<span>%</span></div><div class="ae-stat-sub">3 nodes, 5-minute average</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Cluster memory</div><div class="ae-stat-num">{{ .JSON.Float "charts.cluster_mem.last" | toInt }}<span>%</span></div><div class="ae-stat-sub">3 nodes, used of total</div></div>
              </div>
              <div class="vitals-card">
                <div class="section-title">Last 6 hours · 5-minute steps</div>
                <div class="ae-charts">
                  <div class="ae-chart">
                    <div class="ae-chart-head"><div><div class="ae-stat-label">Cluster CPU</div><div class="ae-chart-big">{{ .JSON.Float "charts.cluster_cpu.last" }}<span>{{ .JSON.String "charts.cluster_cpu.unit" }}</span></div></div><div class="ae-chart-range">6 h range<br>{{ .JSON.Float "charts.cluster_cpu.min" }}–{{ .JSON.Float "charts.cluster_cpu.max" }}{{ .JSON.String "charts.cluster_cpu.unit" }}</div></div>
                    <svg viewBox="0 0 300 80" preserveAspectRatio="none" role="img" aria-label="Cluster CPU, last 6 hours">
                      <line class="ae-grid" x1="0" y1="6" x2="300" y2="6"></line>
                      <line class="ae-grid" x1="0" y1="40" x2="300" y2="40"></line>
                      <line class="ae-grid" x1="0" y1="74" x2="300" y2="74"></line>
                      <polygon class="ae-area" points="{{ .JSON.String "charts.cluster_cpu.area" }}"></polygon>
                      <polyline class="ae-line" points="{{ .JSON.String "charts.cluster_cpu.line" }}"></polyline>
                    </svg>
                    <div class="ae-chart-foot"><span>6 h ago</span><span>scale 0–100%</span><span>now</span></div>
                  </div>
                  <div class="ae-chart">
                    <div class="ae-chart-head"><div><div class="ae-stat-label">Cluster memory</div><div class="ae-chart-big">{{ .JSON.Float "charts.cluster_mem.last" }}<span>{{ .JSON.String "charts.cluster_mem.unit" }}</span></div></div><div class="ae-chart-range">6 h range<br>{{ .JSON.Float "charts.cluster_mem.min" }}–{{ .JSON.Float "charts.cluster_mem.max" }}{{ .JSON.String "charts.cluster_mem.unit" }}</div></div>
                    <svg viewBox="0 0 300 80" preserveAspectRatio="none" role="img" aria-label="Cluster memory, last 6 hours">
                      <line class="ae-grid" x1="0" y1="6" x2="300" y2="6"></line>
                      <line class="ae-grid" x1="0" y1="40" x2="300" y2="40"></line>
                      <line class="ae-grid" x1="0" y1="74" x2="300" y2="74"></line>
                      <polygon class="ae-area" points="{{ .JSON.String "charts.cluster_mem.area" }}"></polygon>
                      <polyline class="ae-line" points="{{ .JSON.String "charts.cluster_mem.line" }}"></polyline>
                    </svg>
                    <div class="ae-chart-foot"><span>6 h ago</span><span>scale 0–100%</span><span>now</span></div>
                  </div>
                  <div class="ae-chart">
                    <div class="ae-chart-head"><div><div class="ae-stat-label">Cloud host CPU</div><div class="ae-chart-big">{{ .JSON.Float "charts.oci_cpu.last" }}<span>{{ .JSON.String "charts.oci_cpu.unit" }}</span></div></div><div class="ae-chart-range">6 h range<br>{{ .JSON.Float "charts.oci_cpu.min" }}–{{ .JSON.Float "charts.oci_cpu.max" }}{{ .JSON.String "charts.oci_cpu.unit" }}</div></div>
                    <svg viewBox="0 0 300 80" preserveAspectRatio="none" role="img" aria-label="Cloud host CPU, last 6 hours">
                      <line class="ae-grid" x1="0" y1="6" x2="300" y2="6"></line>
                      <line class="ae-grid" x1="0" y1="40" x2="300" y2="40"></line>
                      <line class="ae-grid" x1="0" y1="74" x2="300" y2="74"></line>
                      <polygon class="ae-area" points="{{ .JSON.String "charts.oci_cpu.area" }}"></polygon>
                      <polyline class="ae-line" points="{{ .JSON.String "charts.oci_cpu.line" }}"></polyline>
                    </svg>
                    <div class="ae-chart-foot"><span>6 h ago</span><span>scale 0–100%</span><span>now</span></div>
                  </div>
                  <div class="ae-chart">
                    <div class="ae-chart-head"><div><div class="ae-stat-label">Hypervisor CPU temperature</div><div class="ae-chart-big">{{ .JSON.Float "charts.hyp_temp.last" }}<span>{{ .JSON.String "charts.hyp_temp.unit" }}</span></div></div><div class="ae-chart-range">6 h range<br>{{ .JSON.Float "charts.hyp_temp.min" }}–{{ .JSON.Float "charts.hyp_temp.max" }}{{ .JSON.String "charts.hyp_temp.unit" }}</div></div>
                    <svg viewBox="0 0 300 80" preserveAspectRatio="none" role="img" aria-label="Hypervisor CPU temperature, last 6 hours">
                      <line class="ae-grid" x1="0" y1="6" x2="300" y2="6"></line>
                      <line class="ae-grid" x1="0" y1="40" x2="300" y2="40"></line>
                      <line class="ae-grid" x1="0" y1="74" x2="300" y2="74"></line>
                      <polygon class="ae-area" points="{{ .JSON.String "charts.hyp_temp.area" }}"></polygon>
                      <polyline class="ae-line" points="{{ .JSON.String "charts.hyp_temp.line" }}"></polyline>
                    </svg>
                    <div class="ae-chart-foot"><span>6 h ago</span><span>scale 20–100 °C</span><span>now</span></div>
                  </div>
                </div>
              </div>

          # Backup and alerting heartbeats from the DMZ's own Uptime Kuma (a
          # public-safe status page, read over the local Docker network).
          - type: custom-api
            title: Backups and alerting
            frameless: true
            hide-header: true
            url: http://uptime-kuma:3001/api/status-page/public
            cache: 2m
            template: |
              {{ $hb := newRequest "http://uptime-kuma:3001/api/status-page/heartbeat/public" | getResponse }}
              {{ $total := 0.0 }}{{ $ok := 0.0 }}
              {{ range .JSON.Array "publicGroupList.0.monitorList" }}{{ $total = add $total 1.0 }}{{ if eq ($hb.JSON.Int (printf "heartbeatList.%d.@reverse.0.status" (.Int "id"))) 1 }}{{ $ok = add $ok 1.0 }}{{ end }}{{ end }}
              <div class="vitals-card">
                <div class="ae-backups-head">
                  <div>
                    <div class="ae-stat-label">Backups and alerting</div>
                    <div class="ae-stat-num {{ if eq $ok $total }}ae-ok{{ else }}ae-bad{{ end }}">{{ $ok | toInt }}<span>/{{ $total | toInt }}</span></div>
                    <div class="ae-stat-sub">checks passing, watched from outside the private network</div>
                  </div>
                  <span class="vitals-badge">UPTIME KUMA</span>
                </div>
                <ul class="ae-status">
                  {{ range .JSON.Array "publicGroupList.0.monitorList" }}
                  {{ $id := .Int "id" }}
                  {{ $st := $hb.JSON.Int (printf "heartbeatList.%d.@reverse.0.status" $id) }}
                  {{ $tm := $hb.JSON.String (printf "heartbeatList.%d.@reverse.0.time" $id) }}
                  <li>
                    <span class="ae-dot {{ if eq $st 1 }}ae-ok{{ else if eq $st 2 }}ae-warn{{ else }}ae-bad{{ end }}"></span>
                    <span class="ae-status-name">{{ .String "name" }}</span>
                    <span class="ae-status-meta">{{ if $tm }}last <span {{ $tm | parseTime "2006-01-02 15:04:05.000" | toRelativeTime }}></span> ago · {{ end }}<b>{{ $hb.JSON.Float (printf "uptimeList.%d_24" $id) | mul 100 | toInt }}%</b> 24 h</span>
                  </li>
                  {{ end }}
                </ul>
              </div>

          - type: html
            source: |
              <div class="vitals-card ae-gap-top">
                <div class="vitals-header">
                  <span class="vitals-title">How the estate is watched</span>
                  <span class="vitals-badge">DESIGN</span>
                </div>
                <div class="bar-row"><span class="bar-name">Metrics</span><span class="ae-fact">Prometheus on Oracle Cloud scrapes the cluster nodes, kube-state-metrics, ArgoCD and the Proxmox host over the tailnet</span></div>
                <div class="bar-row"><span class="bar-name">Logs</span><span class="ae-fact">Grafana Alloy on every node ships pod logs to Loki; an alert fires if any node goes quiet for 30 minutes</span></div>
                <div class="bar-row"><span class="bar-name">Alerts</span><span class="ae-fact">Alertmanager to Telegram, with a watchdog heartbeat to this host so a dead alert path is itself noticed</span></div>
                <div class="bar-row"><span class="bar-name">Outside-in</span><span class="ae-fact">Uptime Kuma here probes the public services and receives push heartbeats from every backup stage</span></div>
                <div class="bar-row"><span class="bar-name">Reviews</span><span class="ae-fact">Every real failure gets a written incident review with root cause and guardrails</span></div>
              </div>

      - size: small
        widgets:
          # What the cluster is running (image and tag only).
          - type: custom-api
            title: Running versions
            frameless: true
            hide-header: true
            url: https://public-feed.tail7067ab.ts.net/summary.json
            cache: 5m
            template: |
              <div class="vitals-card">
                <div class="ae-stat-label">Running versions</div>
                <div class="ae-stat-num">{{ len (.JSON.Array "versions") }}<span>images</span></div>
                <div class="ae-stat-sub">in the cluster right now, by tag</div>
                <ul class="ae-versions">
                  {{ range .JSON.Array "versions" }}
                  <li><code>{{ .String "image" }}</code><span>{{ .String "tag" }}</span></li>
                  {{ end }}
                </ul>
              </div>

          - type: bookmarks
            title: Further reading
            groups:
              - title: Decisions and reviews
                links:
                  - title: "ADR-019: Centralized logging"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/019-centralized-logging-architecture.md
                  - title: "ADR-020: Public observability (this page)"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/020-public-observability-data-diode.md
                  - title: Incident reviews
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/incidents

  # ---------------------------------------------------------------------------
  # Page 3: Infrastructure (FND-19 follow-up): big numbers + live usage bars
  # from the FND-20 feed, environment cards, ADR tiles.
  # ---------------------------------------------------------------------------
  - name: Infrastructure
    columns:
      - size: full
        widgets:
          - type: custom-api
            title: Where it runs
            frameless: true
            hide-header: true
            url: https://public-feed.tail7067ab.ts.net/summary.json
            cache: 2m
            template: |
              <div class="ae-hero">
                <div class="ae-stat"><div class="ae-stat-label">Environments</div><div class="ae-stat-num">3</div><div class="ae-stat-sub">home lab, Oracle Cloud, Google Cloud</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Memory in the estate</div><div class="ae-stat-num">25<span>GB</span></div><div class="ae-stat-sub">12 home · 12 Oracle · 1 Google</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Cloud bill</div><div class="ae-stat-num">₹0<span>/mo</span></div><div class="ae-stat-sub">always-free tiers on both clouds</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Apps under GitOps</div><div class="ae-stat-num">{{ .JSON.Int "cluster.apps_total" }}</div><div class="ae-stat-sub">{{ .JSON.Int "cluster.apps_ok" }} synced and healthy right now</div></div>
              </div>

              <div class="ae-envs">
                <div class="vitals-card ae-env">
                  <div class="ae-env-head">
                    <div><div class="ae-env-kicker">On premises</div><div class="ae-env-name">Home lab</div></div>
                    <span class="vitals-badge">PROXMOX VE</span>
                  </div>
                  <p class="ae-note">A 2015 laptop running a three-node K3s cluster as VMs: one control plane, two workers. Backups land on a ZFS pool on a second disk.</p>
                  <div class="ae-chips"><span>2 cores · 4 threads</span><span>12 GB RAM</span><span>SSD + 500 GB HDD</span></div>
                  <div class="section-title">Live usage</div>
                      <div class="ae-bar-row">
                        <div class="ae-bar-label"><span>Host memory</span><small>VMs and hypervisor</small></div>
                        <svg class="ae-bar" viewBox="0 0 100 10" preserveAspectRatio="none" role="img" aria-label="Host memory {{ .JSON.Float "gauges.2.pct" | toInt }} percent"><rect class="ae-bar-track" width="100" height="10" rx="5"></rect><rect class="ae-bar-fill ae-{{ .JSON.String "gauges.2.level" }}" width="{{ .JSON.Float "gauges.2.pct" }}" height="10" rx="5"></rect></svg>
                        <div class="ae-bar-pct">{{ .JSON.Float "gauges.2.pct" | toInt }}%</div>
                      </div>
                      <div class="ae-bar-row">
                        <div class="ae-bar-label"><span>Host disk</span><small>system SSD</small></div>
                        <svg class="ae-bar" viewBox="0 0 100 10" preserveAspectRatio="none" role="img" aria-label="Host disk {{ .JSON.Float "gauges.3.pct" | toInt }} percent"><rect class="ae-bar-track" width="100" height="10" rx="5"></rect><rect class="ae-bar-fill ae-{{ .JSON.String "gauges.3.level" }}" width="{{ .JSON.Float "gauges.3.pct" }}" height="10" rx="5"></rect></svg>
                        <div class="ae-bar-pct">{{ .JSON.Float "gauges.3.pct" | toInt }}%</div>
                      </div>
