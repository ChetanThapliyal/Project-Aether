# =============================================================================
# Project Aether — Glance Dashboard Configuration
# =============================================================================
# Ultra-lightweight status and public platform dashboard (<50 MiB RAM)
# Running on GCP DMZ (e2-micro). Public through the Cloudflare Tunnel (FND-10).
#
# PUBLIC PAGE RULES (HARD-17, ADR-020):
#   - No tailnet hostnames or links (*.ts.net, MagicDNS short names), no LAN or
#     cluster IPs. Operator consoles are named, never linked.
#   - No numbers presented as live. Static facts carry the date they were true.
#     Live vitals arrive only through the ADR-020 summary feed.
# =============================================================================

server:
  assets-path: /app/assets

branding:
  app-name: "Project Aether"
  logo-text: "Aether"                 # styled in user.css (brand gradient)
  favicon-url: "/assets/favicon.svg"   # rose "A" on stone, same style as the portfolio's "C" icon

# FND-19: portfolio brand (blowfish-ct-folio/docs/brand). HSL of stone #1C1917,
# orange #EA580C and rose #E11D48; user.css maps the rest onto brand tokens.
theme:
  background-color: 24 10 10
  primary-color: 21 90 48
  negative-color: 347 77 50
  contrast-multiplier: 1.0
  disable-picker: true                # visitors always see the brand theme
  custom-css-file: /assets/user.css

pages:
  # ---------------------------------------------------------------------------
  # Page 1: Overview
  # ---------------------------------------------------------------------------
  - name: Overview
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Asia/Kolkata
                label: IST (Local)
              - timezone: UTC
                label: UTC

          - type: monitor
            title: Public sites
            cache: 1m
            sites:
              - title: Portfolio and blog
                url: https://chetan-thapliyal.cloud/
                icon: si:hugo
              - title: Lexicon notes
                url: https://base.chetan-thapliyal.cloud/
                icon: si:astro
              - title: This status page
                url: https://status.chetan-thapliyal.cloud/
                icon: si:cloudflare

          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">Operator consoles</span>
                  <span class="vitals-badge">PRIVATE</span>
                </div>
                <p class="ae-note">Grafana, Prometheus, ArgoCD, Proxmox and the Uptime Kuma admin are reachable only over the private Tailscale network, behind tested access rules. This page doesn't link into it.</p>
              </div>

      - size: full
        widgets:
          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">Project <span class="ae-grad">Aether</span></span>
                  <span class="vitals-badge">HYBRID CLOUD HOMELAB</span>
                </div>
                <p class="ae-note">A three-node Kubernetes cluster on a Proxmox host at home, a monitoring and automation core on Oracle Cloud, and this edge observer on Google Cloud, joined by a WireGuard mesh. Everything is declared in one Git repository: Terraform for machines, Ansible for hosts, ArgoCD for the cluster, SOPS for secrets.</p>
              </div>

          - type: bookmarks
            title: Evidence
            groups:
              - title: In the repository
                links:
                  - title: GitHub monorepo
                    url: https://github.com/ChetanThapliyal/Project-Aether
                    icon: si:github
                  - title: Architecture decisions (20 ADRs)
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/adr
                    icon: si:markdown
                  - title: Incident reviews
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/incidents
                    icon: si:markdown
                  - title: Disaster recovery scenarios
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/disaster-recovery
                    icon: si:markdown
                  - title: Runbooks
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/runbooks
                    icon: si:markdown
              - title: Elsewhere
                links:
                  - title: Portfolio and blog
                    url: https://chetan-thapliyal.cloud/
                    icon: si:hugo
                  - title: Lexicon knowledge base
                    url: https://base.chetan-thapliyal.cloud/
                    icon: si:astro
                  - title: Public status page
                    url: https://status.chetan-thapliyal.cloud/
                    icon: si:cloudflare

          - type: custom-api
            title: Live status
            frameless: true
            hide-header: true
            url: https://public-feed.tail7067ab.ts.net/summary.json
            cache: 2m
            template: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">Live status</span>
                  {{ if .JSON.Bool "fresh" }}
                  <span class="vitals-badge ae-live">LIVE · UPDATED <span {{ .JSON.String "generated_at" | parseTime "RFC3339" | toRelativeTime }}></span> AGO</span>
                  {{ else }}
                  <span class="vitals-badge ae-stale">DATA DELAYED SINCE <span {{ .JSON.String "generated_at" | parseTime "RFC3339" | toRelativeTime }}></span></span>
                  {{ end }}
                </div>
                <div class="top-grid">
                  <div class="top-item"><div class="top-label">Nodes ready</div><div class="top-value {{ if eq (.JSON.Int "cluster.nodes_ready") (.JSON.Int "cluster.nodes_total") }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "cluster.nodes_ready" }} / {{ .JSON.Int "cluster.nodes_total" }}</div></div>
                  <div class="top-item"><div class="top-label">GitOps apps healthy</div><div class="top-value {{ if eq (.JSON.Int "cluster.apps_ok") (.JSON.Int "cluster.apps_total") }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "cluster.apps_ok" }} / {{ .JSON.Int "cluster.apps_total" }}</div></div>
                  <div class="top-item"><div class="top-label">Pods running</div><div class="top-value">{{ .JSON.Int "cluster.pods_running" }} / {{ .JSON.Int "cluster.pods_total" }}</div></div>
                  <div class="top-item"><div class="top-label">Alerts firing</div><div class="top-value {{ if eq (.JSON.Int "monitoring.alerts_firing") 0 }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "monitoring.alerts_firing" }}</div></div>
                  <div class="top-item"><div class="top-label">Scrape targets up</div><div class="top-value">{{ .JSON.Int "monitoring.targets_up" }} / {{ .JSON.Int "monitoring.targets_total" }}</div></div>
                  <div class="top-item"><div class="top-label">Kubernetes</div><div class="top-value">K3s {{ .JSON.String "cluster.k3s_version" }}</div></div>
                  <div class="top-item"><div class="top-label">Host CPU temp</div><div class="top-value">{{ .JSON.Float "host.temp_c" }} °C</div></div>
                  <div class="top-item"><div class="top-label">Host uptime</div><div class="top-value">{{ .JSON.Float "host.uptime_days" }} days</div></div>
                </div>
                <div class="section-title">Capacity</div>
                <div class="ae-gauges">
                  {{ range .JSON.Array "gauges" }}
                  <div class="ae-gauge">
                    <svg viewBox="0 0 64 64" role="img" aria-label="{{ .String "label" }} {{ .Float "pct" }} percent">
                      <circle class="ae-gauge-track" cx="32" cy="32" r="26"></circle>
                      <circle class="ae-gauge-fill ae-{{ .String "level" }}" cx="32" cy="32" r="26" stroke-dasharray="{{ .Float "dash" }} {{ .Float "gap" }}" transform="rotate(-90 32 32)"></circle>
                      <text x="32" y="36" text-anchor="middle" class="ae-gauge-val">{{ .Float "pct" | toInt }}%</text>
                    </svg>
                    <div class="ae-gauge-label">{{ .String "label" }}</div>
                    <div class="ae-gauge-group">{{ .String "group" }}</div>
                  </div>
                  {{ end }}
                </div>
              </div>

          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">Architecture at a glance</span>
                  <span class="vitals-badge">DESIGN FACTS · 12 NOV 2026</span>
                </div>
                <div class="top-grid cols-4">
                  <div class="top-item"><div class="top-label">Cluster</div><div class="top-value">K3s · 3 nodes</div></div>
                  <div class="top-item"><div class="top-label">GitOps apps</div><div class="top-value">17 in ArgoCD</div></div>
                  <div class="top-item"><div class="top-label">Clouds</div><div class="top-value">Home · OCI · GCP</div></div>
                  <div class="top-item"><div class="top-label">Monthly cost</div><div class="top-value">₹0 cloud</div></div>
                </div>
                <div class="section-title">How it is built</div>
                <div class="bar-row"><span class="bar-name">Delivery</span><span class="ae-fact">ArgoCD app-of-apps tracking <code>main</code>; Helm charts pinned; values linted in CI</span></div>
                <div class="bar-row"><span class="bar-name">Edge</span><span class="ae-fact">Envoy Gateway on a MetalLB address, internal PKI from cert-manager</span></div>
                <div class="bar-row"><span class="bar-name">Security</span><span class="ae-fact">Tailnet roles with policy tests, default-deny NetworkPolicies, Secrets encrypted at rest, no public SSH</span></div>
                <div class="bar-row"><span class="bar-name">Observability</span><span class="ae-fact">Prometheus, Loki (Grafana Alloy agents) and Alertmanager to Telegram, plus a dead-man's switch</span></div>
                <div class="bar-row"><span class="bar-name">Recovery</span><span class="ae-fact">Nightly etcd snapshots to ZFS, restic, then an Object-Locked offsite bucket; cold restore drilled</span></div>
              </div>

  # ---------------------------------------------------------------------------
  # Page 2: Observability (live trends from the FND-20 feed; no links in)
  # ---------------------------------------------------------------------------
  - name: Observability
    columns:
      - size: full
        widgets:
          # FND-20: 6-hour trends, drawn here from the feed's pre-scaled points.
          - type: custom-api
            title: Trends
            frameless: true
            hide-header: true
            url: https://public-feed.tail7067ab.ts.net/summary.json
            cache: 2m
            template: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">Last 6 hours</span>
                  {{ if .JSON.Bool "fresh" }}<span class="vitals-badge ae-live">5-MIN STEPS</span>{{ else }}<span class="vitals-badge ae-stale">DATA DELAYED</span>{{ end }}
                </div>
                <div class="ae-charts">
                <div class="ae-chart">
                  <div class="ae-chart-head"><span class="ae-chart-title">Cluster CPU</span><span class="ae-chart-now">{{ .JSON.Float "charts.cluster_cpu.last" }}{{ .JSON.String "charts.cluster_cpu.unit" }}</span></div>
                  <svg viewBox="0 0 300 80" preserveAspectRatio="none" role="img" aria-label="Cluster CPU, last 6 hours">
                    <line class="ae-grid" x1="0" y1="6" x2="300" y2="6"></line>
                    <line class="ae-grid" x1="0" y1="40" x2="300" y2="40"></line>
                    <line class="ae-grid" x1="0" y1="74" x2="300" y2="74"></line>
                    <polygon class="ae-area" points="{{ .JSON.String "charts.cluster_cpu.area" }}"></polygon>
                    <polyline class="ae-line" points="{{ .JSON.String "charts.cluster_cpu.line" }}"></polyline>
                  </svg>
                  <div class="ae-chart-foot"><span>6 h ago</span><span>scale 0–100% · range {{ .JSON.Float "charts.cluster_cpu.min" }}–{{ .JSON.Float "charts.cluster_cpu.max" }}{{ .JSON.String "charts.cluster_cpu.unit" }}</span><span>now</span></div>
                </div>
                <div class="ae-chart">
                  <div class="ae-chart-head"><span class="ae-chart-title">Cluster memory</span><span class="ae-chart-now">{{ .JSON.Float "charts.cluster_mem.last" }}{{ .JSON.String "charts.cluster_mem.unit" }}</span></div>
                  <svg viewBox="0 0 300 80" preserveAspectRatio="none" role="img" aria-label="Cluster memory, last 6 hours">
                    <line class="ae-grid" x1="0" y1="6" x2="300" y2="6"></line>
                    <line class="ae-grid" x1="0" y1="40" x2="300" y2="40"></line>
                    <line class="ae-grid" x1="0" y1="74" x2="300" y2="74"></line>
                    <polygon class="ae-area" points="{{ .JSON.String "charts.cluster_mem.area" }}"></polygon>
                    <polyline class="ae-line" points="{{ .JSON.String "charts.cluster_mem.line" }}"></polyline>
                  </svg>
                  <div class="ae-chart-foot"><span>6 h ago</span><span>scale 0–100% · range {{ .JSON.Float "charts.cluster_mem.min" }}–{{ .JSON.Float "charts.cluster_mem.max" }}{{ .JSON.String "charts.cluster_mem.unit" }}</span><span>now</span></div>
                </div>
                <div class="ae-chart">
                  <div class="ae-chart-head"><span class="ae-chart-title">Cloud host CPU</span><span class="ae-chart-now">{{ .JSON.Float "charts.oci_cpu.last" }}{{ .JSON.String "charts.oci_cpu.unit" }}</span></div>
                  <svg viewBox="0 0 300 80" preserveAspectRatio="none" role="img" aria-label="Cloud host CPU, last 6 hours">
                    <line class="ae-grid" x1="0" y1="6" x2="300" y2="6"></line>
                    <line class="ae-grid" x1="0" y1="40" x2="300" y2="40"></line>
                    <line class="ae-grid" x1="0" y1="74" x2="300" y2="74"></line>
                    <polygon class="ae-area" points="{{ .JSON.String "charts.oci_cpu.area" }}"></polygon>
                    <polyline class="ae-line" points="{{ .JSON.String "charts.oci_cpu.line" }}"></polyline>
                  </svg>
                  <div class="ae-chart-foot"><span>6 h ago</span><span>scale 0–100% · range {{ .JSON.Float "charts.oci_cpu.min" }}–{{ .JSON.Float "charts.oci_cpu.max" }}{{ .JSON.String "charts.oci_cpu.unit" }}</span><span>now</span></div>
                </div>
                <div class="ae-chart">
                  <div class="ae-chart-head"><span class="ae-chart-title">Hypervisor CPU temperature</span><span class="ae-chart-now">{{ .JSON.Float "charts.hyp_temp.last" }}{{ .JSON.String "charts.hyp_temp.unit" }}</span></div>
                  <svg viewBox="0 0 300 80" preserveAspectRatio="none" role="img" aria-label="Hypervisor CPU temperature, last 6 hours">
                    <line class="ae-grid" x1="0" y1="6" x2="300" y2="6"></line>
                    <line class="ae-grid" x1="0" y1="40" x2="300" y2="40"></line>
                    <line class="ae-grid" x1="0" y1="74" x2="300" y2="74"></line>
                    <polygon class="ae-area" points="{{ .JSON.String "charts.hyp_temp.area" }}"></polygon>
                    <polyline class="ae-line" points="{{ .JSON.String "charts.hyp_temp.line" }}"></polyline>
                  </svg>
                  <div class="ae-chart-foot"><span>6 h ago</span><span>scale 20–100 °C · range {{ .JSON.Float "charts.hyp_temp.min" }}–{{ .JSON.Float "charts.hyp_temp.max" }}{{ .JSON.String "charts.hyp_temp.unit" }}</span><span>now</span></div>
                </div>
                </div>
              </div>

          # FND-20: backup and alerting heartbeats, from the DMZ's own Uptime Kuma
          # (a public-safe status page; read over the local Docker network).
          - type: custom-api
            title: Backups and alerting
            frameless: true
            hide-header: true
            url: http://uptime-kuma:3001/api/status-page/public
            cache: 2m
            template: |
              {{ $hb := newRequest "http://uptime-kuma:3001/api/status-page/heartbeat/public" | getResponse }}
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">Backups and alerting</span>
                  <span class="vitals-badge">CHECKED FROM OUTSIDE</span>
                </div>
                <ul class="ae-status">
                  {{ range .JSON.Array "publicGroupList.0.monitorList" }}
                  {{ $id := .Int "id" }}
                  {{ $st := $hb.JSON.Int (printf "heartbeatList.%d.@reverse.0.status" $id) }}
                  {{ $tm := $hb.JSON.String (printf "heartbeatList.%d.@reverse.0.time" $id) }}
                  <li>
                    <span class="ae-dot {{ if eq $st 1 }}ae-ok{{ else if eq $st 2 }}ae-warn{{ else }}ae-bad{{ end }}"></span>
                    <span class="ae-status-name">{{ .String "name" }}</span>
                    <span class="ae-status-meta">{{ if $tm }}last <span {{ $tm | parseTime "2006-01-02 15:04:05.000" | toRelativeTime }}></span> ago · {{ end }}24 h {{ $hb.JSON.Float (printf "uptimeList.%d_24" $id) | mul 100 | toInt }}%</span>
                  </li>
                  {{ end }}
                </ul>
              </div>

          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">How the estate is watched</span>
                  <span class="vitals-badge">DESIGN</span>
                </div>
                <div class="bar-row"><span class="bar-name">Metrics</span><span class="ae-fact">Prometheus on Oracle Cloud scrapes the cluster nodes, kube-state-metrics, ArgoCD and the Proxmox host over the tailnet</span></div>
                <div class="bar-row"><span class="bar-name">Logs</span><span class="ae-fact">Grafana Alloy on every node ships pod logs to Loki; an alert fires if any node goes quiet for 30 minutes</span></div>
                <div class="bar-row"><span class="bar-name">Alerts</span><span class="ae-fact">Alertmanager to Telegram, with a watchdog heartbeat to this host so a dead alert path is itself noticed</span></div>
                <div class="bar-row"><span class="bar-name">Outside-in</span><span class="ae-fact">Uptime Kuma here probes the public services and receives push heartbeats from every backup stage</span></div>
                <div class="bar-row"><span class="bar-name">Reviews</span><span class="ae-fact">Every real failure gets a written incident review with root cause and guardrails</span></div>
              </div>

      - size: small
        widgets:
          # FND-20: what the cluster is running (image and tag only).
          - type: custom-api
            title: Running versions
            url: https://public-feed.tail7067ab.ts.net/summary.json
            cache: 5m
            template: |
              <ul class="ae-versions">
                {{ range .JSON.Array "versions" }}
                <li><code>{{ .String "image" }}</code><span>{{ .String "tag" }}</span></li>
                {{ end }}
              </ul>

          - type: bookmarks
            title: Further reading
            groups:
              - title: Decisions and reviews
                links:
                  - title: "ADR-019: Centralized logging"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/019-centralized-logging-architecture.md
                  - title: "ADR-020: Public observability (this page)"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/020-public-observability-data-diode.md
                  - title: Incident reviews
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/incidents

  # ---------------------------------------------------------------------------
  # Page 3: Infrastructure
  # ---------------------------------------------------------------------------
  - name: Infrastructure
    columns:
      - size: full
        widgets:
          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">Where it runs</span>
                  <span class="vitals-badge">THREE ENVIRONMENTS</span>
                </div>
                <div class="ae-table-wrap">
                  <table class="ae-table">
                    <thead>
                      <tr><th>Environment</th><th>Location</th><th>Specs</th><th>Role</th></tr>
                    </thead>
                    <tbody>
                      <tr><td><strong>GCP DMZ</strong></td><td><code>us-central1-a</code></td><td>2 vCPU / 1 GB RAM</td><td>Outside-in observer and this public page</td></tr>
                      <tr><td><strong>OCI Core</strong></td><td><code>ap-mumbai-1</code></td><td>2 OCPU / 12 GB RAM</td><td>Metrics, logs, alerting and automation</td></tr>
                      <tr><td><strong>Homelab</strong></td><td>Proxmox host</td><td>2 cores (4 threads) / 12 GB RAM</td><td>3-node K3s cluster: one control plane, two workers</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>

          - type: bookmarks
            title: Decisions
            groups:
              - title: Key architecture records
                links:
                  - title: "ADR-004: Network Access (Tailscale)"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/004-network-access.md
                  - title: "ADR-009: GitOps Controller (ArgoCD)"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/009-gitops-controller.md
                  - title: "ADR-013: Tailnet Microsegmentation"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/013-tailnet-microsegmentation.md
                  - title: "ADR-016: Kubernetes Storage Strategy"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/016-kubernetes-storage-strategy.md
                  - title: "ADR-018: 3-2-1 Disaster Recovery"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/018-offsite-backup-and-3-2-1-disaster-recovery-strategy.md
                  - title: "ADR-019: Centralized Logging Architecture"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/019-centralized-logging-architecture.md
                  - title: "ADR-021: Internal DNS & PKI"
                    url: https://github.com/ChetanThapliyal/Project-Aether/blob/main/docs/adr/021-internal-dns-and-pki.md

  # ---------------------------------------------------------------------------
  # Page 4: Writing. Feeds are fetched by Glance on the DMZ, which has IPv6 only:
  # a feed host without an AAAA record (GitHub, for one) can't load here.
  # ---------------------------------------------------------------------------
  - name: Writing
    slug: feeds
    columns:
      - size: full
        widgets:
          - type: rss
            title: Latest from the blog
            style: vertical-list   # the blog feed carries no cover images
            limit: 8
            collapse-after: 4
            cache: 1h
            feeds:
              - url: https://chetan-thapliyal.cloud/index.xml
                title: chetan-thapliyal.cloud

      - size: small
        widgets:
          - type: bookmarks
            title: Notes
            groups:
              - title: Lexicon
                links:
                  - title: Lexicon knowledge base
                    url: https://base.chetan-thapliyal.cloud/
                    icon: si:astro
                  - title: Blog index
                    url: https://chetan-thapliyal.cloud/posts/
                    icon: si:hugo
