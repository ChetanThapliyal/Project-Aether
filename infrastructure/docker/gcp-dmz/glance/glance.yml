# =============================================================================
# Project Aether — Glance Dashboard Configuration
# =============================================================================
# Ultra-lightweight status and public platform dashboard (<50 MiB RAM)
# Running on GCP DMZ (e2-micro). Public through the Cloudflare Tunnel (FND-10).
#
# PUBLIC PAGE RULES (HARD-17, ADR-020):
#   - No tailnet hostnames or links (*.ts.net, MagicDNS short names), no LAN or
#     cluster IPs. Operator consoles are named, never linked.
#   - No numbers presented as live. Static facts carry the date they were true.
#     Live vitals arrive only through the ADR-020 summary feed.
# =============================================================================

server:
  assets-path: /app/assets

branding:
  app-name: "Project Aether"
  logo-text: "Aether"                 # styled in user.css (brand gradient)
  favicon-url: "/assets/favicon.svg"   # rose "A" on stone, same style as the portfolio's "C" icon
  # FND-21: AETHER_COMMIT comes from the DMZ .env (deploy-dmz.yml). Glance refuses
  # a config that names a missing variable, so compose defaults it to "unknown".
  custom-footer: |
    <p class="ae-footer">Deployed from <a href="https://github.com/ChetanThapliyal/Project-Aether/commit/${AETHER_COMMIT}" target="_blank" rel="noreferrer"><code>${AETHER_COMMIT}</code></a> · <a href="https://github.com/ChetanThapliyal/Project-Aether" target="_blank" rel="noreferrer">source on GitHub</a> · numbers refresh every 2 minutes through a one-way feed</p>

# FND-21: link previews (LinkedIn, Slack) and a tab title that names the project.
# Crawlers don't run scripts, so the Open Graph tags carry the preview.
document:
  head: |
    <meta name="description" content="Live status of Project Aether, a hybrid cloud homelab run like production: Kubernetes on Proxmox, monitoring on Oracle Cloud, an edge observer on Google Cloud, all declared in Git.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Project Aether">
    <meta property="og:title" content="Project Aether · live status of a hybrid cloud homelab">
    <meta property="og:description" content="Kubernetes on Proxmox, monitoring on Oracle Cloud, an edge observer on Google Cloud. Live numbers, backups, incident reviews and the decisions behind them.">
    <meta property="og:url" content="https://status.chetan-thapliyal.cloud/">
    <meta name="twitter:card" content="summary">
    <script src="/assets/title.js"></script>

# FND-19: portfolio brand (blowfish-ct-folio/docs/brand). HSL of stone #1C1917,
# orange #EA580C and rose #E11D48; user.css maps the rest onto brand tokens.
#
# Light theme: the picker offers three chips. "default" is Auto: user.css
# follows the visitor's OS (prefers-color-scheme), dark when it says nothing.
# The two presets reuse Glance's built-in keys so its stock blue light theme
# never appears; picking one sets a cookie and overrides the OS. Brand light
# values: background #F5F5F4, primary #C2410C (text-safe orange), negative
# #BE123C. Keep default-light in step with the Auto block in user.css.
theme:
  background-color: 24 10 10
  primary-color: 21 90 48
  negative-color: 347 77 50
  contrast-multiplier: 1.0
  disable-picker: false
  custom-css-file: /assets/user.css
  presets:
    default-dark:
      background-color: 24 10 10
      primary-color: 21 90 48
      negative-color: 347 77 50
      contrast-multiplier: 1.0
    default-light:
      light: true
      background-color: 60 5 96
      primary-color: 17 88 40
      negative-color: 345 83 41
      contrast-multiplier: 1.3
      text-saturation-multiplier: 0.5

pages:
  # ---------------------------------------------------------------------------
  # Page 1: Overview
  # ---------------------------------------------------------------------------
  - name: Overview
    columns:
      - size: small
        widgets:
          - type: bookmarks
            title: Evidence
            groups:
              - title: In the repository
                links:
                  - title: GitHub monorepo
                    url: https://github.com/ChetanThapliyal/Project-Aether
                    icon: si:github
                  - title: Architecture decisions (22)
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/adr
                    icon: si:markdown
                  - title: Incident reviews
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/incidents
                    icon: si:markdown
                  - title: Disaster recovery scenarios
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/disaster-recovery
                    icon: si:markdown
                  - title: Runbooks
                    url: https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/runbooks
                    icon: si:markdown

          - type: monitor
            title: Public sites
            cache: 1m
            sites:
              - title: Portfolio and blog
                url: https://chetan-thapliyal.cloud/
                icon: si:hugo
              - title: Lexicon notes
                url: https://base.chetan-thapliyal.cloud/
                icon: si:astro
              - title: This status page
                url: https://status.chetan-thapliyal.cloud/
                icon: si:cloudflare

          # Visits to this page, from the public feed's "visitors" block: Cloudflare
          # Web Analytics counts (no cookies), kept as a daily log on the cloud host so
          # the total outlives Cloudflare's retention. Headless browsers (our own
          # test runs) aren't counted. A null field reads as "" and shows as unknown.
          - type: custom-api
            title: Visits
            url: https://public-feed.tail7067ab.ts.net/summary.json
            cache: 5m
            template: |
              {{ $v := .JSON.Get "visitors" }}
              {{ if eq ($v.String "visits_total") "" }}
              <p class="color-subdue">Count unknown right now.</p>
              {{ else }}
              <div class="ae-visits">
                <div><div class="ae-visits-num">{{ $v.Int "visits_30d" }}</div><div class="size-h6">last 30 days</div></div>
                <div><div class="ae-visits-num">{{ $v.Int "visits_total" }}</div><div class="size-h6">since {{ $v.String "since" }}</div></div>
              </div>
              {{ end }}
              <p class="color-subdue size-h6 ae-visits-note">Counted without cookies</p>

      - size: full
        widgets:
          # FND-23: overall status in one line, first on the page. Green when all
          # is well; otherwise it names each problem. The feed and the DMZ's own
          # Kuma (backup and alerting checks) are the inputs, as elsewhere.
          - type: custom-api
            title: Status
            frameless: true
            hide-header: true
            url: https://public-feed.tail7067ab.ts.net/summary.json
            cache: 2m
            template: |
              {{ $page := newRequest "http://uptime-kuma:3001/api/status-page/public" | getResponse }}
              {{ $hb := newRequest "http://uptime-kuma:3001/api/status-page/heartbeat/public" | getResponse }}
              {{ $checksDown := 0.0 }}
              {{ range $page.JSON.Array "publicGroupList.0.monitorList" }}{{ if ne ($hb.JSON.Int (printf "heartbeatList.%d.@reverse.0.status" (.Int "id"))) 1 }}{{ $checksDown = add $checksDown 1.0 }}{{ end }}{{ end }}
              {{ $fresh := .JSON.Bool "fresh" }}
              {{ $nodes := ne (.JSON.Int "cluster.nodes_ready") (.JSON.Int "cluster.nodes_total") }}
              {{ $apps := ne (.JSON.Int "cluster.apps_ok") (.JSON.Int "cluster.apps_total") }}
              {{ $pods := ne (.JSON.Int "cluster.pods_running") (.JSON.Int "cluster.pods_total") }}
              {{ $targets := ne (.JSON.Int "monitoring.targets_up") (.JSON.Int "monitoring.targets_total") }}
              {{ $alerts := gt (.JSON.Int "monitoring.alerts_firing") 0 }}
              {{ $bad := or (not $fresh) $nodes }}
              {{ $warn := or $apps $pods $targets $alerts (gt $checksDown 0.0) }}
              <div class="ae-banner {{ if $bad }}ae-banner-bad{{ else if $warn }}ae-banner-warn{{ else }}ae-banner-ok{{ end }}" role="status">
                <span class="ae-dot {{ if $bad }}ae-bad{{ else if $warn }}ae-warn{{ else }}ae-ok{{ end }}"></span>
                {{ if or $bad $warn }}
                <span class="ae-banner-title">{{ if $bad }}Disruption{{ else }}Degraded{{ end }}</span>
                <span class="ae-banner-items">
                  {{ if not $fresh }}<span>live data delayed since <span {{ .JSON.String "generated_at" | parseTime "RFC3339" | toRelativeTime }}></span> ago</span>{{ end }}
                  {{ if $nodes }}<span>{{ .JSON.Int "cluster.nodes_ready" }} of {{ .JSON.Int "cluster.nodes_total" }} cluster nodes ready</span>{{ end }}
                  {{ if $apps }}<span>{{ sub (.JSON.Float "cluster.apps_total") (.JSON.Float "cluster.apps_ok") | toInt }} GitOps apps not healthy</span>{{ end }}
                  {{ if $pods }}<span>{{ sub (.JSON.Float "cluster.pods_total") (.JSON.Float "cluster.pods_running") | toInt }} pods not running</span>{{ end }}
                  {{ if $alerts }}<span>{{ .JSON.Int "monitoring.alerts_firing" }} alert{{ if gt (.JSON.Int "monitoring.alerts_firing") 1 }}s{{ end }} firing</span>{{ end }}
                  {{ if $targets }}<span>{{ sub (.JSON.Float "monitoring.targets_total") (.JSON.Float "monitoring.targets_up") | toInt }} scrape targets down</span>{{ end }}
                  {{ if gt $checksDown 0.0 }}<span>{{ $checksDown | toInt }} backup or alerting check{{ if gt $checksDown 1.0 }}s{{ end }} failing</span>{{ end }}
                </span>
                {{ else }}
                <span class="ae-banner-title">All systems normal</span>
                <span class="ae-banner-items"><span>cluster, monitoring, backups and alerting checked <span {{ .JSON.String "generated_at" | parseTime "RFC3339" | toRelativeTime }}></span> ago</span></span>
                {{ end }}
              </div>

          # FND-21: who and what, first thing on desktop and phone (phones show
          # this column before the small one).
          - type: html
            source: |
              <div class="vitals-card ae-intro">
                <div class="ae-intro-head">
                  <div class="ae-intro-name">Project <span class="ae-grad">Aether</span></div>
                  <span class="vitals-badge">HYBRID CLOUD HOMELAB</span>
                </div>
                <p class="ae-note">A homelab run like production: a three-node Kubernetes cluster on a Proxmox host at home, a monitoring and automation core on Oracle Cloud, and this edge observer on Google Cloud, joined by a WireGuard mesh. Everything is declared in one Git repository: Terraform for machines, Ansible for hosts, ArgoCD for the cluster, SOPS for secrets. The numbers below are live.</p>
                <div class="ae-intro-links">
                  <a href="https://chetan-thapliyal.cloud/" target="_blank" rel="noreferrer">Portfolio</a>
                  <a href="https://github.com/ChetanThapliyal/Project-Aether" target="_blank" rel="noreferrer">Source on GitHub</a>
                </div>
              </div>

          # FND-20: live numbers from the sanitised feed on OCI (ADR-020). Numbers and
          # plain strings only; Glance escapes them, and this template draws everything.
          - type: custom-api
            title: Live status
            frameless: true
            hide-header: true
            url: https://public-feed.tail7067ab.ts.net/summary.json
            cache: 2m
            template: |
              <div class="ae-live-head">
                <span class="ae-live-title">Live status</span>
                {{ if .JSON.Bool "fresh" }}
                <span class="vitals-badge ae-live">LIVE · UPDATED <span {{ .JSON.String "generated_at" | parseTime "RFC3339" | toRelativeTime }}></span> AGO</span>
                {{ else }}
                <span class="vitals-badge ae-stale">DATA DELAYED SINCE <span {{ .JSON.String "generated_at" | parseTime "RFC3339" | toRelativeTime }}></span></span>
                {{ end }}
              </div>
              <div class="ae-hero">
                <div class="ae-stat"><div class="ae-stat-label">Nodes ready</div><div class="ae-stat-num {{ if eq (.JSON.Int "cluster.nodes_ready") (.JSON.Int "cluster.nodes_total") }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "cluster.nodes_ready" }}<span>/{{ .JSON.Int "cluster.nodes_total" }}</span></div><div class="ae-stat-sub">K3s cluster on Proxmox</div></div>
                <div class="ae-stat"><div class="ae-stat-label">GitOps apps healthy</div><div class="ae-stat-num {{ if eq (.JSON.Int "cluster.apps_ok") (.JSON.Int "cluster.apps_total") }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "cluster.apps_ok" }}<span>/{{ .JSON.Int "cluster.apps_total" }}</span></div><div class="ae-stat-sub">synced and healthy in ArgoCD</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Pods running</div><div class="ae-stat-num {{ if eq (.JSON.Int "cluster.pods_running") (.JSON.Int "cluster.pods_total") }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "cluster.pods_running" }}<span>/{{ .JSON.Int "cluster.pods_total" }}</span></div><div class="ae-stat-sub">of all pods, finished jobs not counted</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Alerts firing</div><div class="ae-stat-num {{ if eq (.JSON.Int "monitoring.alerts_firing") 0 }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "monitoring.alerts_firing" }}</div><div class="ae-stat-sub">excluding the watchdog heartbeat</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Scrape targets up</div><div class="ae-stat-num">{{ .JSON.Int "monitoring.targets_up" }}<span>/{{ .JSON.Int "monitoring.targets_total" }}</span></div><div class="ae-stat-sub">Prometheus on Oracle Cloud</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Kubernetes</div><div class="ae-stat-num">{{ .JSON.String "cluster.k3s_version" }}</div><div class="ae-stat-sub">K3s, upgraded via Ansible</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Host CPU temp</div><div class="ae-stat-num">{{ .JSON.Float "host.temp_c" | toInt }}<span>°C</span></div><div class="ae-stat-sub">the 2015 laptop under it all</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Host uptime</div><div class="ae-stat-num">{{ .JSON.Float "host.uptime_days" }}<span>days</span></div><div class="ae-stat-sub">since the last reboot · unplanned ones get an <a href="https://github.com/ChetanThapliyal/Project-Aether/tree/main/docs/incidents" target="_blank" rel="noreferrer">incident review</a></div></div>
              </div>
              <div class="vitals-card">
                <div class="section-title">Capacity</div>
                <div class="ae-gauges">
                  {{ range .JSON.Array "gauges" }}
                  <div class="ae-gauge">
                    <svg viewBox="0 0 64 64" role="img" aria-label="{{ .String "label" }} {{ .Float "pct" }} percent">
                      <circle class="ae-gauge-track" cx="32" cy="32" r="26"></circle>
                      <circle class="ae-gauge-fill ae-{{ .String "level" }}" cx="32" cy="32" r="26" stroke-dasharray="{{ .Float "dash" }} {{ .Float "gap" }}" transform="rotate(-90 32 32)"></circle>
                      <text x="32" y="37" text-anchor="middle" class="ae-gauge-val">{{ .Float "pct" | toInt }}%</text>
                    </svg>
                    <div class="ae-gauge-label">{{ .String "label" }}</div>
                    <div class="ae-gauge-group">{{ .String "group" }}</div>
                  </div>
                  {{ end }}
                </div>
                <p class="ae-muted">Host memory runs high by design: three Kubernetes VMs share a 12 GB laptop.</p>
              </div>

          # FND-22: how the estate fits together, which is also the path every
          # number on this page takes. Live dots from the same feed.
          - type: custom-api
            title: How it fits together
            frameless: true
            hide-header: true
            url: https://public-feed.tail7067ab.ts.net/summary.json
            cache: 2m
            template: |
              {{ $home := and (eq (.JSON.Int "cluster.nodes_ready") (.JSON.Int "cluster.nodes_total")) (eq (.JSON.Int "cluster.apps_ok") (.JSON.Int "cluster.apps_total")) }}
              {{ $core := and (eq (.JSON.Int "monitoring.targets_up") (.JSON.Int "monitoring.targets_total")) (eq (.JSON.Int "monitoring.alerts_firing") 0) }}
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">How it fits together</span>
                  <span class="vitals-badge">AND HOW THIS PAGE GETS ITS NUMBERS</span>
                </div>
                <div class="ae-arch">
                  <div class="ae-node">
                    <div class="ae-node-kicker">At home · behind CGNAT</div>
                    <div class="ae-node-name">Home lab</div>
                    <div class="ae-node-what">Proxmox, a 3-node K3s cluster run by ArgoCD, ZFS backups</div>
                    <div class="ae-node-status"><span class="ae-dot {{ if $home }}ae-ok{{ else }}ae-bad{{ end }}"></span>{{ .JSON.Int "cluster.nodes_ready" }}/{{ .JSON.Int "cluster.nodes_total" }} nodes, {{ .JSON.Int "cluster.apps_ok" }}/{{ .JSON.Int "cluster.apps_total" }} apps healthy</div>
                  </div>
                  <div class="ae-link"><span class="ae-link-arrow" aria-hidden="true">⇄</span><span class="ae-link-text">metrics scraped, logs shipped, over the mesh</span></div>
                  <div class="ae-node">
                    <div class="ae-node-kicker">Oracle Cloud · no inbound TCP</div>
                    <div class="ae-node-name">Monitoring core</div>
                    <div class="ae-node-what">Prometheus, Loki, Alertmanager; builds a numbers-only summary</div>
                    <div class="ae-node-status"><span class="ae-dot {{ if $core }}ae-ok{{ else }}ae-warn{{ end }}"></span>{{ .JSON.Int "monitoring.targets_up" }}/{{ .JSON.Int "monitoring.targets_total" }} targets, {{ .JSON.Int "monitoring.alerts_firing" }} alerts</div>
                  </div>
                  <div class="ae-link ae-link-diode"><span class="ae-link-arrow" aria-hidden="true">→</span><span class="ae-link-text">summary pulled over the mesh, {{ if .JSON.Bool "fresh" }}live{{ else }}<b>delayed</b>{{ end }}; nothing flows back</span></div>
                  <div class="ae-node">
                    <div class="ae-node-kicker">Google Cloud · no public IPv4</div>
                    <div class="ae-node-name">Edge observer</div>
                    <div class="ae-node-what">This page and Uptime Kuma, watching everything from outside</div>
                    <div class="ae-node-status"><span class="ae-dot ae-ok"></span>serving you this page</div>
                  </div>
                  <div class="ae-link"><span class="ae-link-arrow" aria-hidden="true">→</span><span class="ae-link-text">tunnel opened outbound</span></div>
                  <div class="ae-node ae-node-end">
                    <div class="ae-node-kicker">Cloudflare</div>
                    <div class="ae-node-name">You</div>
                    <div class="ae-node-what">TLS ends at Cloudflare's edge; this page and one signed webhook are the only public paths</div>
                  </div>
                </div>
                <p class="ae-muted">The three sites share a WireGuard mesh with role-based rules. The public page sits on the least-trusted machine and can only read a sanitised summary, so a visitor never touches the private network. Offsite backups go from home to an Object-Locked bucket.</p>
              </div>

          - type: html
            title: Architecture
            hide-header: true
            frameless: true
            source: |
              <div class="ae-section-head" id="architecture">Architecture</div>
              <div class="vitals-card">
                <div class="section-title">The whole project · dashed boxes are planned</div>
                <div class="ae-diagram-scroll">
                  <img class="ae-diagram ae-diagram-wide" src="/assets/aether-architecture.svg" width="1600" height="1040" loading="lazy" alt="Architecture of Project Aether: a public internet row, a Google Cloud DMZ, a private mesh, the on-prem Kubernetes home lab, the Oracle Cloud monitoring core, and the tools that manage it all as code. Dashed boxes are planned for the next two phases.">
                </div>
              </div>

          - type: html
            source: |
              <div class="vitals-card">
                <div class="vitals-header">
                  <span class="vitals-title">How it is built</span>
                  <span class="vitals-badge">DESIGN FACTS · 18 NOV 2026</span>
                </div>
                <div class="bar-row"><span class="bar-name">Delivery</span><span class="ae-fact">ArgoCD app-of-apps tracking <code>main</code>; images and Helm charts pinned and kept current by Renovate; values linted in CI</span></div>
                <div class="bar-row"><span class="bar-name">Edge</span><span class="ae-fact">Envoy Gateway; each app gets a public DNS name that resolves only on the mesh, with a Let's Encrypt certificate</span></div>
                <div class="bar-row"><span class="bar-name">Apps</span><span class="ae-fact">Three apps moved over from the cloud host so far; one shared PostgreSQL and Redis, files on NFS from a snapshotted ZFS pool; non-root, read-only filesystems, outbound access opt-in per app</span></div>
                <div class="bar-row"><span class="bar-name">Security</span><span class="ae-fact">Tailnet roles with policy tests, default-deny NetworkPolicies, Secrets encrypted at rest, no public SSH, a strict content policy on this page</span></div>
                <div class="bar-row"><span class="bar-name">Observability</span><span class="ae-fact">Prometheus, Loki (Grafana Alloy agents) and Alertmanager to Telegram, database exporters, an outside HTTPS check per app, plus a dead-man's switch</span></div>
                <div class="bar-row"><span class="bar-name">Recovery</span><span class="ae-fact">Nightly etcd snapshots and app database dumps to ZFS, then an Object-Locked offsite bucket; restores of both drilled</span></div>
              </div>

  # ---------------------------------------------------------------------------
  # Page 2: Observability (FND-20 feed + DMZ Kuma; big-number style, no links in)
  # ---------------------------------------------------------------------------
  - name: Observability
    columns:
      - size: full
        widgets:
          - type: custom-api
            title: Trends
            frameless: true
            hide-header: true
            url: https://public-feed.tail7067ab.ts.net/summary.json
            cache: 2m
            template: |
              <div class="ae-live-head">
                <span class="ae-live-title">Observability</span>
                {{ if .JSON.Bool "fresh" }}
                <span class="vitals-badge ae-live">LIVE · UPDATED <span {{ .JSON.String "generated_at" | parseTime "RFC3339" | toRelativeTime }}></span> AGO</span>
                {{ else }}
                <span class="vitals-badge ae-stale">DATA DELAYED SINCE <span {{ .JSON.String "generated_at" | parseTime "RFC3339" | toRelativeTime }}></span></span>
                {{ end }}
              </div>
              <div class="ae-hero">
                <div class="ae-stat"><div class="ae-stat-label">Scrape targets up</div><div class="ae-stat-num {{ if eq (.JSON.Int "monitoring.targets_up") (.JSON.Int "monitoring.targets_total") }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "monitoring.targets_up" }}<span>/{{ .JSON.Int "monitoring.targets_total" }}</span></div><div class="ae-stat-sub">nodes, cluster state, ArgoCD, hypervisor</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Alerts firing</div><div class="ae-stat-num {{ if eq (.JSON.Int "monitoring.alerts_firing") 0 }}ae-ok{{ else }}ae-bad{{ end }}">{{ .JSON.Int "monitoring.alerts_firing" }}</div><div class="ae-stat-sub">Alertmanager to Telegram</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Cluster CPU</div><div class="ae-stat-num">{{ .JSON.Float "charts.cluster_cpu.last" | toInt }}<span>%</span></div><div class="ae-stat-sub">3 nodes, 5-minute average</div></div>
                <div class="ae-stat"><div class="ae-stat-label">Cluster memory</div><div class="ae-stat-num">{{ .JSON.Float "charts.cluster_mem.last" | toInt }}<span>%</span></div><div class="ae-stat-sub">3 nodes, used of total</div></div>
              </div>
              <div class="vitals-card">
                <div class="section-title">Last 6 hours · 5-minute steps · each axis fitted to its data</div>
                <div class="ae-charts">
                  {{ if .JSON.Exists "charts.cluster_cpu" }}
                  <div class="ae-chart">
                    <div class="ae-chart-head"><div><div class="ae-stat-label">Cluster CPU</div><div class="ae-chart-big">{{ .JSON.Float "charts.cluster_cpu.last" }}<span>{{ .JSON.String "charts.cluster_cpu.unit" }}</span></div></div><div class="ae-chart-range">6 h range<br>{{ .JSON.Float "charts.cluster_cpu.min" }}–{{ .JSON.Float "charts.cluster_cpu.max" }}{{ .JSON.String "charts.cluster_cpu.unit" }}</div></div>
                    <svg viewBox="0 0 300 80" preserveAspectRatio="none" role="img" aria-label="Cluster CPU, last 6 hours">
                      <line class="ae-grid" x1="0" y1="6" x2="300" y2="6"></line>
                      <line class="ae-grid" x1="0" y1="40" x2="300" y2="40"></line>
                      <line class="ae-grid" x1="0" y1="74" x2="300" y2="74"></line>
                      <polygon class="ae-area" points="{{ .JSON.String "charts.cluster_cpu.area" }}"></polygon>
                      <polyline class="ae-line" points="{{ .JSON.String "charts.cluster_cpu.line" }}"></polyline>
                    </svg>
                    <div class="ae-chart-foot"><span>6 h ago</span><span>axis {{ .JSON.Float "charts.cluster_cpu.lo" }}–{{ .JSON.Float "charts.cluster_cpu.hi" }}{{ .JSON.String "charts.cluster_cpu.unit" }}</span><span>now</span></div>
                  </div>
                  {{ end }}
                  {{ if .JSON.Exists "charts.cluster_mem" }}
                  <div class="ae-chart">
                    <div class="ae-chart-head"><div><div class="ae-stat-label">Cluster memory</div><div class="ae-chart-big">{{ .JSON.Float "charts.cluster_mem.last" }}<span>{{ .JSON.String "charts.cluster_mem.unit" }}</span></div></div><div class="ae-chart-range">6 h range<br>{{ .JSON.Float "charts.cluster_mem.min" }}–{{ .JSON.Float "charts.cluster_mem.max" }}{{ .JSON.String "charts.cluster_mem.unit" }}</div></div>
