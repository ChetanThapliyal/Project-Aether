<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="Left: three VMs on one laptop, each holding one replica, all stored on the same SSD, sharing one power supply and one hypervisor, so one failure takes every replica. Right: databases on local-path and files on an NFS dataset are dumped and snapshotted nightly and copied, encrypted, to an Object Lock bucket offsite. A restore drill after a power cut matched every row count."><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A8A29E"/></marker><marker id="arr-6d9429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6D9429"/></marker><marker id="arr-e11d48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arr-a3e635" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A3E635"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="1600" height="700" fill="#1C1917"/><text x="40" y="46" font-size="30" font-weight="800" fill="#F5F5F4" text-anchor="start">Project Aether</text><text x="262" y="46" font-size="22" font-weight="700" fill="#FB923C" text-anchor="start">replicas or backups</text><text x="1576" y="46" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="end">as of 18 Nov 2026</text><text x="40" y="74" font-size="15" font-weight="400" fill="#A8A29E" text-anchor="start">On one physical host, replicas share every failure. A copy somewhere else is the redundancy that counts.</text><text x="1088" y="76" font-size="12.5" font-weight="700" fill="#A8A29E" text-anchor="start" letter-spacing="0.08em">WHAT HAPPENS</text><circle cx="1226" cy="72" r="6" fill="#E11D48"/><text x="1238" y="77" font-size="13.5" font-weight="600" fill="#F5F5F4" text-anchor="start">one failure, everywhere</text><circle cx="1430" cy="72" r="6" fill="#A3E635"/><text x="1442" y="77" font-size="13.5" font-weight="600" fill="#F5F5F4" text-anchor="start">a copy elsewhere</text><rect x="40" y="130" width="760" height="500" rx="14" fill="#EA580C" fill-opacity="0.08" stroke="#EA580C" stroke-width="3"/><rect x="56" y="115" width="118" height="30" rx="8" fill="#EA580C"/><text x="115.0" y="136" font-size="17" font-weight="800" fill="#1C1917" text-anchor="middle">REJECTED</text><rect x="178" y="118" width="263" height="24" fill="#1C1917"/><text x="188" y="136" font-size="15" font-weight="600" fill="#F5F5F4" text-anchor="start">replicated storage on one laptop</text><text x="64" y="172" font-size="12.5" font-weight="700" fill="#A8A29E" text-anchor="start" letter-spacing="0.08em">THREE NODES, ONE REPLICA EACH</text><rect x="64" y="186" width="220" height="96" rx="9" fill="#292524" stroke="#57534E" stroke-width="1.5"/><text x="174.0" y="214" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Control VM</text><text x="174.0" y="235" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">replica 1 of 3</text><rect x="308" y="186" width="220" height="96" rx="9" fill="#292524" stroke="#57534E" stroke-width="1.5"/><text x="418.0" y="214" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Worker 1</text><text x="418.0" y="235" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">replica 2 of 3</text><rect x="552" y="186" width="220" height="96" rx="9" fill="#292524" stroke="#57534E" stroke-width="1.5"/><text x="662.0" y="214" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Worker 2</text><text x="662.0" y="235" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">replica 3 of 3</text><rect x="64" y="352" width="708" height="92" rx="9" fill="#292524" stroke="#E11D48" stroke-width="1.5"/><text x="418.0" y="380" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">One SSD</text><text x="418.0" y="401" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">holds every VM&#x27;s disk, so every replica</text><path d="M174,282 L174,350" fill="none" stroke="#A8A29E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M418,282 L418,350" fill="none" stroke="#A8A29E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M662,282 L662,350" fill="none" stroke="#A8A29E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="64" y="488" font-size="15" font-weight="600" fill="#F5F5F4" text-anchor="start">Shared by all three nodes:</text><rect x="64" y="500" width="78" height="34" rx="7" fill="#292524" stroke="#57534E" stroke-width="1.5"/><text x="103.0" y="522" font-size="15" font-weight="600" fill="#F5F5F4" text-anchor="middle">one SSD</text><rect x="152" y="500" width="246" height="34" rx="7" fill="#292524" stroke="#57534E" stroke-width="1.5"/><text x="275.0" y="522" font-size="15" font-weight="600" fill="#F5F5F4" text-anchor="middle">one power supply, no battery</text><rect x="408" y="500" width="134" height="34" rx="7" fill="#292524" stroke="#57534E" stroke-width="1.5"/><text x="475.0" y="522" font-size="15" font-weight="600" fill="#F5F5F4" text-anchor="middle">one hypervisor</text><text x="64" y="578" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="start">Longhorn would cost about 1.2 to 1.5 GB of worker memory (my estimate) and write</text><text x="64" y="600" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="start">every block three times to the same drive, for failover that can&#x27;t happen here.</text><rect x="830" y="130" width="746" height="500" rx="14" fill="#231F1D" stroke="#57534E" stroke-width="1.5"/><text x="854" y="162" font-size="12.5" font-weight="700" fill="#A8A29E" text-anchor="start" letter-spacing="0.08em">WHAT PROTECTS THE DATA</text><rect x="854" y="186" width="330" height="96" rx="9" fill="#292524" stroke="#57534E" stroke-width="1.5"/><text x="1019.0" y="214" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Databases</text><text x="1019.0" y="235" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">shared PostgreSQL</text><text x="1019.0" y="253" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">on local-path, SSD speed</text><rect x="1222" y="186" width="330" height="96" rx="9" fill="#292524" stroke="#57534E" stroke-width="1.5"/><text x="1387.0" y="214" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">App files</text><text x="1387.0" y="235" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">nfs-zfs: a ZFS dataset</text><text x="1387.0" y="253" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">on the hypervisor&#x27;s HDD</text><rect x="854" y="330" width="698" height="84" rx="9" fill="#292524" stroke="#57534E" stroke-width="1.5"/><text x="1203.0" y="358" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Nightly dump and ZFS snapshot</text><text x="1203.0" y="379" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">dumps read back and row counts recorded, then one consistent snapshot</text><rect x="854" y="462" width="698" height="84" rx="9" fill="#292524" stroke="#A3E635" stroke-width="1.5"/><text x="1203.0" y="490" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Offsite copy, encrypted</text><text x="1203.0" y="511" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">Object Lock bucket: nothing in the home lab can read, delete or shorten it</text><path d="M1019,282 L1019,328" fill="none" stroke="#6D9429" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-6d9429)"/><path d="M1387,282 L1387,328" fill="none" stroke="#6D9429" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-6d9429)"/><path d="M1203,414 L1203,460" fill="none" stroke="#6D9429" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-6d9429)"/><text x="854" y="584" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="start">After the 17 Nov power cut took every node down at once, a restore drill</text><text x="854" y="606" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="start">loaded every database from the dump. Every row count matched.</text><text x="40" y="684" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="start">Sources: ADR-016 (storage), ADR-022 (app data and backups), INC-2026-014 (power cut).</text><g class="anim" pointer-events="none"><path d="M174,352 L174,284" fill="none" stroke="#E11D48" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-e11d48)" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.0335;0.0670;0.4018;0.4353;1.0000" values="0;0;1;1;0;0"/></path><g opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0670;0.1786;1" values="0;1;0;0"/><animateMotion dur="4.48s" repeatCount="indefinite" path="M174,352 L174,284" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0670;0.1786;1"/><circle r="12" fill="#E11D48" fill-opacity="0.28"/><circle r="6" fill="#E11D48" stroke="#F5F5F4" stroke-width="2"/></g><path d="M418,352 L418,284" fill="none" stroke="#E11D48" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-e11d48)" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.0335;0.0670;0.4018;0.4353;1.0000" values="0;0;1;1;0;0"/></path><g opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0670;0.1786;1" values="0;1;0;0"/><animateMotion dur="4.48s" repeatCount="indefinite" path="M418,352 L418,284" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0670;0.1786;1"/><circle r="12" fill="#E11D48" fill-opacity="0.28"/><circle r="6" fill="#E11D48" stroke="#F5F5F4" stroke-width="2"/></g><path d="M662,352 L662,284" fill="none" stroke="#E11D48" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-e11d48)" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.0335;0.0670;0.4018;0.4353;1.0000" values="0;0;1;1;0;0"/></path><g opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0670;0.1786;1" values="0;1;0;0"/><animateMotion dur="4.48s" repeatCount="indefinite" path="M662,352 L662,284" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0670;0.1786;1"/><circle r="12" fill="#E11D48" fill-opacity="0.28"/><circle r="6" fill="#E11D48" stroke="#F5F5F4" stroke-width="2"/></g><rect x="62" y="350" width="712" height="96" rx="10" fill="none" stroke="#E11D48" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.0112;0.0446;0.4018;0.4353;1.0000" values="0;0;1;1;0;0"/></rect><rect x="62" y="184" width="224" height="100" rx="10" fill="none" stroke="#E11D48" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.1451;0.1786;0.4018;0.4353;1.0000" values="0;0;1;1;0;0"/></rect><rect x="306" y="184" width="224" height="100" rx="10" fill="none" stroke="#E11D48" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.1451;0.1786;0.4018;0.4353;1.0000" values="0;0;1;1;0;0"/></rect><rect x="550" y="184" width="224" height="100" rx="10" fill="none" stroke="#E11D48" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.1451;0.1786;0.4018;0.4353;1.0000" values="0;0;1;1;0;0"/></rect><rect x="1216" y="58" width="202" height="28" fill="#1C1917" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.0112;0.0446;0.4018;0.4353;1.0000" values="0.7;0.7;0;0;0.7;0.7"/></rect><path d="M1019,282 L1019,328" fill="none" stroke="#A3E635" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-a3e635)" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.4129;0.4464;0.9107;0.9442;1.0000" values="0;0;1;1;0;0"/></path><g opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4464;0.5580;1" values="0;1;0;0"/><animateMotion dur="4.48s" repeatCount="indefinite" path="M1019,282 L1019,328" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4464;0.5580;1"/><circle r="12" fill="#A3E635" fill-opacity="0.28"/><circle r="6" fill="#A3E635" stroke="#F5F5F4" stroke-width="2"/></g><path d="M1387,282 L1387,328" fill="none" stroke="#A3E635" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-a3e635)" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.4129;0.4464;0.9107;0.9442;1.0000" values="0;0;1;1;0;0"/></path><g opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4464;0.5580;1" values="0;1;0;0"/><animateMotion dur="4.48s" repeatCount="indefinite" path="M1387,282 L1387,328" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4464;0.5580;1"/><circle r="12" fill="#A3E635" fill-opacity="0.28"/><circle r="6" fill="#A3E635" stroke="#F5F5F4" stroke-width="2"/></g><path d="M1203,414 L1203,460" fill="none" stroke="#A3E635" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-a3e635)" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.5424;0.5759;0.9107;0.9442;1.0000" values="0;0;1;1;0;0"/></path><g opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5759;0.6875;1" values="0;1;0;0"/><animateMotion dur="4.48s" repeatCount="indefinite" path="M1203,414 L1203,460" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5759;0.6875;1"/><circle r="12" fill="#A3E635" fill-opacity="0.28"/><circle r="6" fill="#A3E635" stroke="#F5F5F4" stroke-width="2"/></g><rect x="852" y="184" width="334" height="100" rx="10" fill="none" stroke="#A3E635" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.3906;0.4241;0.9107;0.9442;1.0000" values="0;0;1;1;0;0"/></rect><rect x="1220" y="184" width="334" height="100" rx="10" fill="none" stroke="#A3E635" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.3906;0.4241;0.9107;0.9442;1.0000" values="0;0;1;1;0;0"/></rect><rect x="852" y="328" width="702" height="88" rx="10" fill="none" stroke="#A3E635" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.5246;0.5580;0.9107;0.9442;1.0000" values="0;0;1;1;0;0"/></rect><rect x="852" y="460" width="702" height="88" rx="10" fill="none" stroke="#A3E635" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.6540;0.6875;0.9107;0.9442;1.0000" values="0;0;1;1;0;0"/></rect><rect x="1420" y="58" width="150" height="28" fill="#1C1917" opacity="0"><animate attributeName="opacity" dur="4.48s" repeatCount="indefinite" keyTimes="0.0000;0.3906;0.4241;0.9107;0.9442;1.0000" values="0.7;0.7;0;0;0.7;0.7"/></rect></g></svg>
