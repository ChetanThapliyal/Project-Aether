<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 690" width="1600" height="690" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="Top: the Ubuntu 24.04 cloud image is imported into VM 9000 with a disk, a cloud-init drive and a serial console, then frozen as template 9000. Bottom: template 9000 is fully cloned for each node, and cloud-init settings give each clone its user, SSH key, IP config and hostname, producing the control VM and two workers. Terraform now does the cloning."><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A8A29E"/></marker><marker id="arr-2d7b9e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2D7B9E"/></marker><marker id="arr-6d9429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6D9429"/></marker><marker id="arr-38bdf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker><marker id="arr-a3e635" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A3E635"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="1600" height="690" fill="#1C1917"/><text x="40" y="46" font-size="30" font-weight="800" fill="#F5F5F4" text-anchor="start">Project Aether</text><text x="262" y="46" font-size="22" font-weight="700" fill="#FB923C" text-anchor="start">one template, many nodes</text><text x="1576" y="46" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="end">as of 18 Nov 2026</text><text x="40" y="74" font-size="15" font-weight="400" fill="#A8A29E" text-anchor="start">Build the image once and never edit it. Give each clone its identity through cloud-init at first boot.</text><text x="1071" y="76" font-size="12.5" font-weight="700" fill="#A8A29E" text-anchor="start" letter-spacing="0.08em">TWO HALVES</text><circle cx="1189" cy="72" r="6" fill="#38BDF8"/><text x="1201" y="77" font-size="13.5" font-weight="600" fill="#F5F5F4" text-anchor="start">the image, built once</text><circle cx="1378" cy="72" r="6" fill="#A3E635"/><text x="1390" y="77" font-size="13.5" font-weight="600" fill="#F5F5F4" text-anchor="start">the identity, per clone</text><rect x="40" y="110" width="1536" height="236" rx="14" fill="#231F1D" stroke="#57534E" stroke-width="1.5"/><text x="64" y="142" font-size="12.5" font-weight="700" fill="#A8A29E" text-anchor="start" letter-spacing="0.08em">BUILD ONCE · THE IMAGE</text><rect x="64" y="166" width="300" height="116" rx="9" fill="#292524" stroke="#57534E" stroke-width="1.5"/><text x="214.0" y="194" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Ubuntu 24.04 cloud image</text><text x="214.0" y="215" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">the official cloud image,</text><text x="214.0" y="233" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">cloud-init already inside</text><rect x="452" y="166" width="320" height="116" rx="9" fill="#292524" stroke="#57534E" stroke-width="1.5"/><text x="612.0" y="194" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">VM 9000</text><text x="612.0" y="215" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">imported disk on scsi0</text><text x="612.0" y="233" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">cloud-init drive on ide2</text><text x="612.0" y="251" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">serial console, boot from disk</text><rect x="860" y="166" width="300" height="116" rx="9" fill="#292524" stroke="#38BDF8" stroke-width="1.5"/><text x="1010.0" y="194" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Template 9000</text><text x="1010.0" y="215" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">frozen: can&#x27;t start, only clone</text><text x="1010.0" y="233" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">base disk 3.5 GiB</text><path d="M364,224 L450,224" fill="none" stroke="#2D7B9E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-2d7b9e)"/><text x="407" y="212" font-size="12.5" font-weight="600" fill="#A8A29E" text-anchor="middle">import</text><path d="M772,224 L858,224" fill="none" stroke="#2D7B9E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-2d7b9e)"/><text x="815" y="212" font-size="12.5" font-weight="600" fill="#A8A29E" text-anchor="middle">template</text><text x="1200" y="196" font-size="15" font-weight="600" fill="#F5F5F4" text-anchor="start">Nothing node-specific is baked in:</text><text x="1200" y="222" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="start">no user, no key, no address, no hostname.</text><text x="1200" y="246" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="start">Changing the image means building a</text><text x="1200" y="270" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="start">new template, not editing this one.</text><rect x="40" y="370" width="1536" height="280" rx="14" fill="#231F1D" stroke="#57534E" stroke-width="1.5"/><text x="64" y="402" font-size="12.5" font-weight="700" fill="#A8A29E" text-anchor="start" letter-spacing="0.08em">CLONE PER NODE · THE IDENTITY</text><rect x="64" y="448" width="300" height="116" rx="9" fill="#292524" stroke="#38BDF8" stroke-width="1.5"/><text x="214.0" y="476" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Template 9000</text><text x="214.0" y="497" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">full clone for each node</text><rect x="452" y="448" width="320" height="116" rx="9" fill="#292524" stroke="#A3E635" stroke-width="1.5"/><text x="612.0" y="476" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Cloud-init settings</text><text x="612.0" y="497" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">user and SSH key</text><text x="612.0" y="515" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">IP config and hostname</text><text x="612.0" y="533" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="middle">disk resized before first boot</text><path d="M364,506 L450,506" fill="none" stroke="#6D9429" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-6d9429)"/><text x="407" y="494" font-size="12.5" font-weight="600" fill="#A8A29E" text-anchor="middle">clone</text><rect x="860" y="420" width="300" height="56" rx="9" fill="#292524" stroke="#EA580C" stroke-width="1.5"/><text x="1010.0" y="448" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Control VM</text><path d="M772,506 L816,506 L816,448 L858,448" fill="none" stroke="#6D9429" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-6d9429)"/><rect x="860" y="490" width="300" height="56" rx="9" fill="#292524" stroke="#EA580C" stroke-width="1.5"/><text x="1010.0" y="518" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Worker 1</text><path d="M772,506 L816,506 L816,518 L858,518" fill="none" stroke="#6D9429" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-6d9429)"/><rect x="860" y="560" width="300" height="56" rx="9" fill="#292524" stroke="#EA580C" stroke-width="1.5"/><text x="1010.0" y="588" font-size="16" font-weight="700" fill="#F5F5F4" text-anchor="middle">Worker 2</text><path d="M772,506 L816,506 L816,588 L858,588" fill="none" stroke="#6D9429" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-6d9429)"/><text x="1200" y="460" font-size="15" font-weight="600" fill="#F5F5F4" text-anchor="start">Each clone reads its own cloud-init drive</text><text x="1200" y="486" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="start">on first boot and becomes a K3s node.</text><text x="1200" y="510" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="start">A broken node is destroyed and cloned again:</text><text x="1200" y="534" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="start">recovery is a rebuild, not a repair.</text><text x="1200" y="566" font-size="14" font-weight="400" fill="#A8A29E" text-anchor="start">Today Terraform does the cloning.</text><text x="40" y="674" font-size="13" font-weight="400" fill="#A8A29E" text-anchor="start">Source: the qm commands in this post; Terraform&#x27;s 03-homelab root clones template 9000 for every node.</text><g class="anim" pointer-events="none"><path d="M364,224 L450,224" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-38bdf8)" opacity="0"><animate attributeName="opacity" dur="5.06s" repeatCount="indefinite" keyTimes="0.0000;0.0296;0.0593;0.4704;0.5000;1.0000" values="0;0;1;1;0;0"/></path><g opacity="0"><animate attributeName="opacity" dur="5.06s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0593;0.1581;1" values="0;1;0;0"/><animateMotion dur="5.06s" repeatCount="indefinite" path="M364,224 L450,224" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0593;0.1581;1"/><circle r="12" fill="#38BDF8" fill-opacity="0.28"/><circle r="6" fill="#38BDF8" stroke="#F5F5F4" stroke-width="2"/></g><path d="M772,224 L858,224" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-38bdf8)" opacity="0"><animate attributeName="opacity" dur="5.06s" repeatCount="indefinite" keyTimes="0.0000;0.1443;0.1739;0.4704;0.5000;1.0000" values="0;0;1;1;0;0"/></path><g opacity="0"><animate attributeName="opacity" dur="5.06s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1739;0.2727;1" values="0;1;0;0"/><animateMotion dur="5.06s" repeatCount="indefinite" path="M772,224 L858,224" calcMode="linear" keyPoints="0;0;1;1" keyT