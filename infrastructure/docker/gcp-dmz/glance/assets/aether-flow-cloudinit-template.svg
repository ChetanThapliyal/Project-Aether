circle r="12" fill="#A3E635" fill-opacity="0.28"/><circle r="6" fill="#A3E635" stroke="#F5F5F4" stroke-width="2"/></g><rect x="62" y="446" width="304" height="120" rx="10" fill="none" stroke="#A3E635" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.06s" repeatCount="indefinite" keyTimes="0.0000;0.4605;0.4901;0.9209;0.9506;1.0000" values="0;0;1;1;0;0"/></rect><rect x="450" y="446" width="324" height="120" rx="10" fill="none" stroke="#A3E635" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.06s" repeatCount="indefinite" keyTimes="0.0000;0.5791;0.6087;0.9209;0.9506;1.0000" values="0;0;1;1;0;0"/></rect><rect x="858" y="418" width="304" height="60" rx="10" fill="none" stroke="#A3E635" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.06s" repeatCount="indefinite" keyTimes="0.0000;0.6937;0.7233;0.9209;0.9506;1.0000" values="0;0;1;1;0;0"/></rect><rect x="858" y="488" width="304" height="60" rx="10" fill="none" stroke="#A3E635" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.06s" repeatCount="indefinite" keyTimes="0.0000;0.6937;0.7233;0.9209;0.9506;1.0000" values="0;0;1;1;0;0"/></rect><rect x="858" y="558" width="304" height="60" rx="10" fill="none" stroke="#A3E635" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.06s" repeatCount="indefinite" keyTimes="0.0000;0.6937;0.7233;0.9209;0.9506;1.0000" values="0;0;1;1;0;0"/></rect><rect x="1368" y="58" width="202" height="28" fill="#1C1917" opacity="0"><animate attributeName="opacity" dur="5.06s" repeatCount="indefinite" keyTimes="0.0000;0.4605;0.4901;0.9209;0.9506;1.0000" values="0.7;0.7;0;0;0.7;0.7"/></rect></g></svg>
