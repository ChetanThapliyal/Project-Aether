# =============================================================================
# Project Aether — GCP DMZ Observability Stack
# =============================================================================
# Services:
#   1. Uptime Kuma  : Independent external synthetic monitoring & status pages
#   2. Glance       : Public platform page (HARD-17: no tailnet names, no fake vitals)
#   3. Hawser       : Dockhand agent
#   4. Cloudflared  : Zero-Trust edge ingress tunnel (activated via profile)
#
# Images are pinned as tag@digest (FND-08), so Dependabot can propose a bump and
# nothing changes without a commit. The deploy pulls only images that are missing.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Uptime Kuma — Synthetic Monitoring
  # ---------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      # Direct access over Tailscale mesh (aether-gcp-dmz:3001)
      - "3001:3001"
    volumes:
      - ./uptime-kuma:/app/data
    networks:
      - dmz-net
    environment:
      - UPTIME_KUMA_PORT=3001

  # ---------------------------------------------------------------------------
  # Glance — Ultra-Lightweight Platform Dashboard (OPS-10)
  # ---------------------------------------------------------------------------
  glance:
    image: glanceapp/glance:v0.8.8@sha256:4d7445bc7971836858ffddee5d7501f1efbabb6e694a45b1dde1a789bb1943bb
    container_name: glance
    restart: unless-stopped
    ports:
      # Direct access over Tailscale mesh & Cloudflare Tunnel (aether-gcp-dmz:3000)
      - "3000:8080"
    volumes:
      - ./glance:/app/config:ro
      - ./glance/assets:/app/assets:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - dmz-net

  # ---------------------------------------------------------------------------
  # Hawser — Dockhand Agent (OPS-01)
  # ---------------------------------------------------------------------------
  hawser:
    image: ghcr.io/finsys/hawser:0.2.53
    container_name: hawser
    restart: unless-stopped
    ports:
      # Binding to all interfaces. GCP Firewall blocks inbound 2376 by default,
      # and the VM has no public IPv4 anyway. This allows Tailscale IPv6 to work.
      - "2376:2376"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: uncomment if you want Dockhand to manage volumes too
      # - /var/lib/docker/volumes:/data/volumes
    environment:
      # Since it binds to 0.0.0.0 internally, Hawser requires a token to start
      - TOKEN=${HAWSER_TOKEN}
    command: standard --port 2376
    networks:
      - dmz-net

  # ---------------------------------------------------------------------------
  # Cloudflared — Zero-Trust Ingress Tunnel
  # ---------------------------------------------------------------------------
  # Activated automatically when COMPOSE_PROFILES=tunnel is set in .env
  # (i.e. when CLOUDFLARE_TUNNEL_TOKEN is provisioned).
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7  # Pinned 2026-10 (IaC-05)
    container_name: cloudflared
    restart: unless-stopped
    profiles:
      - tunnel
    networks:
      - dmz-net
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # The DMZ has no IPv4 (FND-10): cloudflared defaults to IPv4 edge addresses,
    # so pin it to IPv6. Outbound only (7844 QUIC, TCP fallback); no inbound port.
    command: tunnel --no-autoupdate --edge-ip-version 6 run

networks:
  dmz-net:
    name: dmz-net
    driver: bridge
    # FND-08 M13 / INC-2026-004: the DMZ VM has no public IPv4 (terraform/02-gcp-dmz,
    # cost choice), so its only route to the internet is IPv6. Without IPv6 here no
    # container can reach anything public, and Kuma's Telegram alerts time out.
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:d3a2::/64   # ULA; Docker NATs it out through the host's IPv6
