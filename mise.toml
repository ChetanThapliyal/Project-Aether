# Project Aether workstation tool pins (FND-07).
# `mise install` in the repo root installs exactly these; inside the repo they
# take precedence over system copies. CI pins the same Terraform and SOPS
# versions in .github/workflows/terraform-drift.yml. Ansible and pre-commit come
# from pip/pipx and are not managed here.
[tools]
terraform   = "1.15.9"
sops        = "3.13.3"
age         = "1.3.2"
kubeconform = "0.8.0"
helm        = "4.3.1"
kubectl     = "1.36.4"   # matches the cluster (v1.36.4+k3s1)
task        = "3.54.0"   # go-task
restic      = "0.19.1"   # restore drills; Proxmox runs 0.18.0 (same repo format v2, compatible)
