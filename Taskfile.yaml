version: "3"

# Automatically load the .env file containing your Proxmox secrets
dotenv: [".env"]

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task -l
    silent: true

  # ==========================================
  # GitOps & Pre-commit
  # ==========================================
  setup:
    desc: "Install pre-commit hooks to your local repository"
    cmds:
      - pre-commit install

  # ==========================================
  # SOPS Operations
  # ==========================================
  encrypt:
    desc: "Encrypt a secret file (Usage: task encrypt FILE=path/to/file.yaml)"
    cmds:
      - sops --encrypt --in-place {{.FILE}}
    requires:
      vars: [FILE]

  decrypt:
    desc: "Decrypt a secret file (Usage: task decrypt FILE=path/to/file.yaml)"
    cmds:
      - sops --decrypt --in-place {{.FILE}}
    requires:
      vars: [FILE]

  # ==========================================
  # Terraform Operations
  # ==========================================
  tf:init:
    desc: "Initialize Terraform"
    dir: infrastructure/terraform
    cmds:
      - terraform init

  tf:plan:
    desc: "Preview infrastructure changes"
    dir: infrastructure/terraform
    cmds:
      - terraform plan

  tf:apply:
    desc: "Deploy infrastructure"
    dir: infrastructure/terraform
    cmds:
      - terraform apply

  # ==========================================
  # Ansible Operations
  # ==========================================
  ansible:common:
    desc: "Run common setup on all nodes"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/common.yml

  ansible:control:
    desc: "Initialize K3s control plane"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/control.yml

  ansible:workers:
    desc: "Join worker nodes to the cluster"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/workers.yml

  ansible:kubeconfig:
    desc: "Fetch kubeconfig from control node"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/kubeconfig.yml

  ansible:bootstrap:
    desc: "Full cluster bootstrap (common → control → workers → kubeconfig)"
    cmds:
      - task: ansible:common
      - task: ansible:control
      - task: ansible:workers
      - task: ansible:kubeconfig
