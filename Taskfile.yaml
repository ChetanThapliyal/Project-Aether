version: "3"

# Infrastructure credentials are supplied by SOPS-encrypted tfvars
# (decrypted per task) and gcloud Application Default Credentials.
# No repository-level .env file is used by this Taskfile.
vars:
  ARGOCD_CHART_VERSION: "10.11.7"

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task -l
    silent: true

  # ==========================================
  # GitOps & Pre-commit
  # ==========================================
  setup:
    desc: "Install pre-commit hooks to your local repository"
    cmds:
      - pre-commit install

  # ==========================================
  # SOPS Operations
  # ==========================================
  encrypt:
    desc: "Encrypt a secret file (Usage: task encrypt FILE=path/to/file.yaml)"
    cmds:
      - sops --encrypt --in-place {{.FILE}}
    requires:
      vars: [FILE]

  decrypt:
    desc: "Decrypt a secret file (Usage: task decrypt FILE=path/to/file.yaml)"
    cmds:
      - sops --decrypt --in-place {{.FILE}}
    requires:
      vars: [FILE]

  # ==========================================
  # Terraform Operations
  # ==========================================
  # Usage:
  #   task tf:init   DIR=01-oci-compute
  #   task tf:plan   DIR=03-homelab
  #   task tf:apply  DIR=01-oci-compute
  #
  # Each directory can have a terraform.sops.tfvars file.
  # If present, it is decrypted on-the-fly and passed to
  # Terraform automatically. The decrypted file is cleaned
  # up afterwards (even on failure).
  # ==========================================

  tf:init:
    desc: "Initialize Terraform (Usage: task tf:init DIR=03-homelab)"
    dir: "infrastructure/terraform/{{.DIR}}"
    cmds:
      - terraform init
    requires:
      vars: [DIR]

  tf:plan:
    desc: "Preview infrastructure changes (Usage: task tf:plan DIR=03-homelab)"
    dir: "infrastructure/terraform/{{.DIR}}"
    cmds:
      - |
        if [ -f terraform.sops.tfvars ]; then
          sops -d --config "{{.ROOT_DIR}}/.sops.yaml" terraform.sops.tfvars > .decrypted.auto.tfvars
          trap "rm -f .decrypted.auto.tfvars" EXIT
        fi
        terraform plan
    requires:
      vars: [DIR]

  tf:apply:
    desc: "Deploy infrastructure (Usage: task tf:apply DIR=03-homelab)"
    dir: "infrastructure/terraform/{{.DIR}}"
    cmds:
      - |
        if [ -f terraform.sops.tfvars ]; then
          sops -d --config "{{.ROOT_DIR}}/.sops.yaml" terraform.sops.tfvars > .decrypted.auto.tfvars
          trap "rm -f .decrypted.auto.tfvars" EXIT
        fi
        terraform apply
    requires:
      vars: [DIR]

  tf:destroy:
    desc: "Destroy infrastructure (Usage: task tf:destroy DIR=03-homelab)"
    dir: "infrastructure/terraform/{{.DIR}}"
    cmds:
      - |
        if [ -f terraform.sops.tfvars ]; then
          sops -d --config "{{.ROOT_DIR}}/.sops.yaml" terraform.sops.tfvars > .decrypted.auto.tfvars
          trap "rm -f .decrypted.auto.tfvars" EXIT
        fi
        terraform destroy
    requires:
      vars: [DIR]

  # ==========================================
  # Ansible Operations
  # ==========================================
  ansible:common:
    desc: "Run common setup on all nodes"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/common.yml

  ansible:control:
    desc: "Initialize K3s control plane"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/control.yml

  ansible:workers:
    desc: "Join worker nodes to the cluster"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/workers.yml

  ansible:kubeconfig:
    desc: "Fetch kubeconfig from control node"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/kubeconfig.yml

  ansible:bootstrap:
    desc: "Full cluster bootstrap (common → control → workers → kubeconfig)"
    cmds:
      - task: ansible:common
      - task: ansible:control
      - task: ansible:workers
      - task: ansible:kubeconfig

  ansible:oci:
    desc: "Deploy all OCI server applications (master playbook)"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/bootstrap-oci.yml {{.CLI_ARGS}}

  ansible:oci:base:
    desc: "Configure OCI base system, Docker runtime, and networking"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/oci-base.yml {{.CLI_ARGS}}

  ansible:oci:apps:
    desc: "Deploy OCI application containers (Usage: task ansible:oci:apps -- --tags n8n)"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/oci-apps.yml {{.CLI_ARGS}}

  ansible:oci:monitoring:
    desc: "Deploy OCI Prometheus and Grafana monitoring stack"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/oci-monitoring.yml {{.CLI_ARGS}}

  ansible:proxmox:base:
    desc: "Proxmox VE host baseline: reboot on panic, disable unused services (INC-2026-012)"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/proxmox-base.yml {{.CLI_ARGS}}

  ansible:proxmox:monitoring:
    desc: "Deploy Node Exporter on physical Proxmox VE host"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/proxmox-monitoring.yml {{.CLI_ARGS}}

  ansible:etcd:sync:
    desc: "Deploy automated off-node etcd snapshot sync to Proxmox (DR-02)"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/proxmox-etcd-sync.yml {{.CLI_ARGS}}

  ansible:etcd:restic:
    desc: "Deploy automated encrypted Restic repository for etcd on Proxmox (DR-03)"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/proxmox-etcd-restic.yml {{.CLI_ARGS}}

  ansible:etcd:b2:
    desc: "Deploy automated Backblaze B2 offsite etcd replication on Proxmox (DR-04)"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/proxmox-etcd-b2.yml {{.CLI_ARGS}}

  ansible:oci:ops:
    desc: "Configure OCI operational automation (Telegram alerts, Restic backups)"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/oci-ops.yml {{.CLI_ARGS}}

  ansible:dmz:
    desc: "Deploy GCP DMZ observability stack (Uptime Kuma, Glance, Cloudflared)"
    dir: infrastructure/ansible
    cmds:
      - ansible-playbook playbooks/deploy-dmz.yml {{.CLI_ARGS}}

  # ==========================================
  # Kubernetes & ArgoCD Operations
  # ==========================================
  k8s:sops-secret:
    desc: "Inject SOPS Age private key into argocd namespace"
    cmds:
      - kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      - >-
        kubectl create secret generic argocd-sops-age-key
        --namespace argocd
        --from-file=keys.txt=${SOPS_AGE_KEY_FILE:-$HOME/.config/sops/age/keys.txt}
        --dry-run=client -o yaml | kubectl apply -f -

      - kubectl label --overwrite ns argocd pod-security.kubernetes.io/enforce=baseline pod-security.kubernetes.io/warn=restricted pod-security.kubernetes.io/audit=restricted

  k8s:bootstrap-argocd:
    desc: "Install or upgrade ArgoCD via Helm with homelab tuning"
    deps: [k8s:sops-secret]
    cmds:
      - helm repo add argo https://argoproj.github.io/argo-helm
      - helm repo update argo
      - kubectl apply -f kubernetes/bootstrap/argocd/cmp-ksops-config.yaml
      - >-
        helm upgrade --install argocd argo/argo-cd
        --version {{.ARGOCD_CHART_VERSION}}
        --namespace argocd
        --values kubernetes/bootstrap/argocd/values.yaml
        --wait --timeout 5m --rollback-on-failure

  argocd:password:
    desc: "Get ArgoCD initial admin password"
    cmds:
      - kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d && echo ""
    silent: true

  argocd:port-forward:
    desc: "Port-forward ArgoCD server to localhost:8090"
    cmds:
      - kubectl port-forward svc/argocd-server -n argocd ${ARGOCD_PORT:-8090}:80

  argocd:drift:
    desc: "Fail if the live ArgoCD Helm release differs from Git (values or chart version)"
    cmds:
      - |
        python3 - <<'EOF'
        import json, subprocess, sys, yaml
        live = yaml.safe_load(subprocess.check_output(["helm", "get", "values", "argocd", "-n", "argocd", "-o", "yaml"]))
        git = yaml.safe_load(open("kubernetes/bootstrap/argocd/values.yaml"))
        rel = json.loads(subprocess.check_output(["helm", "list", "-n", "argocd", "-f", "^argocd$", "-o", "json"]))[0]
        problems = []
        if live != git:
            problems.append("values differ from kubernetes/bootstrap/argocd/values.yaml")
        if rel["chart"] != "argo-cd-{{.ARGOCD_CHART_VERSION}}":
            problems.append(f"chart is {rel['chart']}, Git pins argo-cd-{{.ARGOCD_CHART_VERSION}}")
        if problems:
            sys.exit("DRIFT: " + "; ".join(problems) + ". Run: task k8s:bootstrap-argocd")
        print(f"ok: {rel['chart']} rev {rel['revision']} matches Git")
        EOF

  lint:helm-values:
    desc: "Fail on Helm values keys the pinned chart does not define (Bugs G/N/X class)"
    cmds:
      - python3 scripts/check-helm-values.py

  lint:tracked-refs:
    desc: "Fail if Ansible references files Git does not track"
    cmds:
      - bash scripts/check-tracked-refs.sh
