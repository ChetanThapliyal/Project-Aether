<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 180" width="1280" height="180" role="img" aria-label="Project Aether: hybrid-cloud platform, run like production" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EA580C"/><stop offset=".55" stop-color="#FBBF24"/><stop offset="1" stop-color="#FB7185"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EA580C" stop-opacity="0"/><stop offset=".25" stop-color="#EA580C"/><stop offset=".6" stop-color="#D97706"/><stop offset="1" stop-color="#E11D48"/></linearGradient>
  </defs>
  <rect width="1280" height="180" rx="16" fill="#1C1917"/>
  <!-- wordmark -->
  <text x="56" y="96" font-size="46" font-weight="800" letter-spacing="-1" fill="#F5F5F4">Project <tspan fill="url(#g)">Aether</tspan></text>
  <text x="58" y="130" font-size="17" fill="#A8A29E" letter-spacing=".3">Hybrid-cloud platform, run like production</text>
  <!-- three sites on one mesh: on-prem, Oracle Cloud, DMZ -->
  <path d="M640 90 H1020 M1020 90 L1120 54 M1020 90 L1120 126" fill="none" stroke="url(#fade)" stroke-width="2"/>
  <circle cx="1020" cy="90" r="9" fill="#1C1917" stroke="#EA580C" stroke-width="3"/>
  <circle cx="1120" cy="54" r="9" fill="#1C1917" stroke="#D97706" stroke-width="3"/>
  <circle cx="1120" cy="126" r="9" fill="#1C1917" stroke="#E11D48" stroke-width="3"/>
  <text x="1144" y="59" font-size="14" fill="#A8A29E">Oracle Cloud</text>
  <text x="1144" y="131" font-size="14" fill="#A8A29E">Google Cloud</text>
  <text x="1020" y="124" font-size="14" fill="#A8A29E" text-anchor="middle">home lab</text>
</svg>
